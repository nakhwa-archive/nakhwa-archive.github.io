        ctx.moveTo(0, -84); ctx.lineTo(0, -72);
        ctx.moveTo(-8, -78); ctx.lineTo(8, -78);
        ctx.stroke();
      }

      ctx.fillStyle = "#d90429";
      if (eBoxerState === "guard") {
        ctx.beginPath(); ctx.arc(-18, -36, 16, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(18, -36, 16, 0, Math.PI * 2); ctx.fill();
      } else if (eBoxerState === "telegraphL") {
        ctx.beginPath(); ctx.arc(-48, -22, 18, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(22, -32, 15, 0, Math.PI * 2); ctx.fill();
      } else if (eBoxerState === "telegraphR") {
        ctx.beginPath(); ctx.arc(-22, -32, 15, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(48, -22, 18, 0, Math.PI * 2); ctx.fill();
      } else if (eBoxerState === "telegraphBoth") {
        ctx.beginPath(); ctx.arc(-46, -10, 18, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(46, -10, 18, 0, Math.PI * 2); ctx.fill();
      } else if (eBoxerState === "attackL") {
        ctx.beginPath(); ctx.arc(-28, 38, 28, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(24, -28, 15, 0, Math.PI * 2); ctx.fill();
      } else if (eBoxerState === "attackR") {
        ctx.beginPath(); ctx.arc(-24, -28, 15, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(28, 38, 28, 0, Math.PI * 2); ctx.fill();
      } else if (eBoxerState === "attackBoth") {
        ctx.beginPath(); ctx.arc(-24, 42, 26, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(24, 42, 26, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(-42, 14, 15, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(42, 14, 15, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();

      ctx.save();
      let px = 170;
      let py = 325;
      if (pBoxerState === "dodgeL") px -= 56;
      if (pBoxerState === "dodgeR") px += 56;
      if (pBoxerState === "hurt") py += 14;

      ctx.translate(px, py);

      ctx.fillStyle = "#e65c7b";
      ctx.fillRect(-24, 24, 48, 26);
      ctx.fillStyle = pBoxerState === "hurt" ? "#ff4d6d" : "#f4c2a1";
      ctx.fillRect(-26, -14, 52, 38);
      ctx.fillStyle = "#222228";
      ctx.beginPath();
      ctx.arc(0, -28, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#e65c7b";
      ctx.fillRect(-18, -32, 36, 5);

      ctx.fillStyle = "#ff8ca5";
      if (pBoxerState === "punch") {
        ctx.beginPath(); ctx.arc(0, -115, 20, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(-28, -14, 13, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(28, -14, 13, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();

      ctx.fillStyle = "rgba(15, 15, 18, 0.72)";
      ctx.fillRect(0, 372, canvas.width, 38);

      ctx.fillStyle = "#282832";
      ctx.fillRect(14, 380, 130, 10);
      ctx.fillStyle = pBoxerHp > 30 ? "#72efdd" : "#ff4d6d";
      ctx.fillRect(14, 380, 130 * Math.max(0, pBoxerHp / 100), 10);

      ctx.fillStyle = "#ffd166";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(`STAMINA ${"⚡".repeat(pBoxerStamina)}`, 326, 389);

      ctx.fillStyle = "#9898a6";
      ctx.font = "600 10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("◀ 좌회피  |  🥊 펀치(중앙)  |  우회피 ▶", 170, 403);

      if (punchPopupTimer > 0) {
        ctx.fillStyle = "#ffd166";
        ctx.font = "900 17px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(punchPopupText, 170, 82);
      }

      if (punchOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`🥊 다운! 최종 ${punchScore}점 (R${punchRound})`, canvas.width / 2, 190);
        if (isNewBestPending) {
          ctx.fillStyle = "#ffd166";
          ctx.font = "bold 13px sans-serif";
          ctx.fillText("🎉 신기록! 아래에서 기록을 등록해 주세요", canvas.width / 2, 220);
        } else {
          ctx.fillStyle = "#ff8ca5";
          ctx.font = "600 13px sans-serif";
          ctx.fillText("화면을 터치하면 다시 도전합니다", canvas.width / 2, 220);
        }
      }

      ctx.restore();
    }

    /* ---------- 10. 벚꽃 벽돌깨기 (Brick Breaker) 상태 ---------- */
    const BRICK_PALETTE = [
      { fill: "#e65c7b", stroke: "#ff8ca5" },
      { fill: "#ff9eb5", stroke: "#ffd1dc" },
      { fill: "#ffd166", stroke: "#ffe8a3" },
      { fill: "#72efdd", stroke: "#b8f7ee" },
      { fill: "#a8d5ba", stroke: "#d4edde" }
    ];

    let brickRunning = false;
    let brickOver = false;
    let brickScore = 0;
    let brickBest = Number(localStorage.getItem("nakhwaBrickBest") || 0);
    let brickStage = 1;
    let brickLives = 3;
    let brickSessionHadBest = false;

    const brickPaddle = {
      x: 170,
      y: 378,
      w: 76,
      h: 11,
      speed: 5.5,
      wideTimer: 0
    };

    let brickBalls = [];
    let brickBlocks = [];
    let brickItems = [];
    let brickParticles = [];
    let brickDragging = false;
    let brickLastDragX = 0;

    function buildBrickStage(stage) {
      brickBlocks = [];
      const rows = Math.min(7, 4 + Math.floor(stage / 2));
      const cols = 7;
      const padX = 12;
      const gap = 4;
      const totalGap = gap * (cols - 1);
      const bw = Math.floor((340 - padX * 2 - totalGap) / cols);
      const bh = 16;
      const startY = 54;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const isHard = stage >= 2 && r === 0 && (c % 2 === 0);
          brickBlocks.push({
            x: padX + c * (bw + gap),
            y: startY + r * (bh + gap),
            w: bw,
            h: bh,
            hp: isHard ? 2 : 1,
            maxHp: isHard ? 2 : 1,
            colorIdx: r % BRICK_PALETTE.length
          });
        }
      }
    }

    function spawnAnchoredBrickBall() {
      brickBalls = [{
        x: brickPaddle.x,
        y: brickPaddle.y - 12,
        vx: 0,
        vy: 0,
        r: 6,
        stuck: true
      }];
    }

    function launchStuckBrickBalls() {
      const baseSpeed = 4.2 + Math.min(2.2, (brickStage - 1) * 0.3);
      for (const b of brickBalls) {
        if (b.stuck) {
          b.stuck = false;
          const ang = -Math.PI / 2 + (Math.random() - 0.5) * 0.55;
          b.vx = Math.cos(ang) * baseSpeed;
          b.vy = Math.sin(ang) * baseSpeed;
        }
      }
    }

    function resetBrick() {
      brickScore = 0;
      brickStage = 1;
      brickLives = 3;
      brickPaddle.x = 170;
      brickPaddle.w = 76;
      brickPaddle.wideTimer = 0;
      brickItems = [];
      brickParticles = [];
      brickOver = false;
      brickRunning = true;
      brickDragging = false;
      brickSessionHadBest = false;
      isNewBestPending = false;
      hideSubmitBar();
      buildBrickStage(1);
      spawnAnchoredBrickBall();
    }

    function spawnBrickBurst(x, y, color) {
      for (let i = 0; i < 8; i++) {
        const ang = (Math.PI * 2 * i) / 8 + Math.random() * 0.4;
        const spd = 1.2 + Math.random() * 2.4;
        brickParticles.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          r: 2.2,
          color,
          life: 20
        });
      }
    }

    function applyBrickItem(type) {
      if (type === "W") {
        brickPaddle.w = 112;
        brickPaddle.wideTimer = 600;
      } else if (type === "M") {
        const src = brickBalls.find(b => !b.stuck) || brickBalls[0];
        if (src && brickBalls.length < 9) {
          const spd = Math.hypot(src.vx, src.vy) || 4.4;
          [-0.45, 0.45].forEach(offset => {
            const ang = -Math.PI / 2 + offset;
            brickBalls.push({
              x: src.x,
              y: src.y,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd,
              r: 6,
              stuck: false
            });
          });
        }
      } else if (type === "+") {
        brickLives = Math.min(5, brickLives + 1);
        brickScore += 150;
      }
    }

    function drawBrickFrame() {
      if (brickRunning && !brickOver) {
        if (brickPaddle.wideTimer > 0) {
          brickPaddle.wideTimer--;
          if (brickPaddle.wideTimer <= 0) brickPaddle.w = 76;
        }

        if (dodgeKeys.left) brickPaddle.x -= brickPaddle.speed;
        if (dodgeKeys.right) brickPaddle.x += brickPaddle.speed;
        const halfW = brickPaddle.w / 2;
        brickPaddle.x = Math.max(halfW + 6, Math.min(canvas.width - halfW - 6, brickPaddle.x));

        for (let bi = brickBalls.length - 1; bi >= 0; bi--) {
          const b = brickBalls[bi];
          if (b.stuck) {
            b.x = brickPaddle.x;
            b.y = brickPaddle.y - b.r - 2;
            continue;
          }

          b.x += b.vx;
          b.y += b.vy;

          if (b.x - b.r < 6) {
            b.x = 6 + b.r;
            b.vx = Math.abs(b.vx);
          } else if (b.x + b.r > canvas.width - 6) {
            b.x = canvas.width - 6 - b.r;
            b.vx = -Math.abs(b.vx);
          }
          if (b.y - b.r < 44) {
            b.y = 44 + b.r;
            b.vy = Math.abs(b.vy);
          }

          if (
            b.vy > 0 &&
            b.y + b.r >= brickPaddle.y &&
            b.y - b.r <= brickPaddle.y + brickPaddle.h &&
            b.x >= brickPaddle.x - halfW - b.r &&
            b.x <= brickPaddle.x + halfW + b.r
          ) {
            const hitRatio = Math.max(-1, Math.min(1, (b.x - brickPaddle.x) / halfW));
            const bounceAngle = -Math.PI / 2 + hitRatio * 1.05;
            const speed = Math.min(7.2, Math.hypot(b.vx, b.vy) * 1.01);
            b.vx = Math.cos(bounceAngle) * speed;
            b.vy = Math.sin(bounceAngle) * speed;
            b.y = brickPaddle.y - b.r - 1;
          }

          for (let i = brickBlocks.length - 1; i >= 0; i--) {
            const blk = brickBlocks[i];
            if (
              b.x + b.r > blk.x &&
              b.x - b.r < blk.x + blk.w &&
              b.y + b.r > blk.y &&
              b.y - b.r < blk.y + blk.h
            ) {
              const overlapLeft = (b.x + b.r) - blk.x;
              const overlapRight = (blk.x + blk.w) - (b.x - b.r);
              const overlapTop = (b.y + b.r) - blk.y;
              const overlapBottom = (blk.y + blk.h) - (b.y - b.r);
              const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

              if (minOverlap === overlapLeft || minOverlap === overlapRight) {
                b.vx = -b.vx;
              } else {
                b.vy = -b.vy;
              }

              blk.hp--;
              const pal = BRICK_PALETTE[blk.colorIdx];
              if (blk.hp <= 0) {
                brickScore += blk.maxHp === 2 ? 60 : 30;
                if (brickScore > brickBest) {
                  brickBest = brickScore;
                  brickSessionHadBest = true;
                  localStorage.setItem("nakhwaBrickBest", String(brickBest));
                }
                spawnBrickBurst(blk.x + blk.w / 2, blk.y + blk.h / 2, pal.fill);

                if (Math.random() < 0.18) {
                  const pool = ["W", "M", "+"];
                  const kind = pool[Math.floor(Math.random() * pool.length)];
                  brickItems.push({
                    x: blk.x + blk.w / 2,
                    y: blk.y + blk.h / 2,
                    vy: 2.2,
                    kind
                  });
                }

                brickBlocks.splice(i, 1);
              } else {
                spawnBrickBurst(blk.x + blk.w / 2, blk.y + blk.h / 2, "#ffffff");
              }
              break;
            }
          }

          if (b.y - b.r > canvas.height + 10) {
            brickBalls.splice(bi, 1);
          }
        }

        if (brickBalls.length === 0) {
          brickLives--;
          brickPaddle.w = 76;
          brickPaddle.wideTimer = 0;
          if (brickLives <= 0) {
            brickOver = true;
            triggerGameOver(brickSessionHadBest, brickScore > 0);
          } else {
            spawnAnchoredBrickBall();
          }
        }

        if (brickBlocks.length === 0 && !brickOver) {
          brickStage++;
          brickScore += 200;
          if (brickScore > brickBest) {
            brickBest = brickScore;
            brickSessionHadBest = true;
            localStorage.setItem("nakhwaBrickBest", String(brickBest));
          }
          brickItems = [];
          buildBrickStage(brickStage);
          spawnAnchoredBrickBall();
        }

        for (let i = brickItems.length - 1; i >= 0; i--) {
          const it = brickItems[i];
          it.y += it.vy;
          const halfW = brickPaddle.w / 2;
          if (
            it.y + 8 >= brickPaddle.y &&
            it.y - 8 <= brickPaddle.y + brickPaddle.h &&
            Math.abs(it.x - brickPaddle.x) <= halfW + 10
          ) {
            applyBrickItem(it.kind);
            if (brickScore > brickBest) {
              brickBest = brickScore;
              brickSessionHadBest = true;
              localStorage.setItem("nakhwaBrickBest", String(brickBest));
            }
            brickItems.splice(i, 1);
            continue;
          }
          if (it.y > canvas.height + 16) brickItems.splice(i, 1);
        }
      }

      ctx.strokeStyle = "#282832";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(6, 44);
      ctx.lineTo(canvas.width - 6, 44);
      ctx.stroke();

      ctx.fillStyle = "#f4f4f6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`SCORE ${brickScore}`, 12, 22);

      ctx.fillStyle = "#ff8ca5";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText(`STAGE ${brickStage}`, 12, 37);

      ctx.fillStyle = "#9898a6";
      ctx.textAlign = "right";
      ctx.fillText(`BEST ${brickBest}`, 328, 22);
      ctx.fillText("❤️".repeat(Math.max(0, brickLives)), 328, 38);

      for (const blk of brickBlocks) {
        const pal = BRICK_PALETTE[blk.colorIdx];
        ctx.fillStyle = blk.hp === 2 ? "#9898a6" : pal.fill;
        ctx.beginPath();
        ctx.roundRect(blk.x, blk.y, blk.w, blk.h, 4);
        ctx.fill();

        ctx.strokeStyle = blk.hp === 2 ? "#f4f4f6" : pal.stroke;
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
        ctx.fillRect(blk.x + 3, blk.y + 2, blk.w - 6, 2.5);
      }

      for (const it of brickItems) {
        ctx.fillStyle = it.kind === "W" ? "#4ea8de" : (it.kind === "M" ? "#e65c7b" : "#ffd166");
        ctx.beginPath();
        ctx.roundRect(it.x - 11, it.y - 7, 22, 14, 7);
        ctx.fill();

        ctx.fillStyle = it.kind === "+" ? "#121216" : "#ffffff";
        ctx.font = "bold 10px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(it.kind, it.x, it.y + 0.5);
      }
      ctx.textBaseline = "alphabetic";

      const pLeft = brickPaddle.x - brickPaddle.w / 2;
      ctx.fillStyle = brickPaddle.wideTimer > 0 ? "#4ea8de" : "#e65c7b";
      ctx.beginPath();
      ctx.roundRect(pLeft, brickPaddle.y, brickPaddle.w, brickPaddle.h, 5.5);
      ctx.fill();
      ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
      ctx.fillRect(pLeft + 8, brickPaddle.y + 2, brickPaddle.w - 16, 2.5);

      for (const b of brickBalls) {
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffb7c5";
        ctx.beginPath();
        ctx.arc(b.x - 1.5, b.y - 1.5, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      if (!brickOver && brickBalls.some(b => b.stuck)) {
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "bold 13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("터치 또는 스페이스바로 공 발사! 🌸", canvas.width / 2, 275);
      }

      for (let i = brickParticles.length - 1; i >= 0; i--) {
        const pt = brickParticles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = Math.max(0, pt.life / 20);
        ctx.fillRect(pt.x, pt.y, pt.r, pt.r);
        ctx.globalAlpha = 1;
        if (pt.life <= 0) brickParticles.splice(i, 1);
      }

      if (brickOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.78)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`🧱 게임 오버 · ${brickScore}점`, canvas.width / 2, 190);
        if (isNewBestPending) {
          ctx.fillStyle = "#ffd166";
          ctx.font = "bold 13px sans-serif";
          ctx.fillText("🎉 신기록! 아래에서 기록을 등록해 주세요", canvas.width / 2, 220);
        } else {
          ctx.fillStyle = "#ff8ca5";
          ctx.font = "600 13px sans-serif";
          ctx.fillText("화면을 터치하면 다시 시작합니다", canvas.width / 2, 220);
        }
      }
    }

    /* ---------- 11. 꼬리잡기 스네이크 (Snake) 상태 ---------- */
    const SNAKE_CELL = 20;
    const SNAKE_COLS = 16;
    const SNAKE_ROWS = 18;
    const SNAKE_OFFSET_X = 10;
    const SNAKE_OFFSET_Y = 44;

    let snakeRunning = false;
    let snakeOver = false;
    let snakeScore = 0;
    let snakeBest = Number(localStorage.getItem("nakhwaSnakeBest") || 0);
    let snakeBody = [];
    let snakeDir = { x: 1, y: 0 };
    let snakeDirQueue = [];
    let snakeFood = { x: 10, y: 9, isBonus: false, timer: 0 };
    let snakeLastStepTime = 0;
    let snakeSessionHadBest = false;
    let snakeSwipeStart = null;

    function spawnSnakeFood() {
      const occupied = new Set(snakeBody.map(seg => `${seg.x},${seg.y}`));
      const freeCells = [];
      for (let gx = 0; gx < SNAKE_COLS; gx++) {
        for (let gy = 0; gy < SNAKE_ROWS; gy++) {
          if (!occupied.has(`${gx},${gy}`)) {
            freeCells.push({ x: gx, y: gy });
          }
        }
      }
      if (freeCells.length === 0) return;
      const chosen = freeCells[Math.floor(Math.random() * freeCells.length)];
      const isBonus = snakeBody.length >= 6 && Math.random() < 0.25;
      snakeFood = {
        x: chosen.x,
        y: chosen.y,
        isBonus,
        timer: isBonus ? 90 : 0
      };
    }

    function resetSnake() {
      snakeBody = [
        { x: 6, y: 9 },
        { x: 5, y: 9 },
        { x: 4, y: 9 }
      ];
      snakeDir = { x: 1, y: 0 };
      snakeDirQueue = [];
      snakeScore = 0;
      snakeOver = false;
      snakeRunning = true;
      snakeSessionHadBest = false;
      snakeSwipeStart = null;
      snakeLastStepTime = performance.now();
      isNewBestPending = false;
      hideSubmitBar();
      spawnSnakeFood();
    }

    function queueSnakeDirection(nx, ny) {
      if (!snakeRunning || snakeOver) return;
      const lastDir = snakeDirQueue.length > 0 ? snakeDirQueue[snakeDirQueue.length - 1] : snakeDir;
      if ((nx === -lastDir.x && ny === -lastDir.y) || (nx === lastDir.x && ny === lastDir.y)) {
        return;
      }
      if (snakeDirQueue.length < 2) {
        snakeDirQueue.push({ x: nx, y: ny });
      }
    }

    function stepSnakeLogic() {
      if (!snakeRunning || snakeOver) return;

      const now = performance.now();
      const stepInterval = Math.max(72, 145 - (snakeBody.length - 3) * 2.4);
      if (now - snakeLastStepTime < stepInterval) return;
      snakeLastStepTime = now;

      if (snakeDirQueue.length > 0) {
        snakeDir = snakeDirQueue.shift();
      }

      const head = snakeBody[0];
      const nextX = head.x + snakeDir.x;
      const nextY = head.y + snakeDir.y;

      if (nextX < 0 || nextX >= SNAKE_COLS || nextY < 0 || nextY >= SNAKE_ROWS) {
        snakeOver = true;
        triggerGameOver(snakeSessionHadBest, snakeScore > 0);
        return;
      }

      const willEat = (nextX === snakeFood.x && nextY === snakeFood.y);
      const checkLimit = willEat ? snakeBody.length : snakeBody.length - 1;
      for (let i = 0; i < checkLimit; i++) {
        if (snakeBody[i].x === nextX && snakeBody[i].y === nextY) {
          snakeOver = true;
          triggerGameOver(snakeSessionHadBest, snakeScore > 0);
          return;
        }
      }

      snakeBody.unshift({ x: nextX, y: nextY });

      if (willEat) {
        snakeScore += snakeFood.isBonus ? 30 : 10;
        if (snakeScore > snakeBest) {
          snakeBest = snakeScore;
          snakeSessionHadBest = true;
          localStorage.setItem("nakhwaSnakeBest", String(snakeBest));
        }
        spawnSnakeFood();
      } else {
        snakeBody.pop();
        if (snakeFood.isBonus) {
          snakeFood.timer--;
          if (snakeFood.timer <= 0) {
            spawnSnakeFood();
          }
        }
      }
    }

    function drawSnakeFrame() {
      stepSnakeLogic();

      ctx.fillStyle = "#f4f4f6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`SCORE ${snakeScore}`, 12, 22);

      ctx.fillStyle = "#ff8ca5";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText(`길이 ${snakeBody.length}칸`, 12, 37);

      ctx.fillStyle = "#9898a6";
      ctx.textAlign = "right";
      ctx.fillText(`BEST ${snakeBest}`, 328, 22);
      ctx.fillText("스와이프 / 방향키", 328, 37);

      const boardW = SNAKE_COLS * SNAKE_CELL;
      const boardH = SNAKE_ROWS * SNAKE_CELL;
      ctx.fillStyle = "#16161d";
      ctx.fillRect(SNAKE_OFFSET_X, SNAKE_OFFSET_Y, boardW, boardH);

      for (let r = 0; r < SNAKE_ROWS; r++) {
        for (let c = 0; c < SNAKE_COLS; c++) {
          if ((r + c) % 2 === 0) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.022)";
            ctx.fillRect(
              SNAKE_OFFSET_X + c * SNAKE_CELL,
              SNAKE_OFFSET_Y + r * SNAKE_CELL,
              SNAKE_CELL,
              SNAKE_CELL
            );
          }
        }
      }

      ctx.strokeStyle = "#343442";
      ctx.lineWidth = 2;
      ctx.strokeRect(SNAKE_OFFSET_X, SNAKE_OFFSET_Y, boardW, boardH);

      const fx = SNAKE_OFFSET_X + snakeFood.x * SNAKE_CELL + SNAKE_CELL / 2;
      const fy = SNAKE_OFFSET_Y + snakeFood.y * SNAKE_CELL + SNAKE_CELL / 2;

      if (snakeFood.isBonus) {
        ctx.fillStyle = "#ffd166";
        ctx.beginPath();
        ctx.moveTo(fx, fy - 8);
        ctx.lineTo(fx + 8, fy);
        ctx.lineTo(fx, fy + 8);
        ctx.lineTo(fx - 8, fy);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.2;
        ctx.stroke();
      } else {
        ctx.fillStyle = "#ffb7c5";
        ctx.beginPath();
        ctx.arc(fx, fy, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(fx - 2, fy - 2, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = snakeBody.length - 1; i >= 0; i--) {
        const seg = snakeBody[i];
        const sx = SNAKE_OFFSET_X + seg.x * SNAKE_CELL;
        const sy = SNAKE_OFFSET_Y + seg.y * SNAKE_CELL;

        if (i === 0) {
          ctx.fillStyle = "#e65c7b";
          ctx.beginPath();
          ctx.roundRect(sx + 1, sy + 1, SNAKE_CELL - 2, SNAKE_CELL - 2, 6);
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          const eye1X = sx + SNAKE_CELL / 2 + snakeDir.x * 4 - (snakeDir.y !== 0 ? 4 : 0);
          const eye1Y = sy + SNAKE_CELL / 2 + snakeDir.y * 4 - (snakeDir.x !== 0 ? 4 : 0);
          const eye2X = sx + SNAKE_CELL / 2 + snakeDir.x * 4 + (snakeDir.y !== 0 ? 4 : 0);
          const eye2Y = sy + SNAKE_CELL / 2 + snakeDir.y * 4 + (snakeDir.x !== 0 ? 4 : 0);
          ctx.beginPath(); ctx.arc(eye1X, eye1Y, 2.2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(eye2X, eye2Y, 2.2, 0, Math.PI * 2); ctx.fill();
        } else {
          const shrink = Math.min(4, Math.floor(i / 4));
          const pad = 2 + shrink * 0.5;
          ctx.fillStyle = i % 2 === 1 ? "#ff8ca5" : "#ffb7c5";
          ctx.beginPath();
          ctx.roundRect(sx + pad, sy + pad, SNAKE_CELL - pad * 2, SNAKE_CELL - pad * 2, 5);
          ctx.fill();
        }
      }

      if (snakeOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.78)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`🐍 충돌! 최종 ${snakeScore}점 (${snakeBody.length}칸)`, canvas.width / 2, 190);
        if (isNewBestPending) {
          ctx.fillStyle = "#ffd166";
          ctx.font = "bold 13px sans-serif";
          ctx.fillText("🎉 신기록! 아래에서 기록을 등록해 주세요", canvas.width / 2, 220);
        } else {
          ctx.fillStyle = "#ff8ca5";
          ctx.font = "600 13px sans-serif";
          ctx.fillText("화면을 터치하면 다시 시작합니다", canvas.width / 2, 220);
        }
      }
    }

    /* ---------- 12. 낙화 무기 강화 (Weapon Enhancement) 상태 ---------- */
    const ENHANCE_TIERS = [
      { minLv: 0, title: "낡은 목검", blade: "#a47148", glow: "rgba(164, 113, 72, 0.25)", guard: "#6f4518" },
      { minLv: 3, title: "강철 장검", blade: "#cbd5e1", glow: "rgba(203, 213, 225, 0.3)", guard: "#64748b" },
      { minLv: 6, title: "벚꽃 명검", blade: "#ff9eb5", glow: "rgba(255, 158, 181, 0.45)", guard: "#e65c7b" },
      { minLv: 9, title: "홍염의 대검", blade: "#ff4d6d", glow: "rgba(255, 77, 109, 0.55)", guard: "#ffd166" },
      { minLv: 12, title: "낙화신검", blade: "#72efdd", glow: "rgba(114, 239, 221, 0.65)", guard: "#ffd166" },
      { minLv: 15, title: "천상의 성검", blade: "#ffd166", glow: "rgba(255, 209, 102, 0.8)", guard: "#ffffff" }
    ];

    let enhanceRunning = false;
    let enhanceOver = false;
    let enhanceLv = 0;
    let enhanceMaxLvThisRun = 0;
    let enhanceScore = 0;
    let enhanceBest = Number(localStorage.getItem("nakhwaEnhanceBest") || 0);
    let enhanceSessionHadBest = false;

    let enhanceResultBanner = "";
    let enhanceResultColor = "#f4f4f6";
    let enhanceBannerTimer = 0;
    let enhanceHammerAngle = 0;
    let enhanceShake = 0;
    let enhanceSparks = [];
    let enhanceEndReason = "";

    function getEnhanceRates(lv) {
      if (lv <= 3) return { success: 100, keep: 0, down: 0, destroy: 0 };
      if (lv === 4) return { success: 85, keep: 15, down: 0, destroy: 0 };
      if (lv === 5) return { success: 75, keep: 20, down: 5, destroy: 0 };
      if (lv === 6) return { success: 65, keep: 20, down: 10, destroy: 5 };
      if (lv === 7) return { success: 55, keep: 20, down: 15, destroy: 10 };
      if (lv === 8) return { success: 48, keep: 20, down: 17, destroy: 15 };
      if (lv === 9) return { success: 42, keep: 18, down: 20, destroy: 20 };
      if (lv === 10) return { success: 36, keep: 19, down: 20, destroy: 25 };
      if (lv === 11) return { success: 32, keep: 18, down: 20, destroy: 30 };
      if (lv === 12) return { success: 28, keep: 17, down: 20, destroy: 35 };
      const succ = Math.max(12, 26 - (lv - 12) * 2);
      const dest = Math.min(55, 38 + (lv - 12) * 3);
      const down = 20;
      const keep = Math.max(0, 100 - succ - dest - down);
      return { success: succ, keep, down, destroy: dest };
    }

    function calcEnhanceValue(lv) {
      if (lv <= 0) return 0;
      return Math.round(lv * 100 + Math.pow(lv, 2.35) * 45);
    }

    function getEnhanceWeaponSpec(lv) {
      let chosen = ENHANCE_TIERS[0];
      for (const t of ENHANCE_TIERS) {
        if (lv >= t.minLv) chosen = t;
      }
      return chosen;
    }

    function resetEnhance() {
      enhanceLv = 0;
      enhanceMaxLvThisRun = 0;
      enhanceScore = 0;
      enhanceOver = false;
      enhanceRunning = true;
      enhanceSessionHadBest = false;
      enhanceResultBanner = "";
      enhanceBannerTimer = 0;
      enhanceHammerAngle = 0;
      enhanceShake = 0;
      enhanceSparks = [];
      enhanceEndReason = "";
      isNewBestPending = false;
      hideSubmitBar();
    }

    function spawnEnhanceSparks(color, count) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.8 + Math.random() * 4.5;
        enhanceSparks.push({
          x: 170 + (Math.random() - 0.5) * 24,
          y: 185 + (Math.random() - 0.5) * 24,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 1.2,
          r: 2 + Math.random() * 2.5,
          color,
          life: 28
        });
      }
    }

    function doEnhanceAttempt() {
      if (!enhanceRunning || enhanceOver) {
        if (!canRestartNow()) return;
        resetEnhance();
        return;
      }

      const rates = getEnhanceRates(enhanceLv);
      const roll = Math.random() * 100;
      enhanceHammerAngle = 1.0;

      if (roll < rates.success) {
        enhanceLv++;
        if (enhanceLv > enhanceMaxLvThisRun) enhanceMaxLvThisRun = enhanceLv;
        enhanceResultBanner = `✨ 강화 성공! (+${enhanceLv}강 달성)`;
        enhanceResultColor = "#72efdd";
        enhanceBannerTimer = 55;
        enhanceShake = 6;
        spawnEnhanceSparks("#ffd166", 18);
      } else if (roll < rates.success + rates.keep) {
        enhanceResultBanner = `🛡️ 강화 실패 (등급 유지 +${enhanceLv}강)`;
        enhanceResultColor = "#9898a6";
        enhanceBannerTimer = 55;
        enhanceShake = 3;
        spawnEnhanceSparks("#9898a6", 8);
      } else if (roll < rates.success + rates.keep + rates.down) {
        enhanceLv = Math.max(0, enhanceLv - 1);
        enhanceResultBanner = `⬇️ 강화 실패! 단계 하락 (+${enhanceLv}강)`;
        enhanceResultColor = "#ffd166";
        enhanceBannerTimer = 55;
        enhanceShake = 8;
        spawnEnhanceSparks("#ff8ca5", 12);
      } else {
        enhanceShake = 16;
        spawnEnhanceSparks("#ff4d6d", 32);
        enhanceOver = true;
        enhanceEndReason = "destroyed";
        enhanceScore = Math.round(calcEnhanceValue(enhanceMaxLvThisRun) * 0.3);
        const isNewBest = enhanceScore > enhanceBest;
        if (isNewBest) {
          enhanceBest = enhanceScore;
          enhanceSessionHadBest = true;
          localStorage.setItem("nakhwaEnhanceBest", String(enhanceBest));
        }
        triggerGameOver(isNewBest, enhanceScore > 0);
      }
    }

    function sellEnhanceWeapon() {
      if (!enhanceRunning || enhanceOver || enhanceLv <= 0) return;
      enhanceScore = calcEnhanceValue(enhanceLv);
      enhanceOver = true;
      enhanceEndReason = "sold";
      spawnEnhanceSparks("#ffd166", 24);

      const isNewBest = enhanceScore > enhanceBest;
      if (isNewBest) {
        enhanceBest = enhanceScore;
        enhanceSessionHadBest = true;
        localStorage.setItem("nakhwaEnhanceBest", String(enhanceBest));
      }
      triggerGameOver(isNewBest, enhanceScore > 0);
    }

    function drawEnhanceFrame() {
      ctx.save();
      if (enhanceShake > 0.3) {
        ctx.translate((Math.random() - 0.5) * enhanceShake, (Math.random() - 0.5) * enhanceShake);
        enhanceShake *= 0.85;
      }

      const spec = getEnhanceWeaponSpec(enhanceLv);
      const rates = getEnhanceRates(enhanceLv);
      const currentVal = calcEnhanceValue(enhanceLv);

      ctx.fillStyle = "#f4f4f6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`가치 ${currentVal}점`, 14, 22);

      ctx.fillStyle = "#ff8ca5";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText(`최고 도달 +${enhanceMaxLvThisRun}강`, 14, 37);

      ctx.fillStyle = "#9898a6";
      ctx.textAlign = "right";
      ctx.fillText(`BEST ${enhanceBest}점`, 326, 22);
      ctx.fillStyle = "#ffd166";
      ctx.fillText(`+${enhanceLv} ${spec.title}`, 326, 37);

      const cx = 170;
      const cy = 185;
      const pulse = 1 + Math.sin(performance.now() * 0.006) * 0.08;
      const auraRadius = (48 + Math.min(45, enhanceLv * 3)) * pulse;

      const grad = ctx.createRadialGradient(cx, cy, 8, cx, cy, auraRadius);
      grad.addColorStop(0, spec.glow);
      grad.addColorStop(1, "rgba(18, 18, 22, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, auraRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#2b2d38";
      ctx.beginPath();
      ctx.moveTo(120, 248);
      ctx.lineTo(220, 248);
      ctx.lineTo(205, 266);
      ctx.lineTo(135, 266);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(148, 266, 44, 16);
      ctx.fillRect(130, 282, 80, 10);

      if (!enhanceOver || enhanceEndReason !== "destroyed") {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-Math.PI / 4);

        ctx.fillStyle = spec.blade;
        ctx.beginPath();
        ctx.moveTo(-7, 25);
        ctx.lineTo(-7, -58);
        ctx.lineTo(0, -76);
        ctx.lineTo(7, -58);
        ctx.lineTo(7, 25);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
        ctx.fillRect(-1.5, -56, 3, 76);

        ctx.fillStyle = spec.guard;
        ctx.beginPath();
        ctx.roundRect(-20, 24, 40, 8, 4);
        ctx.fill();

        ctx.fillStyle = "#3a2e28";
        ctx.fillRect(-5, 32, 10, 24);
        ctx.fillStyle = spec.guard;
        ctx.beginPath();
        ctx.arc(0, 58, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      if (enhanceHammerAngle > 0.02) {
        ctx.save();
        ctx.translate(225, 195);
        ctx.rotate(-enhanceHammerAngle * 1.1);
        ctx.fillStyle = "#8c6d53";
        ctx.fillRect(-4, -46, 8, 46);
        ctx.fillStyle = "#cbd5e1";
        ctx.fillRect(-16, -56, 32, 16);
        ctx.restore();
        enhanceHammerAngle *= 0.82;
      }

      ctx.fillStyle = "rgba(20, 20, 26, 0.85)";
      ctx.beginPath();
      ctx.roundRect(16, 298, 308, 42, 8);
      ctx.fill();
      ctx.strokeStyle = "#2c2c38";
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "#72efdd";
      ctx.fillText(`성공 ${rates.success}%`, 68, 323);
      ctx.fillStyle = "#9898a6";
      ctx.fillText(`유지 ${rates.keep}%`, 136, 323);
      ctx.fillStyle = "#ffd166";
      ctx.fillText(`하락 ${rates.down}%`, 204, 323);
      ctx.fillStyle = rates.destroy > 0 ? "#ff4d6d" : "#64748b";
      ctx.fillText(`파괴 ${rates.destroy}%`, 272, 323);

      ctx.fillStyle = "#e65c7b";
      ctx.beginPath();
      ctx.roundRect(16, 348, 186, 48, 10);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 15px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`🔨 강화하기 (+${enhanceLv}→+${enhanceLv + 1})`, 109, 377);

      const canSell = enhanceLv > 0 && !enhanceOver;
      ctx.fillStyle = canSell ? "#262632" : "#18181f";
      ctx.beginPath();
      ctx.roundRect(210, 348, 114, 48, 10);
      ctx.fill();
      ctx.strokeStyle = canSell ? "#ffd166" : "#282832";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = canSell ? "#ffd166" : "#555566";
      ctx.font = "bold 12px sans-serif";
      ctx.fillText("💰 판매 확정", 267, 369);
      ctx.font = "600 10px sans-serif";
      ctx.fillText(`${currentVal}점`, 267, 385);

      if (enhanceBannerTimer > 0) {
        enhanceBannerTimer--;
        ctx.fillStyle = enhanceResultColor;
        ctx.font = "900 15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(enhanceResultBanner, 170, 74);
      }

      for (let i = enhanceSparks.length - 1; i >= 0; i--) {
        const sp = enhanceSparks[i];
        sp.vy += 0.22;
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.life--;
        ctx.fillStyle = sp.color;
        ctx.globalAlpha = Math.max(0, sp.life / 28);
        ctx.fillRect(sp.x, sp.y, sp.r, sp.r);
        ctx.globalAlpha = 1;
        if (sp.life <= 0) enhanceSparks.splice(i, 1);
      }

      if (enhanceOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.82)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center";

        if (enhanceEndReason === "destroyed") {
          ctx.fillStyle = "#ff4d6d";
          ctx.font = "900 21px sans-serif";
          ctx.fillText(`💥 무기 파괴! (최고 +${enhanceMaxLvThisRun}강)`, canvas.width / 2, 178);
          ctx.fillStyle = "#f4f4f6";
          ctx.font = "bold 15px sans-serif";
          ctx.fillText(`위로금 점수: ${enhanceScore}점`, canvas.width / 2, 204);
        } else {
          ctx.fillStyle = "#ffd166";
          ctx.font = "900 21px sans-serif";
          ctx.fillText(`💰 +${enhanceLv}강 제련 성공!`, canvas.width / 2, 178);
          ctx.fillStyle = "#f4f4f6";
          ctx.font = "bold 15px sans-serif";
          ctx.fillText(`최종 획득 점수: ${enhanceScore}점`, canvas.width / 2, 204);
        }

        if (isNewBestPending) {
          ctx.fillStyle = "#ffd166";
          ctx.font = "bold 13px sans-serif";
          ctx.fillText("🎉 신기록! 아래에서 기록을 등록해 주세요", canvas.width / 2, 234);
        } else {
          ctx.fillStyle = "#ff8ca5";
          ctx.font = "600 13px sans-serif";
          ctx.fillText("화면을 터치하면 새 무기로 다시 도전합니다", canvas.width / 2, 234);
        }
      }

      ctx.restore();
    }

    /* ---------- 13. 낙화 터보 레이서 (Arcade Racing) 상태 ---------- */
    const RACER_ROAD = { left: 46, right: 294, lanes: 4 };
    const RACER_LANE_W = (RACER_ROAD.right - RACER_ROAD.left) / RACER_ROAD.lanes;
    const RACER_TRAFFIC_COLORS = ["#4ea8de", "#ffd166", "#a8d5ba", "#b5179e", "#f77f00"];

    let racerRunning = false;
    let racerOver = false;
    let racerScore = 0;
    let racerLastScore = 0;
    let racerBest = Number(localStorage.getItem("nakhwaRacerBest") || 0);
    let racerSessionHadBest = false;

    let racerSpeed = 4.6;
    let racerRoadOffset = 0;
    let racerNitroTimer = 0; // > 0 이면 무적 초고속 부스터
    let racerFrame = 0;
    let racerDragging = false;
    let racerLastDragX = 0;

    const racerCar = {
      x: 170,
      y: 350,
      w: 26,
      h: 44,
      steerSpeed: 4.8
    };

    let racerTraffic = [];
    let racerPickups = [];
    let racerParticles = [];

    function getRacerLaneCenterX(laneIdx) {
      return RACER_ROAD.left + RACER_LANE_W * (laneIdx + 0.5);
    }

    function resetRacer() {
      racerCar.x = getRacerLaneCenterX(1);
      racerCar.y = 350;
      racerTraffic = [];
      racerPickups = [];
      racerParticles = [];
      racerScore = 0;
      racerSpeed = 4.6;
      racerRoadOffset = 0;
      racerNitroTimer = 0;
      racerFrame = 0;
      racerOver = false;
      racerRunning = true;
      racerDragging = false;
      racerSessionHadBest = false;
      isNewBestPending = false;
      hideSubmitBar();
    }

    function spawnRacerWave() {
      // 4차선 중 1~2개 차선에만 차량 배치 (항상 피할 통로 2개 이상 보장)
      const lanes = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
      const count = racerScore > 450 && Math.random() < 0.45 ? 2 : 1;

      for (let i = 0; i < count; i++) {
        const lane = lanes[i];
        const color = RACER_TRAFFIC_COLORS[Math.floor(Math.random() * RACER_TRAFFIC_COLORS.length)];
        const relSpeed = 1.6 + Math.random() * 1.4;
        racerTraffic.push({
          x: getRacerLaneCenterX(lane),
          y: -55 - i * 18,
          w: 26,
          h: 44,
          color,
          relSpeed,
          blasted: false,
          vx: 0,
          vy: 0
        });
      }

      // 비어 있는 차선 중 하나에 일정 확률로 니트로 부스터 스폰
      if (Math.random() < 0.22) {
        const freeLane = lanes[count];
        racerPickups.push({
          x: getRacerLaneCenterX(freeLane),
          y: -50
        });
      }
    }

    function spawnRacerBurst(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 3.8;
        racerParticles.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          r: 2.5 + Math.random() * 2,
          color,
          life: 24
        });
      }
    }

    function drawCarSprite(x, y, w, h, bodyColor, isPlayer, isNitro) {
      ctx.save();
      ctx.translate(x, y);

      // 타이어 4개
      ctx.fillStyle = "#0b0b0e";
      ctx.fillRect(-w / 2 - 2.5, -h / 2 + 6, 3, 9);
      ctx.fillRect(w / 2 - 0.5, -h / 2 + 6, 3, 9);
      ctx.fillRect(-w / 2 - 2.5, h / 2 - 15, 3, 9);
      ctx.fillRect(w / 2 - 0.5, h / 2 - 15, 3, 9);

      // 차체
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.roundRect(-w / 2, -h / 2, w, h, 6);
      ctx.fill();

      // 앞유리 & 뒷유리
      ctx.fillStyle = "#181820";
      ctx.beginPath();
      ctx.roundRect(-w / 2 + 4, -h / 2 + 10, w - 8, 10, 2);
      ctx.fill();
      ctx.fillRect(-w / 2 + 5, h / 2 - 12, w - 10, 6);

      if (isPlayer) {
        // 레이싱 스트라이프
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(-2, -h / 2 + 1, 4, 8);
        ctx.fillRect(-2, h / 2 - 6, 4, 5);

        // 헤드라이트 불빛
        ctx.fillStyle = "rgba(255, 243, 176, 0.35)";
        ctx.beginPath();
        ctx.moveTo(-w / 2 + 4, -h / 2);
        ctx.lineTo(-w / 2 - 4, -h / 2 - 26);
        ctx.lineTo(-2, -h / 2 - 26);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(w / 2 - 4, -h / 2);
        ctx.lineTo(w / 2 + 4, -h / 2 - 26);
        ctx.lineTo(2, -h / 2 - 26);
        ctx.closePath();
        ctx.fill();

        // 배기 불꽃 (니트로 시 거대화)
        ctx.fillStyle = isNitro ? "#72efdd" : "#ffd166";
        const flameH = isNitro ? 14 + (racerFrame % 4) * 3 : 5 + (racerFrame % 3) * 2;
        ctx.fillRect(-5, h / 2, 4, flameH);
        ctx.fillRect(1, h / 2, 4, flameH);
      } else {
        // 일반 차량 테일램프
        ctx.fillStyle = "#ff4d6d";
        ctx.fillRect(-w / 2 + 3, h / 2 - 3, 5, 2.5);
        ctx.fillRect(w / 2 - 8, h / 2 - 3, 5, 2.5);
      }

      ctx.restore();
    }

    function drawRacerFrame() {
      const isNitro = racerNitroTimer > 0;
      const curSpeed = isNitro ? racerSpeed * 1.65 : racerSpeed;

      if (racerRunning && !racerOver) {
        racerFrame++;
        if (racerNitroTimer > 0) racerNitroTimer--;

        racerScore += isNitro ? 0.45 : 0.2;
        racerSpeed = Math.min(9.5, 4.6 + racerScore * 0.0028);
        racerRoadOffset = (racerRoadOffset + curSpeed * 1.8) % 36;

        // PC 좌우 조향
        if (dodgeKeys.left) racerCar.x -= racerCar.steerSpeed;
        if (dodgeKeys.right) racerCar.x += racerCar.steerSpeed;
        const minX = RACER_ROAD.left + racerCar.w / 2 + 3;
        const maxX = RACER_ROAD.right - racerCar.w / 2 - 3;
        racerCar.x = Math.max(minX, Math.min(maxX, racerCar.x));

        // 적 차량 스폰 간격
        const topCar = racerTraffic[racerTraffic.length - 1];
        const spawnGap = Math.max(115, 165 - racerScore * 0.03);
        if (!topCar || topCar.y > spawnGap) {
          spawnRacerWave();
        }

        // 니트로 아이템 업데이트
        for (let i = racerPickups.length - 1; i >= 0; i--) {
          const p = racerPickups[i];
          p.y += curSpeed * 1.25;
          if (Math.hypot(p.x - racerCar.x, p.y - racerCar.y) < 26) {
            racerNitroTimer = 180; // 3초간 무적 니트로 질주
            racerScore += 120;
            spawnRacerBurst(p.x, p.y, "#72efdd");
            racerPickups.splice(i, 1);
            continue;
          }
          if (p.y > canvas.height + 20) racerPickups.splice(i, 1);
        }

        // 라이벌 차량 업데이트 & 충돌 판정
        for (let i = racerTraffic.length - 1; i >= 0; i--) {
          const c = racerTraffic[i];
          if (c.blasted) {
            c.x += c.vx;
            c.y += c.vy;
            if (c.y < -80 || c.y > canvas.height + 80) racerTraffic.splice(i, 1);
            continue;
          }

          c.y += curSpeed - c.relSpeed * 0.35;

          const hitX = Math.abs(c.x - racerCar.x) < (c.w + racerCar.w) * 0.42;
          const hitY = Math.abs(c.y - racerCar.y) < (c.h + racerCar.h) * 0.42;

          if (hitX && hitY) {
            if (isNitro) {
              // 니트로 상태면 앞차를 들이받아 날려버림!
              c.blasted = true;
              c.vx = (c.x >= racerCar.x ? 1 : -1) * 7.5;
              c.vy = -8.5;
              racerScore += 80;
              spawnRacerBurst(c.x, c.y, "#ffd166");
            } else {
              racerOver = true;
              racerLastScore = Math.floor(racerScore);
              spawnRacerBurst(racerCar.x, racerCar.y, "#ff4d6d");
              const isNewBest = racerLastScore > racerBest;
              if (isNewBest) {
                racerBest = racerLastScore;
                localStorage.setItem("nakhwaRacerBest", String(racerBest));
              }
              triggerGameOver(isNewBest, racerLastScore > 0);
              break;
            }
          }

          if (c.y > canvas.height + 60) {
            racerTraffic.splice(i, 1);
          }
        }
      }

      // 1) 도로 좌우 야경 잔디 & 연석(빨강/흰색 경계석)
      ctx.fillStyle = "#12151c";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const curbH = 18;
      for (let y = -curbH + (racerRoadOffset % (curbH * 2)); y < canvas.height; y += curbH) {
        const isRed = Math.floor((y - racerRoadOffset) / curbH) % 2 === 0;
        ctx.fillStyle = isRed ? "#e65c7b" : "#f4f4f6";
        ctx.fillRect(RACER_ROAD.left - 6, y, 6, curbH);
        ctx.fillRect(RACER_ROAD.right, y, 6, curbH);
      }

      // 아스팔트 도로 본체
      ctx.fillStyle = "#1d1e26";
      ctx.fillRect(RACER_ROAD.left, 0, RACER_ROAD.right - RACER_ROAD.left, canvas.height);

      // 차선 점선 3줄
      ctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
      ctx.lineWidth = 2;
      ctx.setLineDash([18, 18]);
      ctx.lineDashOffset = -racerRoadOffset;
      for (let l = 1; l < RACER_ROAD.lanes; l++) {
        const lx = RACER_ROAD.left + RACER_LANE_W * l;
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, canvas.height);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // 니트로 발동 시 화면 양옆 스피드 라인 연출
      if (isNitro && !racerOver) {
        ctx.strokeStyle = "rgba(114, 239, 221, 0.35)";
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const sx = i < 3 ? 12 + i * 10 : canvas.width - 12 - (i - 3) * 10;
          const sy = ((racerFrame * 18 + i * 65) % canvas.height);
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx, sy + 28);
          ctx.stroke();
        }
      }

      // 2) 니트로 아이템 렌더링
      for (const p of racerPickups) {
        ctx.fillStyle = "#72efdd";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#121216";
        ctx.font = "900 11px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("⚡", p.x, p.y + 0.5);
      }
      ctx.textBaseline = "alphabetic";

      // 3) 라이벌 차량 & 플레이어 차량 렌더링
      for (const c of racerTraffic) {
        drawCarSprite(c.x, c.y, c.w, c.h, c.color, false, false);
      }

      if (!racerOver) {
        drawCarSprite(
          racerCar.x,
          racerCar.y,
          racerCar.w,
          racerCar.h,
          isNitro ? "#72efdd" : "#e65c7b",
          true,
          isNitro
        );
      }

      // 4) 파편 파티클
      for (let i = racerParticles.length - 1; i >= 0; i--) {
        const pt = racerParticles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = Math.max(0, pt.life / 24);
        ctx.fillRect(pt.x, pt.y, pt.r, pt.r);
        ctx.globalAlpha = 1;
        if (pt.life <= 0) racerParticles.splice(i, 1);
      }

      // 5) 상단 HUD
      ctx.fillStyle = "rgba(15, 15, 18, 0.72)";
      ctx.fillRect(0, 0, canvas.width, 44);

      ctx.fillStyle = "#f4f4f6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`SCORE ${Math.floor(racerScore)}`, 12, 21);

      const kmh = Math.round(curSpeed * 32);
      ctx.fillStyle = isNitro ? "#72efdd" : "#ff8ca5";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText(isNitro ? `⚡ NITRO ${kmh} km/h` : `${kmh} km/h`, 12, 36);

      ctx.fillStyle = "#9898a6";
      ctx.textAlign = "right";
      ctx.fillText(`BEST ${racerBest}`, 328, 21);
      ctx.fillText("4차선 질주", 328, 36);

      if (racerOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`🏎️ 충돌! 최종 ${racerLastScore}점`, canvas.width / 2, 190);
        if (isNewBestPending) {
          ctx.fillStyle = "#ffd166";
          ctx.font = "bold 13px sans-serif";
          ctx.fillText("🎉 신기록! 아래에서 기록을 등록해 주세요", canvas.width / 2, 220);
        } else {
          ctx.fillStyle = "#ff8ca5";
          ctx.font = "600 13px sans-serif";
          ctx.fillText("화면을 터치하면 다시 출발합니다", canvas.width / 2, 220);
        }
      }
    }
