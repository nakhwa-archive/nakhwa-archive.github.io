<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>낙화 비밀 오락실 | nakhwa-archive</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="낙화 비밀 오락실 | nakhwa-archive" />
  <meta property="og:description" content="메이븐 길드 [낙화] 미니게임 & 실시간 랭킹 보드" />
  <meta property="og:image" content="https://nakhwa-archive.github.io/html/comics/thumbnail.jpg" />
  <meta property="og:url" content="https://nakhwa-archive.github.io/html/games/" />

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a1f;
      --card-hover: #24242b;
      --text-main: #f4f4f6;
      --text-sub: #9898a6;
      --accent: #e65c7b;
      --border: #282830;
      --bar-bg: rgba(18, 18, 22, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      line-height: 1.4;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }

    body.fs-locked {
      overflow: hidden;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      padding-bottom: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bar-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    header h1 {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header h1 span {
      color: var(--accent);
    }

    .nav-btn {
      background: #18181d;
      border: 1px solid var(--border);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .nav-btn:active {
      transform: scale(0.95);
      border-color: var(--accent);
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 12px;
    }

    /* ===========================
       1. 게임 선택 로비 화면
       =========================== */
    .lobby-intro {
      margin-bottom: 14px;
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(230, 92, 123, 0.14), rgba(26, 26, 31, 0.9));
      border: 1px solid rgba(230, 92, 123, 0.3);
      border-radius: 14px;
    }

    .lobby-intro h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .lobby-intro p {
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .game-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .game-card:active {
      transform: scale(0.98);
      border-color: var(--accent);
      background: var(--card-hover);
    }

    .game-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: #121216;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      flex-shrink: 0;
    }

    .game-card-body {
      flex: 1;
      min-width: 0;
    }

    .game-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 3px;
    }

    .game-card-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .game-best-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(230, 92, 123, 0.14);
      padding: 2px 7px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .game-card-desc {
      font-size: 0.8rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-arrow {
      color: var(--text-sub);
      font-size: 0.9rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* ===========================
       2. 게임 플레이 화면
       =========================== */
    .play-view {
      display: none;
    }

    .play-view.active {
      display: block;
    }

    .lobby-view.hidden {
      display: none;
    }

    .arcade-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .play-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .play-game-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .action-pill-btn {
      background: #24242b;
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-pill-btn.fs-btn {
      background: rgba(230, 92, 123, 0.16);
      border-color: rgba(230, 92, 123, 0.45);
      color: #ff8ca5;
    }

    .action-pill-btn:active {
      transform: scale(0.95);
    }

    .canvas-stage {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #gameCanvas {
      background: #121216;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: block;
      touch-action: none;
      cursor: pointer;
      user-select: none;
      margin: 0 auto;
    }

    /* ===========================
       모든 디바이스 호환 고정비율 전체화면
       =========================== */
    .arcade-card.is-fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3000;
      width: 100%;
      height: 100%;
      border-radius: 0;
      border: none;
      background: #0b0b0e;
      padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .arcade-card.is-fullscreen .play-header-bar {
      margin-bottom: 6px;
      padding-bottom: 8px;
      flex-shrink: 0;
    }

    .arcade-card.is-fullscreen .canvas-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arcade-card.is-fullscreen .easter-hint {
      margin-top: 6px;
      flex-shrink: 0;
    }

    .arcade-card.is-fullscreen .score-submit-bar {
      margin-top: 8px;
      flex-shrink: 0;
    }

    .arcade-card.is-fullscreen .ranking-board {
      display: none;
    }

    .easter-hint {
      margin-top: 10px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    /* 점수 등록 바 */
    .score-submit-bar {
      display: none;
      flex-direction: column;
      margin-top: 12px;
      padding: 10px;
      background: #141418;
      border: 1px solid rgba(230, 92, 123, 0.45);
      border-radius: 10px;
      gap: 8px;
    }

    .score-submit-bar.active {
      display: flex;
    }

    .score-submit-bar.new-record {
      border-color: #ffd166;
      background: rgba(255, 209, 102, 0.08);
    }

    .new-record-banner {
      display: none;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffd166;
      text-align: center;
    }

    .score-submit-bar.new-record .new-record-banner {
      display: block;
    }

    .score-input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .nick-input {
      flex: 1;
      min-width: 0;
      height: 38px;
      background: #1e1e24;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }

    .nick-input:focus {
      border-color: var(--accent);
    }

    .submit-score-btn {
      height: 38px;
      padding: 0 14px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .submit-score-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .skip-record-btn {
      display: none;
      height: 38px;
      padding: 0 10px;
      background: #24242c;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .score-submit-bar.new-record .skip-record-btn {
      display: inline-block;
    }

    /* 실시간 랭킹 보드 */
    .ranking-board {
      margin-top: 14px;
      background: #141418;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .ranking-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .ranking-status {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-sub);
    }

    .ranking-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      padding: 6px 8px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.02);
    }

    .ranking-item.top1 {
      background: rgba(230, 92, 123, 0.14);
      color: #ff9eb5;
      font-weight: 700;
    }

    .rank-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .rank-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-score {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }

    .guild-footer {
      margin-top: 20px;
      padding: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }

    .guild-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .guild-title .accent {
      color: var(--accent);
    }

    .guild-sub {
      font-size: 0.84rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1 id="headerTitle">🌸 <span>낙화</span> 비밀 오락실</h1>
    </div>
    <a href="../comics/" class="nav-btn" id="headerComicsLink">← 4컷 만화</a>
  </header>

  <main>
    <!-- 1. 게임 목록 로비 화면 -->
    <section id="lobbyView" class="lobby-view">
      <div class="lobby-intro">
        <h2>🎮 미니게임 선택 (총 13종)</h2>
        <p>원하는 게임을 선택해 길드원들과 랭킹을 겨뤄보세요!</p>
      </div>

      <div class="game-grid">
        <button type="button" class="game-card" data-game="racer">
          <div class="game-icon-box">🏎️</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 터보 레이서</span>
              <span class="game-best-badge" id="badgeRacer">BEST 0점</span>
            </div>
            <p class="game-card-desc">4차선 고속도로 질주 & 니트로 부스터로 차량 추월!</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="enhance">
          <div class="game-icon-box">🔨</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 무기 강화</span>
              <span class="game-best-badge" id="badgeEnhance">BEST 0점</span>
            </div>
            <p class="game-card-desc">파괴 확률을 뚫고 전설의 낙화신검을 제련하라!</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="snake">
          <div class="game-icon-box">🐍</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">꼬리잡기 스네이크</span>
              <span class="game-best-badge" id="badgeSnake">BEST 0점</span>
            </div>
            <p class="game-card-desc">경단과 벚꽃 보석을 먹으며 꼬리 길게 늘리기</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="brick">
          <div class="game-icon-box">🧱</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">벚꽃 벽돌깨기</span>
              <span class="game-best-badge" id="badgeBrick">BEST 0점</span>
            </div>
            <p class="game-card-desc">패들로 공을 튕겨 아이템과 함께 블록 격파!</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="punch">
          <div class="game-icon-box">🥊</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 펀치아웃</span>
              <span class="game-best-badge" id="badgePunch">BEST 0점</span>
            </div>
            <p class="game-card-desc">상대의 예비 동작을 피하고 빈틈에 카운터 어퍼컷!</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="galaga">
          <div class="game-icon-box">🚀</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 갤러그</span>
              <span class="game-best-badge" id="badgeGalaga">BEST 0점</span>
            </div>
            <p class="game-card-desc">돌격해 오는 적 편대를 격추하는 레트로 슈팅</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="smash">
          <div class="game-icon-box">🏢</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">건물 부수기</span>
              <span class="game-best-badge" id="badgeSmash">BEST 0층</span>
            </div>
            <p class="game-card-desc">연타로 기를 모아 일격에 초고층 빌딩 박살내기</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="suika">
          <div class="game-icon-box">🍉</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 수박게임</span>
              <span class="game-best-badge" id="badgeSuika">BEST 0점</span>
            </div>
            <p class="game-card-desc">같은 과일·꽃을 합쳐 거대한 수박과 만개 벚꽃 만들기</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="runner">
          <div class="game-icon-box">🌸</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 러너</span>
              <span class="game-best-badge" id="badgeRunner">BEST 0점</span>
            </div>
            <p class="game-card-desc">가시 바위를 점프로 피하며 끝없이 달리기</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="slash">
          <div class="game-icon-box">⚔️</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 발도술</span>
              <span class="game-best-badge" id="badgeSlash">BEST --.---</span>
            </div>
            <p class="game-card-desc">찰나의 신호를 포착해 베는 반응속도 승부</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="stack">
          <div class="game-icon-box">🍡</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">경단 쌓기</span>
              <span class="game-best-badge" id="badgeStack">BEST 0층</span>
            </div>
            <p class="game-card-desc">타이밍 맞춰 삼색 경단을 하늘 높이 쌓기</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="dodge">
          <div class="game-icon-box">💥</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 닷지</span>
              <span class="game-best-badge" id="badgeDodge">BEST 0.00초</span>
            </div>
            <p class="game-card-desc">사방에서 날아오는 탄막 사이에서 오래 버티기</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="gogun">
          <div class="game-icon-box">🪝</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 고군분투</span>
              <span class="game-best-badge" id="badgeGogun">BEST 0점</span>
            </div>
            <p class="game-card-desc">기와지붕 위에서 갈고리 와이어로 스윙 액션</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>
      </div>
    </section>

    <!-- 2. 게임 플레이 화면 -->
    <section id="playView" class="play-view">
      <div class="arcade-card" id="arcadeCard">
        <div class="play-header-bar">
          <span class="play-game-title" id="playGameTitle">🌸 낙화 러너</span>
          <div class="play-header-actions">
            <button type="button" class="action-pill-btn fs-btn" id="btnToggleFullscreen">⛶ 전체화면</button>
            <button type="button" class="action-pill-btn" id="btnBackToLobby">☰ 목록</button>
          </div>
        </div>

        <div class="canvas-stage" id="canvasStage">
          <canvas id="gameCanvas" width="480" height="205"></canvas>
        </div>
        <p class="easter-hint" id="easterHint">화면 터치 또는 스페이스바(↑)로 점프!</p>

        <!-- 기록 등록 바 -->
        <div class="score-submit-bar" id="scoreSubmitBar">
          <div class="new-record-banner">🎉 신기록 달성! 기록을 등록해야 다시 시작할 수 있습니다</div>
          <div class="score-input-row">
            <input type="text" id="nickInput" class="nick-input" maxlength="10" placeholder="길드원 닉네임 (최대 10자)" />
            <button type="button" id="btnSubmitScore" class="submit-score-btn">기록 등록</button>
            <button type="button" id="btnSkipRecord" class="skip-record-btn">건너뛰기</button>
          </div>
        </div>

        <!-- 실시간 TOP 5 랭킹 -->
        <div class="ranking-board">
          <div class="ranking-header">
            <span id="rankingTitle">🏆 낙화 러너 TOP 5</span>
            <span class="ranking-status" id="rankingStatus">불러오는 중...</span>
          </div>
          <ul class="ranking-list" id="rankingList"></ul>
        </div>
      </div>
    </section>

    <footer class="guild-footer">
      <p class="guild-title">⚔️ 메이븐 길드 <span class="accent">[낙화]</span></p>
      <p class="guild-sub">길드장 김정환 · 가입 문의 환영 🌸</p>
    </footer>
  </main>

  <script>
    const CONFIG = {
      firebaseDbUrl: "https://nakhwa-a90f6-default-rtdb.firebaseio.com"
    };

    const lobbyView = document.getElementById("lobbyView");
    const playView = document.getElementById("playView");
    const arcadeCard = document.getElementById("arcadeCard");
    const canvasStage = document.getElementById("canvasStage");
    const playGameTitle = document.getElementById("playGameTitle");
    const btnToggleFullscreen = document.getElementById("btnToggleFullscreen");
    const btnBackToLobby = document.getElementById("btnBackToLobby");

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const easterHint = document.getElementById("easterHint");

    const scoreSubmitBar = document.getElementById("scoreSubmitBar");
    const nickInput = document.getElementById("nickInput");
    const btnSubmitScore = document.getElementById("btnSubmitScore");
    const btnSkipRecord = document.getElementById("btnSkipRecord");
    const rankingTitleEl = document.getElementById("rankingTitle");
    const rankingListEl = document.getElementById("rankingList");
    const rankingStatusEl = document.getElementById("rankingStatus");

    nickInput.value = localStorage.getItem("nakhwaRunnerNick") || "";

    let isInPlayScreen = false;
    let isGameFullscreen = false;
    let activeGame = "racer";
    const GROUND_Y = 170;
    let petals = [];

    // 고정 종횡비 및 고정 내부 해상도 관리
    const GAME_ASPECT = {
      wide: { w: 480, h: 205 },
      tall: { w: 340, h: 410 }
    };
    let currentAspect = GAME_ASPECT.tall;

    function fitCanvasExactAspect() {
      if (!isInPlayScreen) return;

      const aspectRatio = currentAspect.w / currentAspect.h;

      if (isGameFullscreen) {
        const stageW = Math.max(120, canvasStage.clientWidth);
        const stageH = Math.max(120, canvasStage.clientHeight);
        let drawW = stageW;
        let drawH = drawW / aspectRatio;

        if (drawH > stageH) {
          drawH = stageH;
          drawW = drawH * aspectRatio;
        }

        canvas.style.width = `${Math.floor(drawW)}px`;
        canvas.style.height = `${Math.floor(drawH)}px`;
      } else {
        const availW = Math.max(120, canvasStage.clientWidth);
        const maxW = currentAspect === GAME_ASPECT.tall ? Math.min(340, availW) : availW;
        const drawW = maxW;
        const drawH = drawW / aspectRatio;

        canvas.style.width = `${Math.floor(drawW)}px`;
        canvas.style.height = `${Math.floor(drawH)}px`;
      }
    }

    function setGameFullscreen(enable) {
      isGameFullscreen = enable;
      arcadeCard.classList.toggle("is-fullscreen", enable);
      document.body.classList.toggle("fs-locked", enable);
      btnToggleFullscreen.textContent = enable ? "✕ 축소" : "⛶ 전체화면";

      requestAnimationFrame(() => {
        fitCanvasExactAspect();
      });
    }

    btnToggleFullscreen.addEventListener("click", () => {
      setGameFullscreen(!isGameFullscreen);
    });

    window.addEventListener("resize", fitCanvasExactAspect);
    window.addEventListener("orientationchange", () => {
      setTimeout(fitCanvasExactAspect, 120);
    });

    // 신기록 잠금 & 실수 재시작 방지 쿨타임 상태
    let isNewBestPending = false;
    let gameOverLockUntil = 0;

    function triggerGameOver(isNewBest, hasScore) {
      gameOverLockUntil = performance.now() + 650;
      if (hasScore) {
        isNewBestPending = !!isNewBest;
        showSubmitBar(isNewBestPending);
      } else {
        isNewBestPending = false;
        hideSubmitBar();
      }
      if (isGameFullscreen) {
        requestAnimationFrame(fitCanvasExactAspect);
      }
    }

    function canRestartNow() {
      if (isNewBestPending) return false;
      if (performance.now() < gameOverLockUntil) return false;
      return true;
    }

    function getSafeKey(title) {
      return title.replace(/[.#$\[\]\/]/g, "_");
    }

    function initPetals() {
      petals = Array.from({ length: 14 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * GROUND_Y,
        r: 2 + Math.random() * 2.5,
        vx: -(0.6 + Math.random() * 1.2),
        vy: 0.4 + Math.random() * 0.8
      }));
    }

    function drawPetals(moving) {
      ctx.fillStyle = "rgba(255, 165, 188, 0.45)";
      petals.forEach(p => {
        if (moving) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.y > GROUND_Y) p.y = 0;
        }
        ctx.fillRect(p.x, p.y, p.r, p.r);
      });
    }

    /* ---------- 1. 낙화 러너 상태 ---------- */
    let runnerRunning = false;
    let runnerOver = false;
    let runnerScore = 0;
    let runnerLastScore = 0;
    let runnerBest = Number(localStorage.getItem("nakhwaRunnerBest") || 0);
    let runnerSpeed = 4.5;
    let runnerFrame = 0;

    const player = {
      x: 48,
      y: GROUND_Y - 28,
      w: 24,
      h: 28,
      vy: 0,
      gravity: 0.62,
      jumpPower: -10.8,
      grounded: true
    };
    let obstacles = [];

    function resetRunner() {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.grounded = true;
      obstacles = [];
      runnerScore = 0;
      runnerSpeed = 4.5;
      runnerFrame = 0;
      runnerOver = false;
      runnerRunning = true;
      isNewBestPending = false;
      hideSubmitBar();
      initPetals();
    }

    /* ---------- 2. 낙화 발도술 상태 ---------- */
    let slashState = "idle";
    let slashSignalTime = 0;
    let slashTimer = null;
    let slashReactionMs = 0;
    let slashBestMs = Number(localStorage.getItem("nakhwaSlashBest") || 0);
    let slashFlashAlpha = 0;

    function resetSlashToIdle() {
      clearTimeout(slashTimer);
      slashState = "idle";
      slashFlashAlpha = 0;
      isNewBestPending = false;
      hideSubmitBar();
    }

    function startSlashRound() {
      clearTimeout(slashTimer);
      slashState = "waiting";
      slashFlashAlpha = 0;
      isNewBestPending = false;
      hideSubmitBar();

      const delay = 1500 + Math.random() * 2900;
      slashTimer = setTimeout(() => {
        if (!isInPlayScreen || activeGame !== "slash") return;
        slashState = "signal";
        slashSignalTime = performance.now();
        slashFlashAlpha = 1;
      }, delay);
    }

    function handleSlashAction() {
      if (slashState === "idle") {
        startSlashRound();
      } else if (slashState === "result" || slashState === "foul") {
        if (!canRestartNow()) return;
        startSlashRound();
      } else if (slashState === "waiting") {
        clearTimeout(slashTimer);
        slashState = "foul";
        triggerGameOver(false, false);
      } else if (slashState === "signal") {
        const diff = Math.round(performance.now() - slashSignalTime);
        slashReactionMs = Math.max(1, diff);
        slashState = "result";
        slashFlashAlpha = 1;

        const isNewBest = (slashBestMs === 0 || slashReactionMs < slashBestMs);
        if (isNewBest) {
          slashBestMs = slashReactionMs;
          localStorage.setItem("nakhwaSlashBest", String(slashBestMs));
        }
        triggerGameOver(isNewBest, true);
      }
    }

    /* ---------- 3. 경단 쌓기 (Stack) 상태 ---------- */
    const DANGO_COLORS = [
      { fill: "#ffb7c5", stroke: "#ff8ca5" },
      { fill: "#f4f4f6", stroke: "#d0d0dc" },
      { fill: "#a8d5ba", stroke: "#7bb894" }
    ];
    const STACK_BLOCK_H = 18;
    const STACK_BASE_Y = 184;

    let stackLayers = [];
    let stackMoving = null;
    let stackSliced = [];
    let stackRunning = false;
    let stackOver = false;
    let stackFloors = 0;
    let stackBest = Number(localStorage.getItem("nakhwaStackBest") || 0);
    let stackCameraY = 0;
    let stackPerfectTimer = 0;
    let stackCombo = 0;

    function resetStack() {
      const startW = 140;
      const startX = (canvas.width - startW) / 2;
      stackLayers = [{ x: startX, w: startW, colorIdx: 0 }];
      stackSliced = [];
      stackFloors = 0;
      stackCameraY = 0;
      stackPerfectTimer = 0;
      stackCombo = 0;
      stackOver = false;
      stackRunning = true;
      isNewBestPending = false;
      hideSubmitBar();
      initPetals();
      spawnNextDango();
    }

    function spawnNextDango() {
      const prev = stackLayers[stackLayers.length - 1];
      const dir = stackLayers.length % 2 === 1 ? 1 : -1;
      const speed = Math.min(7.2, 2.7 + stackFloors * 0.14);
      stackMoving = {
        x: dir === 1 ? 30 : canvas.width - prev.w - 30,
        w: prev.w,
        dir,
        speed,
        colorIdx: stackLayers.length % DANGO_COLORS.length
      };
    }

    function handleStackAction() {
      if (stackOver || !stackRunning) {
        if (!canRestartNow()) return;
        resetStack();
        return;
      }
      if (!stackMoving) return;

      const prev = stackLayers[stackLayers.length - 1];
      const curr = stackMoving;
      const diff = curr.x - prev.x;

      if (Math.abs(diff) <= 4) {
        stackCombo++;
        const bonusW = stackCombo >= 2 ? Math.min(150, prev.w + 6) : prev.w;
        const alignedX = prev.x - (bonusW - prev.w) / 2;
        stackLayers.push({ x: alignedX, w: bonusW, colorIdx: curr.colorIdx });
        stackFloors++;
        stackPerfectTimer = 28;
        spawnNextDango();
        return;
      }

      stackCombo = 0;
      const overlapLeft = Math.max(prev.x, curr.x);
      const overlapRight = Math.min(prev.x + prev.w, curr.x + curr.w);
      const overlapW = overlapRight - overlapLeft;

      if (overlapW <= 2) {
        stackSliced.push({
          x: curr.x,
          y: STACK_BASE_Y - stackLayers.length * STACK_BLOCK_H + stackCameraY,
          w: curr.w,
          vy: 0,
          colorIdx: curr.colorIdx
        });
        stackMoving = null;
        stackOver = true;
        const isNewBest = stackFloors > stackBest;
        if (isNewBest) {
          stackBest = stackFloors;
          localStorage.setItem("nakhwaStackBest", String(stackBest));
        }
        triggerGameOver(isNewBest, stackFloors > 0);
        return;
      }

      const sliceW = curr.w - overlapW;
      const sliceX = diff < 0 ? curr.x : overlapRight;
      stackSliced.push({
        x: sliceX,
        y: STACK_BASE_Y - stackLayers.length * STACK_BLOCK_H + stackCameraY,
        w: sliceW,
        vy: 0,
        colorIdx: curr.colorIdx
      });

      stackLayers.push({ x: overlapLeft, w: overlapW, colorIdx: curr.colorIdx });
      stackFloors++;
      spawnNextDango();
    }

    /* ---------- 4. 낙화 닷지 (Dodge) 상태 ---------- */
    let dodgeRunning = false;
    let dodgeOver = false;
    let dodgeStartTime = 0;
    let dodgeElapsedMs = 0;
    let dodgeBestMs = Number(localStorage.getItem("nakhwaDodgeBest") || 0);
    let dodgeBullets = [];
    let dodgeSpawnTimer = 0;

    const dodgeShip = {
      x: 240,
      y: 102,
      r: 5,
      speed: 3.4
    };

    const dodgeKeys = { up: false, down: false, left: false, right: false };
    let dodgePointerActive = false;
    let dodgeLastPointer = { x: 0, y: 0 };

    function spawnDodgeBullet() {
      const side = Math.floor(Math.random() * 4);
      let x = 0, y = 0;
      if (side === 0) { x = Math.random() * canvas.width; y = -6; }
      else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 6; }
      else if (side === 2) { x = -6; y = Math.random() * canvas.height; }
      else { x = canvas.width + 6; y = Math.random() * canvas.height; }

      let targetX = dodgeShip.x + (Math.random() - 0.5) * 90;
      let targetY = dodgeShip.y + (Math.random() - 0.5) * 90;
      if (Math.random() < 0.3) {
        targetX = Math.random() * canvas.width;
        targetY = Math.random() * canvas.height;
      }

      const angle = Math.atan2(targetY - y, targetX - x);
      const sec = dodgeElapsedMs / 1000;
      const speed = 1.6 + Math.random() * 1.4 + Math.min(2.2, sec * 0.06);

      dodgeBullets.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: 3.2,
        isPink: Math.random() < 0.35
      });
    }

    function resetDodge() {
      dodgeShip.x = canvas.width / 2;
      dodgeShip.y = canvas.height / 2;
      dodgeBullets = [];
      dodgeSpawnTimer = 0;
      dodgeElapsedMs = 0;
      dodgeStartTime = performance.now();
      dodgeOver = false;
      dodgeRunning = true;
      dodgePointerActive = false;
      isNewBestPending = false;
      hideSubmitBar();

      for (let i = 0; i < 14; i++) {
        spawnDodgeBullet();
      }
    }

    /* ---------- 5. 낙화 고군분투 상태 ---------- */
    let gogunRunning = false;
    let gogunOver = false;
    let gogunScore = 0;
    let gogunLastScore = 0;
    let gogunBest = Number(localStorage.getItem("nakhwaGogunBest") || 0);
    let gogunHolding = false;
    let gogunHoldFrames = 0;
    let gogunSpeed = 4.2;
    let gogunFrame = 0;

    const gogunPlayer = {
      x: 82,
      y: 120,
      w: 20,
      h: 22,
      vy: 0,
      grounded: false,
      canHook: true
    };

    const gogunHook = {
      active: false,
      anchorX: 0,
      anchorY: 0,
      length: 0,
      angle: 0,
      angVel: 0
    };

    let gogunRoofs = [];
    let gogunCoins = [];

    function spawnGogunSection(startX) {
      const gap = 85 + Math.random() * 90;
      const roofX = startX + gap;
      const roofW = 115 + Math.random() * 120;
      const roofY = 148 + (Math.random() - 0.5) * 30;
      gogunRoofs.push({ x: roofX, y: roofY, w: roofW });

      const midGapX = startX + gap * 0.5;
      const arcY = 58 + Math.random() * 34;
      gogunCoins.push({ x: midGapX - 18, y: arcY + 12, type: "coin", collected: false });
      gogunCoins.push({ x: midGapX, y: arcY, type: "gem", collected: false });
      gogunCoins.push({ x: midGapX + 18, y: arcY + 12, type: "coin", collected: false });

      gogunCoins.push({ x: roofX + roofW * 0.35, y: roofY - 18, type: "coin", collected: false });
      gogunCoins.push({ x: roofX + roofW * 0.65, y: roofY - 18, type: "coin", collected: false });
    }

    function resetGogun() {
      gogunPlayer.x = 82;
      gogunPlayer.y = 130;
      gogunPlayer.vy = 0;
      gogunPlayer.grounded = true;
      gogunPlayer.canHook = true;
      gogunHook.active = false;
      gogunHolding = false;
      gogunHoldFrames = 0;
      gogunScore = 0;
      gogunSpeed = 4.2;
      gogunFrame = 0;
      gogunOver = false;
      gogunRunning = true;
      isNewBestPending = false;
      hideSubmitBar();
      initPetals();

      gogunRoofs = [{ x: 0, y: 152, w: 300 }];
      gogunCoins = [
        { x: 180, y: 134, type: "coin", collected: false },
        { x: 220, y: 134, type: "coin", collected: false }
      ];
      spawnGogunSection(300);
      spawnGogunSection(580);
    }

    function attachGogunHook() {
      if (gogunHook.active || !gogunPlayer.canHook) return;
      gogunPlayer.canHook = false;
      gogunPlayer.grounded = false;

      gogunHook.active = true;
      gogunHook.anchorX = gogunPlayer.x + 88;
      gogunHook.anchorY = 12;
      const dx = gogunPlayer.x - gogunHook.anchorX;
      const dy = gogunPlayer.y - gogunHook.anchorY;
      gogunHook.length = Math.max(55, Math.min(145, Math.hypot(dx, dy)));
      gogunHook.angle = Math.atan2(dx, dy);
      gogunHook.angVel = 0.046;
    }

    function releaseGogunHook() {
      if (!gogunHook.active) return;
      gogunHook.active = false;
      gogunPlayer.vy = Math.min(-4.2, -Math.sin(gogunHook.angle) * 7.5 - 3.5);
    }

    function handleGogunPressStart() {
      if (!isInPlayScreen || activeGame !== "gogun" || document.activeElement === nickInput) return;

      if (gogunOver || !gogunRunning) {
        if (!canRestartNow()) return;
        resetGogun();
        return;
      }

      if (!gogunPlayer.grounded) return;

      gogunHolding = true;
      gogunHoldFrames = 0;
      gogunPlayer.vy = -8.6;
      gogunPlayer.grounded = false;
    }

    function handleGogunPressEnd() {
      gogunHolding = false;
      gogunHoldFrames = 0;
      if (gogunHook.active) {
        releaseGogunHook();
      }
    }

    /* ---------- 6. 낙화 수박게임 (Suika) 상태 ---------- */
    const SUIKA_TIERS = [
      { r: 14, color: "#ffb7c5", stroke: "#ff8ca5", emoji: "🌸", score: 2 },
      { r: 19, color: "#ff8fab", stroke: "#fb6f92", emoji: "🌷", score: 4 },
      { r: 25, color: "#e63946", stroke: "#ff758f", emoji: "🍒", score: 8 },
      { r: 31, color: "#f4f4f6", stroke: "#b8b8c8", emoji: "🍡", score: 16 },
      { r: 38, color: "#ffccd5", stroke: "#ff8fa3", emoji: "🍑", score: 32 },
      { r: 46, color: "#d90429", stroke: "#ff4d6d", emoji: "🍎", score: 64 },
      { r: 54, color: "#a8d5ba", stroke: "#6ab08c", emoji: "🍈", score: 128 },
      { r: 64, color: "#2b9348", stroke: "#55a630", emoji: "🍉", score: 256 },
      { r: 75, color: "#ffd166", stroke: "#ff9f1c", emoji: "👑", score: 512 }
    ];

    const SUIKA_BOX = { left: 16, right: 324, top: 82, bottom: 398 };
    let suikaBalls = [];
    let suikaParticles = [];
    let suikaScore = 0;
    let suikaBest = Number(localStorage.getItem("nakhwaSuikaBest") || 0);
    let suikaCurTier = 0;
    let suikaNextTier = 0;
    let suikaDropX = 170;
    let suikaCanDrop = true;
    let suikaDropCooldown = 0;
    let suikaOver = false;
    let suikaRunning = false;
    let suikaDangerFrames = 0;
    let suikaAiming = false;
    let suikaSessionHadBest = false;

    function randomSuikaSpawnTier() {
      return Math.floor(Math.random() * 4);
    }

    function resetSuika() {
      suikaBalls = [];
      suikaParticles = [];
      suikaScore = 0;
      suikaCurTier = randomSuikaSpawnTier();
      suikaNextTier = randomSuikaSpawnTier();
      suikaDropX = (SUIKA_BOX.left + SUIKA_BOX.right) / 2;
      suikaCanDrop = true;
      suikaDropCooldown = 0;
      suikaOver = false;
      suikaRunning = true;
      suikaDangerFrames = 0;
      suikaAiming = false;
      suikaSessionHadBest = false;
      isNewBestPending = false;
      hideSubmitBar();
    }

    function clampSuikaX(x, tier) {
      const r = SUIKA_TIERS[tier].r;
      return Math.max(SUIKA_BOX.left + r + 2, Math.min(SUIKA_BOX.right - r - 2, x));
    }

    function dropSuikaBall() {
      if (!suikaRunning || suikaOver || !suikaCanDrop) return;
      const tier = suikaCurTier;
      const x = clampSuikaX(suikaDropX, tier);
      suikaBalls.push({
        x,
        y: SUIKA_BOX.top - 18,
        vx: (Math.random() - 0.5) * 0.4,
        vy: 1.5,
        tier,
        r: SUIKA_TIERS[tier].r,
        age: 0,
        merged: false
      });

      suikaCurTier = suikaNextTier;
      suikaNextTier = randomSuikaSpawnTier();
      suikaDropX = clampSuikaX(suikaDropX, suikaCurTier);
      suikaCanDrop = false;
      suikaDropCooldown = 26;
    }

    function spawnSuikaBurst(x, y, color) {
      for (let i = 0; i < 10; i++) {
        const ang = (Math.PI * 2 * i) / 10 + Math.random() * 0.3;
        const spd = 1.5 + Math.random() * 2.5;
        suikaParticles.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          r: 2.5 + Math.random() * 2,
          color,
          life: 22
        });
      }
    }

    function stepSuikaPhysics() {
      if (!suikaRunning || suikaOver) return;

      if (!suikaCanDrop) {
        suikaDropCooldown--;
        if (suikaDropCooldown <= 0) suikaCanDrop = true;
      }

      if (dodgeKeys.left) suikaDropX = clampSuikaX(suikaDropX - 4.2, suikaCurTier);
      if (dodgeKeys.right) suikaDropX = clampSuikaX(suikaDropX + 4.2, suikaCurTier);

      const subSteps = 4;
      const gravity = 0.36 / subSteps;

      for (let step = 0; step < subSteps; step++) {
        for (const b of suikaBalls) {
          if (b.merged) continue;
          b.vy += gravity;
          b.vx *= 0.996;
          b.vy *= 0.996;
          b.x += b.vx / subSteps;
          b.y += b.vy / subSteps;

          if (b.x - b.r < SUIKA_BOX.left) {
            b.x = SUIKA_BOX.left + b.r;
            b.vx = Math.abs(b.vx) * 0.35;
          } else if (b.x + b.r > SUIKA_BOX.right) {
            b.x = SUIKA_BOX.right - b.r;
            b.vx = -Math.abs(b.vx) * 0.35;
          }

          if (b.y + b.r > SUIKA_BOX.bottom) {
            b.y = SUIKA_BOX.bottom - b.r;
            b.vy = -Math.abs(b.vy) * 0.25;
            b.vx *= 0.92;
          }
        }

        const newMergedBalls = [];
        for (let i = 0; i < suikaBalls.length; i++) {
          const a = suikaBalls[i];
          if (a.merged) continue;

          for (let j = i + 1; j < suikaBalls.length; j++) {
            const b = suikaBalls[j];
            if (b.merged) continue;

            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.hypot(dx, dy);
            const minDist = a.r + b.r;

            if (dist < minDist && dist > 0.0001) {
              if (a.tier === b.tier && a.tier < SUIKA_TIERS.length - 1) {
                a.merged = true;
                b.merged = true;
                const nextTier = a.tier + 1;
                const mx = (a.x + b.x) / 2;
                const my = (a.y + b.y) / 2;
                const nextDef = SUIKA_TIERS[nextTier];

                suikaScore += nextDef.score;
                if (suikaScore > suikaBest) {
                  suikaBest = suikaScore;
                  suikaSessionHadBest = true;
                  localStorage.setItem("nakhwaSuikaBest", String(suikaBest));
                }

                spawnSuikaBurst(mx, my, nextDef.color);
                newMergedBalls.push({
                  x: clampSuikaX(mx, nextTier),
                  y: Math.min(SUIKA_BOX.bottom - nextDef.r, my),
                  vx: (a.vx + b.vx) * 0.3,
                  vy: -1.2,
                  tier: nextTier,
                  r: nextDef.r,
                  age: 20,
                  merged: false
                });
                break;
              }

              const nx = dx / dist;
              const ny = dy / dist;
              const overlap = minDist - dist;
              const totalMass = a.r * a.r + b.r * b.r;
              const ratioA = (b.r * b.r) / totalMass;
              const ratioB = (a.r * a.r) / totalMass;

              a.x -= nx * overlap * ratioA;
              a.y -= ny * overlap * ratioA;
              b.x += nx * overlap * ratioB;
              b.y += ny * overlap * ratioB;

              const rvx = b.vx - a.vx;
              const rvy = b.vy - a.vy;
              const velAlongNormal = rvx * nx + rvy * ny;
              if (velAlongNormal < 0) {
                const restitution = 0.22;
                const impulse = -(1 + restitution) * velAlongNormal;
                a.vx -= impulse * nx * ratioA;
                a.vy -= impulse * ny * ratioA;
                b.vx += impulse * nx * ratioB;
                b.vy += impulse * ny * ratioB;
              }
            }
          }
        }

        if (newMergedBalls.length > 0) {
          suikaBalls = suikaBalls.filter(b => !b.merged).concat(newMergedBalls);
        }
      }

      let overflow = false;
      for (const b of suikaBalls) {
        b.age++;
        if (b.age > 55 && b.y - b.r < SUIKA_BOX.top) {
          overflow = true;
          break;
        }
      }

      if (overflow) {
        suikaDangerFrames++;
        if (suikaDangerFrames > 65) {
          suikaOver = true;
          triggerGameOver(suikaSessionHadBest, suikaScore > 0);
        }
      } else {
        suikaDangerFrames = Math.max(0, suikaDangerFrames - 2);
      }
    }

    function drawSuikaBall(x, y, tier, alpha = 1) {
      const def = SUIKA_TIERS[tier];
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(x, y, def.r, 0, Math.PI * 2);
      ctx.fillStyle = def.color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = def.stroke;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(x - def.r * 0.28, y - def.r * 0.28, def.r * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
      ctx.fill();

      ctx.font = `${Math.round(def.r * 1.15)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(def.emoji, x, y + 1);
      ctx.restore();
    }

    function drawSuikaFrame() {
      stepSuikaPhysics();

      ctx.fillStyle = "#f4f4f6";
      ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`SCORE ${suikaScore}`, 16, 26);

      ctx.fillStyle = "#9898a6";
      ctx.font = "600 12px sans-serif";
      ctx.fillText(`BEST ${suikaBest}`, 16, 44);

      ctx.fillStyle = "#9898a6";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText("NEXT", 292, 28);
      drawSuikaBall(310, 26, Math.min(3, suikaNextTier), 1);

      ctx.fillStyle = "rgba(255, 255, 255, 0.02)";
      ctx.fillRect(
        SUIKA_BOX.left,
        SUIKA_BOX.top,
        SUIKA_BOX.right - SUIKA_BOX.left,
        SUIKA_BOX.bottom - SUIKA_BOX.top
      );

      ctx.strokeStyle = "#343442";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(SUIKA_BOX.left, SUIKA_BOX.top);
      ctx.lineTo(SUIKA_BOX.left, SUIKA_BOX.bottom);
      ctx.lineTo(SUIKA_BOX.right, SUIKA_BOX.bottom);
      ctx.lineTo(SUIKA_BOX.right, SUIKA_BOX.top);
      ctx.stroke();

      ctx.save();
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = suikaDangerFrames > 0 ? "#ff4d6d" : "rgba(230, 92, 123, 0.45)";
      ctx.lineWidth = suikaDangerFrames > 0 ? 2 : 1.5;
      ctx.beginPath();
      ctx.moveTo(SUIKA_BOX.left, SUIKA_BOX.top);
      ctx.lineTo(SUIKA_BOX.right, SUIKA_BOX.top);
      ctx.stroke();
      ctx.restore();

      if (suikaRunning && !suikaOver && suikaCanDrop) {
        const curR = SUIKA_TIERS[suikaCurTier].r;
        const previewY = SUIKA_BOX.top - 18;

        ctx.save();
        ctx.setLineDash([3, 4]);
        ctx.strokeStyle = "rgba(255, 183, 197, 0.35)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(suikaDropX, previewY + curR);
        ctx.lineTo(suikaDropX, SUIKA_BOX.bottom);
        ctx.stroke();
        ctx.restore();

        drawSuikaBall(suikaDropX, previewY, suikaCurTier, 0.95);
      }

      for (const b of suikaBalls) {
        drawSuikaBall(b.x, b.y, b.tier, 1);
      }

      for (let i = suikaParticles.length - 1; i >= 0; i--) {
        const p = suikaParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 22);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        if (p.life <= 0) suikaParticles.splice(i, 1);
      }

      if (suikaOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.78)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`🍉 게임 오버 · ${suikaScore}점`, canvas.width / 2, 190);
        if (isNewBestPending) {
          ctx.fillStyle = "#ffd166";
          ctx.font = "bold 13px sans-serif";
          ctx.fillText("🎉 신기록! 아래에서 기록을 등록해 주세요", canvas.width / 2, 220);
        } else {
          ctx.fillStyle = "#ff8ca5";
          ctx.font = "600 13px sans-serif";
          ctx.fillText("화면을 터치하면 다시 시작합니다", canvas.width / 2, 220);
        }
      }
    }

    /* ---------- 7. 건물 부수기 (Building Smash) 상태 ---------- */
    let smashState = "idle";
    let smashPower = 0;
    let smashChargeStart = 0;
    const SMASH_CHARGE_MS = 5000;
    let smashGaugePos = 0.5;
    let smashGaugeDir = 1;
    let smashMultiplier = 1.0;
    let smashCritLabel = "";
    let smashTargetFloors = 0;
    let smashBrokenFloors = 0;
    let smashBest = Number(localStorage.getItem("nakhwaSmashBest") || 0);
    let smashDebris = [];
    let smashShake = 0;
    let smashAuraPulse = 0;

    function resetSmash() {
      smashState = "idle";
      smashPower = 0;
      smashGaugePos = 0.5;
      smashGaugeDir = 1;
      smashMultiplier = 1.0;
      smashCritLabel = "";
      smashTargetFloors = 0;
      smashBrokenFloors = 0;
      smashDebris = [];
      smashShake = 0;
      smashAuraPulse = 0;
      isNewBestPending = false;
      hideSubmitBar();
    }

    function spawnSmashDebris(y, count) {
      const colors = ["#78788c", "#565668", "#e65c7b", "#ffb7c5", "#d0d0dc"];
      for (let i = 0; i < count; i++) {
        smashDebris.push({
          x: 115 + Math.random() * 110,
          y: y + (Math.random() - 0.5) * 14,
          vx: (Math.random() - 0.5) * 9,
          vy: -2 - Math.random() * 5,
          w: 6 + Math.random() * 8,
          h: 5 + Math.random() * 6,
          rot: Math.random() * Math.PI,
          vrot: (Math.random() - 0.5) * 0.25,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 45
        });
      }
    }

    function handleSmashAction() {
      if (smashState === "idle") {
        smashState = "charging";
        smashPower = 3;
        smashChargeStart = performance.now();
        smashBrokenFloors = 0;
        smashDebris = [];
        smashAuraPulse = 1;
        smashShake = 3;
        isNewBestPending = false;
        hideSubmitBar();
        return;
      }

      if (smashState === "result") {
        if (!canRestartNow()) return;
        smashState = "charging";
        smashPower = 3;
        smashChargeStart = performance.now();
        smashBrokenFloors = 0;
        smashDebris = [];
        smashAuraPulse = 1;
        smashShake = 3;
        isNewBestPending = false;
        hideSubmitBar();
        return;
      }

      if (smashState === "charging") {
        smashPower += 3.2;
        smashAuraPulse = 1;
        smashShake = Math.min(8, 2 + smashPower * 0.04);
        return;
      }

      if (smashState === "timing") {
        const distFromCenter = Math.abs(smashGaugePos - 0.5);
        if (distFromCenter <= 0.06) {
          smashMultiplier = 1.5;
          smashCritLabel = "💥 CRITICAL x1.5!!";
        } else if (distFromCenter <= 0.16) {
          smashMultiplier = 1.2;
          smashCritLabel = "⚡ GREAT x1.2!";
        } else {
          smashMultiplier = 0.9;
          smashCritLabel = "👊 HIT x0.9";
        }

        smashTargetFloors = Math.max(1, Math.round(smashPower * smashMultiplier));
        smashBrokenFloors = 0;
        smashState = "smashing";
        smashShake = 14;
      }
    }

    function drawSmashFrame() {
      ctx.save();
      if (smashShake > 0.3) {
        const sx = (Math.random() - 0.5) * smashShake;
        const sy = (Math.random() - 0.5) * smashShake;
        ctx.translate(sx, sy);
        smashShake *= 0.86;
      }

      let remainSec = 5.0;
      if (smashState === "charging") {
        const elapsed = performance.now() - smashChargeStart;
        remainSec = Math.max(0, (SMASH_CHARGE_MS - elapsed) / 1000);
        if (elapsed >= SMASH_CHARGE_MS) {
          smashState = "timing";
          smashGaugePos = 0.1;
          smashGaugeDir = 1;
        }
      } else if (smashState === "timing") {
        smashGaugePos += smashGaugeDir * 0.026;
        if (smashGaugePos >= 1) {
          smashGaugePos = 1;
          smashGaugeDir = -1;
        } else if (smashGaugePos <= 0) {
          smashGaugePos = 0;
          smashGaugeDir = 1;
        }
      } else if (smashState === "smashing") {
        const step = Math.max(1, Math.ceil((smashTargetFloors - smashBrokenFloors) * 0.14));
        smashBrokenFloors = Math.min(smashTargetFloors, smashBrokenFloors + step);
        if (Math.random() < 0.75) {
          spawnSmashDebris(290, 5);
          smashShake = 7;
        }
        if (smashBrokenFloors >= smashTargetFloors) {
          smashState = "result";
          const isNewBest = smashTargetFloors > smashBest;
          if (isNewBest) {
            smashBest = smashTargetFloors;
            localStorage.setItem("nakhwaSmashBest", String(smashBest));
          }
          triggerGameOver(isNewBest, smashTargetFloors > 0);
        }
      }

      ctx.fillStyle = "#9898a6";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(`BEST ${smashBest}층`, 324, 24);

      ctx.textAlign = "left";
      ctx.fillStyle = "#ff8ca5";
      ctx.font = "bold 13px sans-serif";
      ctx.fillText(`내공 POWER ${Math.round(smashPower)}`, 16, 24);

      const groundY = 315;
      const bX = 112;
      const bW = 116;
      const floorH = 22;
      const visibleFloors = 10;
      const dropOffset = smashState === "smashing" ? (smashBrokenFloors % 2) * 5 : 0;

      for (let i = 0; i < visibleFloors; i++) {
        const floorNum = smashBrokenFloors + i + 1;
        const fy = groundY - (i + 1) * floorH + dropOffset;

        ctx.fillStyle = i % 2 === 0 ? "#2a2a35" : "#23232d";
        ctx.fillRect(bX, fy, bW, floorH - 1);
        ctx.strokeStyle = "#3a3a48";
        ctx.lineWidth = 1;
        ctx.strokeRect(bX, fy, bW, floorH - 1);

        ctx.fillStyle = i === 0 && (smashState === "smashing" || smashState === "result")
          ? "#ff5e84"
          : "rgba(255, 209, 102, 0.25)";
        ctx.fillRect(bX + 14, fy + 5, 20, 11);
        ctx.fillRect(bX + 48, fy + 5, 20, 11);
        ctx.fillRect(bX + 82, fy + 5, 20, 11);

        ctx.fillStyle = "#9898a6";
        ctx.font = "bold 10px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(`${floorNum}F`, bX - 6, fy + 15);
      }

      ctx.fillStyle = "#1c1c22";
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
      ctx.strokeStyle = "#e65c7b";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      if (smashPower > 0 && (smashState === "charging" || smashState === "timing")) {
        const auraR = Math.min(68, 22 + smashPower * 0.35 + smashAuraPulse * 8);
        ctx.fillStyle = "rgba(230, 92, 123, 0.22)";
        ctx.beginPath();
        ctx.arc(170, groundY + 18, auraR, Math.PI, Math.PI * 2);
        ctx.fill();
        smashAuraPulse *= 0.85;
      }

      const cx = 160;
      const cy = groundY + 4;
      ctx.fillStyle = "#f4f4f6";
      ctx.fillRect(cx + 2, cy, 16, 18);
      ctx.fillStyle = "#e65c7b";
      ctx.fillRect(cx + 2, cy + 3, 16, 3);
      ctx.fillStyle = "#ffd166";
      if (smashState === "smashing" || smashState === "result") {
        ctx.fillRect(cx + 6, cy - 10, 8, 10);
      } else {
        ctx.fillRect(cx + 16, cy + 7, 7, 7);
      }

      for (let i = smashDebris.length - 1; i >= 0; i--) {
        const d = smashDebris[i];
        d.vy += 0.38;
        d.x += d.vx;
        d.y += d.vy;
        d.rot += d.vrot;
        d.life--;

        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.rot);
        ctx.fillStyle = d.color;
        ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
        ctx.restore();

        if (d.life <= 0) smashDebris.splice(i, 1);
      }

      ctx.textAlign = "center";
      if (smashState === "idle") {
        ctx.fillStyle = "rgba(15, 15, 18, 0.65)";
        ctx.fillRect(24, 125, 292, 86);
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText("🏢 초고층 건물 부수기", 170, 158);
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("터치 또는 스페이스바를 연타해 시작!", 170, 184);
      } else if (smashState === "charging") {
        ctx.fillStyle = "#ffd166";
        ctx.font = "900 22px sans-serif";
        ctx.fillText(`🔥 연타해서 기 모으기! (${remainSec.toFixed(1)}초)`, 170, 62);

        const barW = 240;
        const barX = 50;
        const fillRatio = Math.min(1, smashPower / 110);
        ctx.fillStyle = "#262630";
        ctx.fillRect(barX, 74, barW, 14);
        ctx.fillStyle = fillRatio > 0.8 ? "#ff4d6d" : "#e65c7b";
        ctx.fillRect(barX, 74, barW * fillRatio, 14);
      } else if (smashState === "timing") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 18px sans-serif";
        ctx.fillText("⚡ 중앙에 맞춰 일격 필살!!", 170, 355);

        const gX = 40;
        const gW = 260;
        const gY = 368;
        const gH = 18;

        ctx.fillStyle = "#262630";
        ctx.fillRect(gX, gY, gW, gH);

        ctx.fillStyle = "rgba(255, 209, 102, 0.35)";
        ctx.fillRect(gX + gW * 0.34, gY, gW * 0.32, gH);

        ctx.fillStyle = "#e65c7b";
        ctx.fillRect(gX + gW * 0.44, gY, gW * 0.12, gH);

        const cursorX = gX + gW * smashGaugePos;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(cursorX - 2.5, gY - 4, 5, gH + 8);
      } else if (smashState === "smashing" || smashState === "result") {
        ctx.fillStyle = "#ffd166";
        ctx.font = "900 16px sans-serif";
        ctx.fillText(smashCritLabel, 170, 348);

        ctx.fillStyle = "#ffffff";
        ctx.font = "900 22px sans-serif";
        ctx.fillText(`💥 ${smashBrokenFloors}층 격파!`, 170, 376);

        if (smashState === "result") {
          if (isNewBestPending) {
            ctx.fillStyle = "#ffd166";
            ctx.font = "bold 12px sans-serif";
            ctx.fillText("🎉 신기록! 아래에서 기록을 등록해 주세요", 170, 398);
          } else {
            ctx.fillStyle = "#ff8ca5";
            ctx.font = "600 12px sans-serif";
            ctx.fillText("터치하여 다시 도전하기", 170, 398);
          }
        }
      }

      ctx.restore();
    }

    /* ---------- 8. 낙화 갤러그 (Galaga Shooter) 상태 ---------- */
    let galagaRunning = false;
    let galagaOver = false;
    let galagaScore = 0;
    let galagaBest = Number(localStorage.getItem("nakhwaGalagaBest") || 0);
    let galagaStage = 1;
    let galagaLives = 3;
    let galagaWeaponLv = 1;
    let galagaFrame = 0;
    let galagaInvuln = 0;
    let galagaSessionHadBest = false;

    const galagaShip = {
      x: 170,
      y: 376,
      w: 24,
      h: 22,
      speed: 4.5
    };

    let galagaBullets = [];
    let galagaEnemies = [];
    let galagaEnemyBullets = [];
    let galagaPowerups = [];
    let galagaParticles = [];
    let galagaStars = [];
    let galagaFormDir = 1;
    let galagaDragging = false;
    let galagaLastDragX = 0;

    function initGalagaStars() {
      galagaStars = Array.from({ length: 28 }, () => ({
        x: Math.random() * 340,
        y: Math.random() * 410,
        s: 1 + Math.random() * 1.8,
        vy: 0.5 + Math.random() * 1.3
      }));
    }

    function spawnGalagaStage(stage) {
      galagaEnemies = [];
      galagaFormDir = 1;
      const rows = 4;
      const cols = 7;
      const startX = 36;
      const startY = 54;
      const gapX = 44;
      const gapY = 30;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const kind = r === 0 ? "boss" : (r === 1 ? "elite" : "grunt");
          const hp = kind === "boss" ? 2 : 1;
          const pts = kind === "boss" ? 150 : (kind === "elite" ? 80 : 40);
          galagaEnemies.push({
            homeX: startX + c * gapX,
            homeY: startY + r * gapY,
            x: startX + c * gapX,
            y: startY + r * gapY - 120,
            kind,
            hp,
            pts,
            diving: false,
            diveT: 0,
            diveStartX: 0,
            diveStartY: 0,
            diveTargetX: 170,
            entering: true
          });
        }
      }
    }

    function resetGalaga() {
      galagaShip.x = 170;
      galagaShip.y = 376;
      galagaBullets = [];
      galagaEnemyBullets = [];
      galagaPowerups = [];
      galagaParticles = [];
      galagaScore = 0;
      galagaStage = 1;
      galagaLives = 3;
      galagaWeaponLv = 1;
      galagaFrame = 0;
      galagaInvuln = 0;
      galagaOver = false;
      galagaRunning = true;
      galagaDragging = false;
      galagaSessionHadBest = false;
      isNewBestPending = false;
      hideSubmitBar();
      initGalagaStars();
      spawnGalagaStage(1);
    }

    function spawnGalagaExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const ang = (Math.PI * 2 * i) / 12 + Math.random() * 0.4;
        const spd = 1.2 + Math.random() * 3.0;
        galagaParticles.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          r: 2 + Math.random() * 2,
          color,
          life: 24
        });
      }
    }

    function hitGalagaPlayer() {
      if (galagaInvuln > 0 || galagaOver) return;
      spawnGalagaExplosion(galagaShip.x, galagaShip.y, "#ff5e84");
      galagaLives--;
      galagaWeaponLv = Math.max(1, galagaWeaponLv - 1);
      galagaInvuln = 110;

      if (galagaLives <= 0) {
        galagaOver = true;
        triggerGameOver(galagaSessionHadBest, galagaScore > 0);
      }
    }

    function drawGalagaFrame() {
      ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
      for (const st of galagaStars) {
        if (galagaRunning && !galagaOver) {
          st.y += st.vy;
          if (st.y > canvas.height) {
            st.y = 0;
            st.x = Math.random() * canvas.width;
          }
        }
        ctx.fillRect(st.x, st.y, st.s, st.s);
      }

      if (galagaRunning && !galagaOver) {
        galagaFrame++;
        if (galagaInvuln > 0) galagaInvuln--;

        if (dodgeKeys.left) galagaShip.x -= galagaShip.speed;
        if (dodgeKeys.right) galagaShip.x += galagaShip.speed;
        galagaShip.x = Math.max(18, Math.min(canvas.width - 18, galagaShip.x));

        if (galagaFrame % 12 === 0) {
          if (galagaWeaponLv === 1) {
            galagaBullets.push({ x: galagaShip.x, y: galagaShip.y - 14, vx: 0, vy: -7.5 });
          } else if (galagaWeaponLv === 2) {
            galagaBullets.push({ x: galagaShip.x - 6, y: galagaShip.y - 12, vx: 0, vy: -7.5 });
            galagaBullets.push({ x: galagaShip.x + 6, y: galagaShip.y - 12, vx: 0, vy: -7.5 });
          } else {
            galagaBullets.push({ x: galagaShip.x, y: galagaShip.y - 15, vx: 0, vy: -7.8 });
            galagaBullets.push({ x: galagaShip.x - 7, y: galagaShip.y - 10, vx: -0.9, vy: -7.4 });
            galagaBullets.push({ x: galagaShip.x + 7, y: galagaShip.y - 10, vx: 0.9, vy: -7.4 });
          }
        }

        for (let i = galagaBullets.length - 1; i >= 0; i--) {
          const b = galagaBullets[i];
          b.x += b.vx;
          b.y += b.vy;
          if (b.y < -10) galagaBullets.splice(i, 1);
        }

        const formSpeed = (0.7 + Math.min(1.2, galagaStage * 0.14)) * galagaFormDir;
        let hitEdge = false;
        for (const e of galagaEnemies) {
          e.homeX += formSpeed;
          if (e.homeX < 22 || e.homeX > canvas.width - 22) hitEdge = true;
        }
        if (hitEdge) galagaFormDir *= -1;

        const diveInterval = Math.max(45, 115 - galagaStage * 12);
        if (galagaFrame % diveInterval === 0 && galagaEnemies.length > 0) {
          const candidates = galagaEnemies.filter(e => !e.diving && !e.entering);
          if (candidates.length > 0) {
            const diver = candidates[Math.floor(Math.random() * candidates.length)];
            diver.diving = true;
            diver.diveT = 0;
            diver.diveStartX = diver.x;
            diver.diveStartY = diver.y;
            diver.diveTargetX = galagaShip.x;
          }
        }

        for (let i = galagaEnemies.length - 1; i >= 0; i--) {
          const e = galagaEnemies[i];

          if (e.entering) {
            e.x += (e.homeX - e.x) * 0.1;
            e.y += (e.homeY - e.y) * 0.1;
            if (Math.abs(e.y - e.homeY) < 1.5) e.entering = false;
          } else if (e.diving) {
            e.diveT += 0.014 + galagaStage * 0.0015;
            const t = e.diveT;
            const targetX = e.diveTargetX + Math.sin(t * Math.PI * 2.2) * 55;
            e.x = e.diveStartX * (1 - t) + targetX * t;
            e.y = e.diveStartY + t * (canvas.height - e.diveStartY + 35);

            if (Math.abs(t - 0.35) < 0.015) {
              const ang = Math.atan2(galagaShip.y - e.y, galagaShip.x - e.x);
              const bSpd = 2.8 + Math.min(1.8, galagaStage * 0.25);
              galagaEnemyBullets.push({
                x: e.x,
                y: e.y + 8,
                vx: Math.cos(ang) * bSpd,
                vy: Math.sin(ang) * bSpd
              });
            }

            if (e.y > canvas.height + 24) {
              e.diving = false;
              e.entering = true;
              e.y = -20;
              e.x = e.homeX;
            }
          } else {
            e.x = e.homeX;
            e.y = e.homeY + Math.sin(galagaFrame * 0.06 + e.homeX * 0.05) * 2;
          }

          if (Math.hypot(e.x - galagaShip.x, e.y - galagaShip.y) < 17) {
            hitGalagaPlayer();
          }

          for (let bi = galagaBullets.length - 1; bi >= 0; bi--) {
            const b = galagaBullets[bi];
            if (Math.abs(b.x - e.x) < 13 && Math.abs(b.y - e.y) < 11) {
              galagaBullets.splice(bi, 1);
              e.hp--;
              if (e.hp <= 0) {
                const earned = e.diving ? e.pts * 2 : e.pts;
                galagaScore += earned;
                if (galagaScore > galagaBest) {
                  galagaBest = galagaScore;
                  galagaSessionHadBest = true;
                  localStorage.setItem("nakhwaGalagaBest", String(galagaBest));
                }

                const boomColor = e.kind === "boss" ? "#ffd166" : (e.kind === "elite" ? "#ff7999" : "#72efdd");
                spawnGalagaExplosion(e.x, e.y, boomColor);

                if (Math.random() < 0.12 && galagaWeaponLv < 3) {
                  galagaPowerups.push({ x: e.x, y: e.y, vy: 2.0 });
                }

                galagaEnemies.splice(i, 1);
              } else {
                spawnGalagaExplosion(e.x, e.y, "#ffffff");
              }
              break;
            }
          }
        }

        if (galagaEnemies.length === 0) {
          galagaStage++;
          spawnGalagaStage(galagaStage);
        }

        for (let i = galagaEnemyBullets.length - 1; i >= 0; i--) {
          const eb = galagaEnemyBullets[i];
          eb.x += eb.vx;
          eb.y += eb.vy;
          if (Math.hypot(eb.x - galagaShip.x, eb.y - galagaShip.y) < 10) {
            galagaEnemyBullets.splice(i, 1);
            hitGalagaPlayer();
            continue;
          }
          if (eb.y > canvas.height + 10 || eb.x < -10 || eb.x > canvas.width + 10) {
            galagaEnemyBullets.splice(i, 1);
          }
        }

        for (let i = galagaPowerups.length - 1; i >= 0; i--) {
          const p = galagaPowerups[i];
          p.y += p.vy;
          if (Math.hypot(p.x - galagaShip.x, p.y - galagaShip.y) < 18) {
            galagaWeaponLv = Math.min(3, galagaWeaponLv + 1);
            galagaScore += 100;
            if (galagaScore > galagaBest) {
              galagaBest = galagaScore;
              galagaSessionHadBest = true;
              localStorage.setItem("nakhwaGalagaBest", String(galagaBest));
            }
            galagaPowerups.splice(i, 1);
            continue;
          }
          if (p.y > canvas.height + 15) galagaPowerups.splice(i, 1);
        }
      }

      for (const e of galagaEnemies) {
        ctx.save();
        ctx.translate(e.x, e.y);
        if (e.diving) {
          ctx.rotate(Math.sin(e.diveT * Math.PI * 2) * 0.35);
        }

        const wingFlap = Math.sin(galagaFrame * 0.25 + e.homeX) * 2;
        if (e.kind === "boss") {
          ctx.fillStyle = e.hp === 2 ? "#ffd166" : "#ff6b6b";
          ctx.fillRect(-10, -4 - wingFlap, 20, 8);
          ctx.fillRect(-6, -8, 12, 14);
          ctx.fillStyle = "#121216";
          ctx.fillRect(-4, -3, 2, 3);
          ctx.fillRect(2, -3, 2, 3);
        } else if (e.kind === "elite") {
          ctx.fillStyle = "#ff7999";
          ctx.fillRect(-9, -3 - wingFlap, 18, 6);
          ctx.fillRect(-5, -6, 10, 11);
          ctx.fillStyle = "#fff";
          ctx.fillRect(-3, -2, 2, 2);
          ctx.fillRect(1, -2, 2, 2);
        } else {
          ctx.fillStyle = "#72efdd";
          ctx.fillRect(-8, -3 - wingFlap, 16, 6);
          ctx.fillRect(-4, -5, 8, 9);
          ctx.fillStyle = "#e65c7b";
          ctx.fillRect(-2, -1, 4, 3);
        }
        ctx.restore();
      }

      if (!galagaOver && (galagaInvuln === 0 || Math.floor(galagaInvuln / 5) % 2 === 0)) {
        const sx = Math.round(galagaShip.x);
        const sy = Math.round(galagaShip.y);

        ctx.fillStyle = galagaFrame % 4 < 2 ? "#ff5e84" : "#ffd166";
        ctx.fillRect(sx - 3, sy + 10, 6, 5);

        ctx.fillStyle = "#f4f4f6";
        ctx.beginPath();
        ctx.moveTo(sx, sy - 13);
        ctx.lineTo(sx + 13, sy + 10);
        ctx.lineTo(sx, sy + 6);
        ctx.lineTo(sx - 13, sy + 10);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#e65c7b";
        ctx.fillRect(sx - 2, sy - 5, 4, 8);
        ctx.fillRect(sx - 11, sy + 2, 3, 6);
        ctx.fillRect(sx + 8, sy + 2, 3, 6);
      }

      ctx.fillStyle = "#ff9eb5";
      for (const b of galagaBullets) {
        ctx.fillRect(b.x - 1.5, b.y - 5, 3, 10);
      }

      ctx.fillStyle = "#ffd166";
      for (const eb of galagaEnemyBullets) {
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const p of galagaPowerups) {
        ctx.fillStyle = "#e65c7b";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 10px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("P", p.x, p.y + 0.5);
      }

      for (let i = galagaParticles.length - 1; i >= 0; i--) {
        const pt = galagaParticles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = Math.max(0, pt.life / 24);
        ctx.fillRect(pt.x, pt.y, pt.r, pt.r);
        ctx.globalAlpha = 1;
        if (pt.life <= 0) galagaParticles.splice(i, 1);
      }

      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "#f4f4f6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`SCORE ${galagaScore}`, 12, 22);

      ctx.fillStyle = "#ff8ca5";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText(`STAGE ${galagaStage} · LV.${galagaWeaponLv}`, 12, 37);

      ctx.fillStyle = "#9898a6";
      ctx.textAlign = "right";
      ctx.fillText(`BEST ${galagaBest}`, 328, 22);
      ctx.fillText("❤️".repeat(Math.max(0, galagaLives)), 328, 38);

      if (galagaOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.78)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`🚀 격추됨 · ${galagaScore}점`, canvas.width / 2, 190);
        if (isNewBestPending) {
          ctx.fillStyle = "#ffd166";
          ctx.font = "bold 13px sans-serif";
          ctx.fillText("🎉 신기록! 아래에서 기록을 등록해 주세요", canvas.width / 2, 220);
        } else {
          ctx.fillStyle = "#ff8ca5";
          ctx.font = "600 13px sans-serif";
          ctx.fillText("화면을 터치하면 다시 출격합니다", canvas.width / 2, 220);
        }
      }
    }

    /* ---------- 9. 낙화 펀치아웃 (Punch-Out!!) 상태 ---------- */
    const PUNCH_ENEMIES = [
      { name: "낙화 견습생", skin: "#f4c2a1", trunk: "#4ea8de", hair: "#2b2d42", maxHp: 60 },
      { name: "홍염 파이터", skin: "#e09f7d", trunk: "#e65c7b", hair: "#1a1a1f", maxHp: 85 },
      { name: "강철 챔피언", skin: "#c68642", trunk: "#ffd166", hair: "#000000", maxHp: 115 }
    ];

    let punchRunning = false;
    let punchOver = false;
    let punchScore = 0;
    let punchBest = Number(localStorage.getItem("nakhwaPunchBest") || 0);
    let punchRound = 1;
    let punchSessionHadBest = false;

    let pBoxerState = "idle";
    let pBoxerTimer = 0;
    let pBoxerHp = 100;
    let pBoxerStamina = 3;

    let eBoxerState = "guard";
    let eBoxerTimer = 60;
    let eBoxerHp = 60;
    let eBoxerMaxHp = 60;
    let eBoxerYOffset = 0;
    let punchShake = 0;
    let punchPopupText = "";
    let punchPopupTimer = 0;

    function getCurrentPunchEnemy() {
      return PUNCH_ENEMIES[(punchRound - 1) % PUNCH_ENEMIES.length];
    }

    function setupPunchRound(round) {
      punchRound = round;
      const spec = getCurrentPunchEnemy();
      const hpBonus = Math.floor((round - 1) / 3) * 25;
      eBoxerMaxHp = spec.maxHp + hpBonus;
      eBoxerHp = eBoxerMaxHp;
      eBoxerState = "guard";
      eBoxerTimer = 55;
      eBoxerYOffset = 0;
      pBoxerState = "idle";
      pBoxerTimer = 0;
      pBoxerStamina = 3;
      pBoxerHp = Math.min(100, pBoxerHp + 25);
    }

    function resetPunch() {
      punchScore = 0;
      pBoxerHp = 100;
      punchOver = false;
      punchRunning = true;
      punchShake = 0;
      punchPopupText = "";
      punchPopupTimer = 0;
      punchSessionHadBest = false;
      isNewBestPending = false;
      hideSubmitBar();
      setupPunchRound(1);
    }

    function showPunchPopup(text) {
      punchPopupText = text;
      punchPopupTimer = 32;
    }

    function punchDodge(dir) {
      if (!punchRunning || punchOver) return;
      if (pBoxerState !== "idle") return;
      pBoxerState = dir === "L" ? "dodgeL" : "dodgeR";
      pBoxerTimer = 26;
    }

    function punchAttack() {
      if (!punchRunning || punchOver) {
        if (!canRestartNow()) return;
        resetPunch();
        return;
      }
      if (pBoxerState !== "idle" || pBoxerStamina <= 0) return;

      pBoxerState = "punch";
      pBoxerTimer = 14;

      if (eBoxerState === "stunned") {
        const dmg = 22;
        eBoxerHp = Math.max(0, eBoxerHp - dmg);
        eBoxerState = "hurt";
        eBoxerTimer = 18;
        punchShake = 9;
        punchScore += 150;
        showPunchPopup("💥 COUNTER UPPERCUT!");
      } else if (eBoxerState === "telegraphL" || eBoxerState === "telegraphR" || eBoxerState === "telegraphBoth") {
        const dmg = 10;
        eBoxerHp = Math.max(0, eBoxerHp - dmg);
        punchShake = 4;
        punchScore += 60;
        showPunchPopup("⚡ JAB HIT!");
      } else if (eBoxerState === "guard") {
        pBoxerStamina = Math.max(0, pBoxerStamina - 1);
        punchShake = 2;
        showPunchPopup("🛡️ BLOCKED!");
      }

      if (punchScore > punchBest) {
        punchBest = punchScore;
        punchSessionHadBest = true;
        localStorage.setItem("nakhwaPunchBest", String(punchBest));
      }

      if (eBoxerHp <= 0 && eBoxerState !== "ko") {
        eBoxerState = "ko";
        eBoxerTimer = 65;
        punchScore += punchRound * 300;
        if (punchScore > punchBest) {
          punchBest = punchScore;
          punchSessionHadBest = true;
          localStorage.setItem("nakhwaPunchBest", String(punchBest));
        }
        showPunchPopup("🏆 K.O.!!");
      }
    }

    function updatePunchLogic() {
      if (!punchRunning || punchOver) return;

      if (punchPopupTimer > 0) punchPopupTimer--;

      if (pBoxerTimer > 0) {
        pBoxerTimer--;
        if (pBoxerTimer <= 0) {
          pBoxerState = "idle";
        }
      }

      if (eBoxerState === "ko") {
        eBoxerYOffset += 2.2;
        eBoxerTimer--;
        if (eBoxerTimer <= 0) {
          setupPunchRound(punchRound + 1);
        }
        return;
      }

      eBoxerTimer--;
      if (eBoxerTimer <= 0) {
        if (eBoxerState === "guard" || eBoxerState === "hurt" || eBoxerState === "stunned") {
          pBoxerStamina = 3;
          const telegraphDur = Math.max(22, 46 - punchRound * 3);
          const roll = Math.random();
          if (punchRound >= 2 && roll < 0.28) {
            eBoxerState = "telegraphBoth";
          } else if (roll < 0.64) {
            eBoxerState = "telegraphL";
          } else {
            eBoxerState = "telegraphR";
          }
          eBoxerTimer = telegraphDur;
        } else if (eBoxerState === "telegraphL" || eBoxerState === "telegraphR" || eBoxerState === "telegraphBoth") {
          const atkType = eBoxerState === "telegraphL" ? "attackL"
            : (eBoxerState === "telegraphR" ? "attackR" : "attackBoth");
          eBoxerState = atkType;
          eBoxerTimer = 14;

          const dodged =
            (atkType === "attackL" && pBoxerState === "dodgeR") ||
            (atkType === "attackR" && pBoxerState === "dodgeL") ||
            (atkType === "attackBoth" && (pBoxerState === "dodgeL" || pBoxerState === "dodgeR"));

          if (!dodged) {
            const dmg = atkType === "attackBoth" ? 28 : 20;
            pBoxerHp = Math.max(0, pBoxerHp - dmg);
            pBoxerState = "hurt";
            pBoxerTimer = 20;
            punchShake = 11;
            showPunchPopup("💢 HIT!");

            if (pBoxerHp <= 0) {
              punchOver = true;
              triggerGameOver(punchSessionHadBest, punchScore > 0);
            }
          } else {
            showPunchPopup("✨ DODGE!");
          }
        } else if (eBoxerState === "attackL" || eBoxerState === "attackR" || eBoxerState === "attackBoth") {
          eBoxerState = "stunned";
          eBoxerTimer = Math.max(28, 48 - punchRound * 2);
        }
      }
    }

    function drawPunchFrame() {
      updatePunchLogic();

      ctx.save();
      if (punchShake > 0.3) {
        ctx.translate((Math.random() - 0.5) * punchShake, (Math.random() - 0.5) * punchShake);
        punchShake *= 0.84;
      }

      ctx.fillStyle = "#16161d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const ropeColors = ["#e65c7b", "#f4f4f6", "#4ea8de"];
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = ropeColors[i];
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, 145 + i * 26);
        ctx.lineTo(canvas.width, 145 + i * 26);
        ctx.stroke();
      }

      ctx.fillStyle = "#1f2430";
      ctx.fillRect(0, 220, canvas.width, 190);
      ctx.strokeStyle = "#3a4256";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 220);
      ctx.lineTo(canvas.width, 220);
      ctx.stroke();

      const spec = getCurrentPunchEnemy();
      ctx.fillStyle = "#9898a6";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`ROUND ${punchRound} · ${spec.name}`, 14, 20);

      ctx.fillStyle = "#282832";
      ctx.fillRect(14, 25, 150, 10);
      ctx.fillStyle = "#e65c7b";
      ctx.fillRect(14, 25, 150 * Math.max(0, eBoxerHp / eBoxerMaxHp), 10);

      ctx.textAlign = "right";
      ctx.fillStyle = "#f4f4f6";
      ctx.font = "bold 12px sans-serif";
      ctx.fillText(`SCORE ${punchScore}`, 326, 20);
      ctx.fillStyle = "#9898a6";
      ctx.font = "600 11px sans-serif";
      ctx.fillText(`BEST ${punchBest}`, 326, 35);

      ctx.save();
      let ex = 170;
      let ey = 175 + eBoxerYOffset;
      if (eBoxerState === "telegraphL") ex -= 14;
      if (eBoxerState === "telegraphR") ex += 14;
      if (eBoxerState === "hurt") ey -= 8;
      if (eBoxerState === "stunned") ey += 6;

      ctx.translate(ex, ey);

      ctx.fillStyle = spec.trunk;
      ctx.fillRect(-34, 28, 68, 34);

      ctx.fillStyle = eBoxerState === "hurt" ? "#ff8ca5" : spec.skin;
      ctx.fillRect(-38, -28, 76, 58);

      ctx.fillRect(-22, -68, 44, 40);
      ctx.fillStyle = spec.hair;
      ctx.fillRect(-24, -74, 48, 14);

      const isTelegraph = eBoxerState.startsWith("telegraph");
      ctx.fillStyle = isTelegraph ? "#ffd166" : "#121216";
      ctx.fillRect(-13, -52, 8, 6);
      ctx.fillRect(5, -52, 8, 6);

      if (isTelegraph) {
        ctx.strokeStyle = "#ffd166";
        ctx.lineWidth = 2;
        ctx.beginPath();
