<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>낙화 비밀 오락실 | nakhwa-archive</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="낙화 비밀 오락실 | nakhwa-archive" />
  <meta property="og:description" content="메이븐 길드 [낙화] 미니게임 & 실시간 랭킹 보드" />
  <meta property="og:image" content="https://nakhwa-archive.github.io/html/comics/thumbnail.jpg" />
  <meta property="og:url" content="https://nakhwa-archive.github.io/html/games/" />

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a1f;
      --card-hover: #24242b;
      --text-main: #f4f4f6;
      --text-sub: #9898a6;
      --accent: #e65c7b;
      --border: #282830;
      --bar-bg: rgba(18, 18, 22, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      line-height: 1.4;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }

    body.fs-locked {
      overflow: hidden;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      padding-bottom: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bar-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    header h1 {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header h1 span {
      color: var(--accent);
    }

    .nav-btn {
      background: #18181d;
      border: 1px solid var(--border);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .nav-btn:active {
      transform: scale(0.95);
      border-color: var(--accent);
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 12px;
    }

    /* 1. 게임 선택 로비 화면 */
    .lobby-intro {
      margin-bottom: 14px;
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(230, 92, 123, 0.14), rgba(26, 26, 31, 0.9));
      border: 1px solid rgba(230, 92, 123, 0.3);
      border-radius: 14px;
    }

    .lobby-intro h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .lobby-intro p {
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .game-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .game-card:active {
      transform: scale(0.98);
      border-color: var(--accent);
      background: var(--card-hover);
    }

    .game-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: #121216;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      flex-shrink: 0;
    }

    .game-card-body {
      flex: 1;
      min-width: 0;
    }

    .game-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 3px;
    }

    .game-card-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .game-best-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(230, 92, 123, 0.14);
      padding: 2px 7px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .game-card-desc {
      font-size: 0.8rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-arrow {
      color: var(--text-sub);
      font-size: 0.9rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* 2. 게임 플레이 화면 */
    .play-view {
      display: none;
    }

    .play-view.active {
      display: block;
    }

    .lobby-view.hidden {
      display: none;
    }

    .arcade-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .play-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .play-game-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .action-pill-btn {
      background: #24242b;
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-pill-btn.fs-btn {
      background: rgba(230, 92, 123, 0.16);
      border-color: rgba(230, 92, 123, 0.45);
      color: #ff8ca5;
    }

    .action-pill-btn:active {
      transform: scale(0.95);
    }

    .canvas-stage {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #gameCanvas {
      background: #121216;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: block;
      touch-action: none;
      cursor: pointer;
      user-select: none;
      margin: 0 auto;
    }

    /* 전체화면 */
    .arcade-card.is-fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3000;
      width: 100%;
      height: 100%;
      border-radius: 0;
      border: none;
      background: #0b0b0e;
      padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .arcade-card.is-fullscreen .play-header-bar {
      margin-bottom: 6px;
      padding-bottom: 8px;
      flex-shrink: 0;
    }

    .arcade-card.is-fullscreen .canvas-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arcade-card.is-fullscreen .easter-hint {
      margin-top: 6px;
      flex-shrink: 0;
    }

    .arcade-card.is-fullscreen .score-submit-bar {
      margin-top: 8px;
      flex-shrink: 0;
    }

    .arcade-card.is-fullscreen .ranking-board {
      display: none;
    }

    .easter-hint {
      margin-top: 10px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    /* 점수 등록 바 */
    .score-submit-bar {
      display: none;
      flex-direction: column;
      margin-top: 12px;
      padding: 10px;
      background: #141418;
      border: 1px solid rgba(230, 92, 123, 0.45);
      border-radius: 10px;
      gap: 8px;
    }

    .score-submit-bar.active {
      display: flex;
    }

    .score-submit-bar.new-record {
      border-color: #ffd166;
      background: rgba(255, 209, 102, 0.08);
    }

    .new-record-banner {
      display: none;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffd166;
      text-align: center;
    }

    .score-submit-bar.new-record .new-record-banner {
      display: block;
    }

    .score-input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .nick-input {
      flex: 1;
      min-width: 0;
      height: 38px;
      background: #1e1e24;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }

    .nick-input:focus {
      border-color: var(--accent);
    }

    .submit-score-btn {
      height: 38px;
      padding: 0 14px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .submit-score-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .skip-record-btn {
      display: none;
      height: 38px;
      padding: 0 10px;
      background: #24242c;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .score-submit-bar.new-record .skip-record-btn {
      display: inline-block;
    }

    /* 실시간 랭킹 보드 */
    .ranking-board {
      margin-top: 14px;
      background: #141418;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .ranking-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .ranking-status {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-sub);
    }

    .ranking-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      padding: 6px 8px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.02);
    }

    .ranking-item.top1 {
      background: rgba(230, 92, 123, 0.14);
      color: #ff9eb5;
      font-weight: 700;
    }

    .rank-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .rank-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-score {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }

    .guild-footer {
      margin-top: 20px;
      padding: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }

    .guild-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .guild-title .accent {
      color: var(--accent);
    }

    .guild-sub {
      font-size: 0.84rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1 id="headerTitle">🌸 <span>낙화</span> 비밀 오락실</h1>
    </div>
    <a href="../comics/" class="nav-btn" id="headerComicsLink">← 4컷 만화</a>
  </header>

  <main>
    <!-- 1. 게임 목록 로비 화면 -->
    <section id="lobbyView" class="lobby-view">
      <div class="lobby-intro">
        <h2>🎮 미니게임 선택 (총 14종)</h2>
        <p>원하는 게임을 선택해 길드원들과 랭킹을 겨뤄보세요!</p>
      </div>

      <div class="game-grid">
        <button type="button" class="game-card" data-game="lighthouse">
          <div class="game-icon-box">🔦</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 등대 수비대</span>
              <span class="game-best-badge" id="badgeLighthouse">BEST 0점</span>
            </div>
            <p class="game-card-desc">빛줄기를 회전시켜 어둠 속 요괴들을 정화하는 디펜스</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="racer">
          <div class="game-icon-box">🏎️</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 터보 레이서</span>
              <span class="game-best-badge" id="badgeRacer">BEST 0점</span>
            </div>
            <p class="game-card-desc">4차선 고속도로 질주 & 니트로 부스터로 차량 추월!</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="enhance">
          <div class="game-icon-box">🔨</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 무기 강화</span>
              <span class="game-best-badge" id="badgeEnhance">BEST 0점</span>
            </div>
            <p class="game-card-desc">파괴 확률을 뚫고 전설의 낙화신검을 제련하라!</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="snake">
          <div class="game-icon-box">🐍</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">꼬리잡기 스네이크</span>
              <span class="game-best-badge" id="badgeSnake">BEST 0점</span>
            </div>
            <p class="game-card-desc">경단과 벚꽃 보석을 먹으며 꼬리 길게 늘리기</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="brick">
          <div class="game-icon-box">🧱</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">벚꽃 벽돌깨기</span>
              <span class="game-best-badge" id="badgeBrick">BEST 0점</span>
            </div>
            <p class="game-card-desc">패들로 공을 튕겨 아이템과 함께 블록 격파!</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="punch">
          <div class="game-icon-box">🥊</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 펀치아웃</span>
              <span class="game-best-badge" id="badgePunch">BEST 0점</span>
            </div>
            <p class="game-card-desc">상대의 예비 동작을 피하고 빈틈에 카운터 어퍼컷!</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="galaga">
          <div class="game-icon-box">🚀</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 갤러그</span>
              <span class="game-best-badge" id="badgeGalaga">BEST 0점</span>
            </div>
            <p class="game-card-desc">돌격해 오는 적 편대를 격추하는 레트로 슈팅</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="smash">
          <div class="game-icon-box">🏢</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">건물 부수기</span>
              <span class="game-best-badge" id="badgeSmash">BEST 0층</span>
            </div>
            <p class="game-card-desc">연타로 기를 모아 일격에 초고층 빌딩 박살내기</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="suika">
          <div class="game-icon-box">🍉</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 수박게임</span>
              <span class="game-best-badge" id="badgeSuika">BEST 0점</span>
            </div>
            <p class="game-card-desc">같은 과일·꽃을 합쳐 거대한 수박과 만개 벚꽃 만들기</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="runner">
          <div class="game-icon-box">🌸</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 러너</span>
              <span class="game-best-badge" id="badgeRunner">BEST 0점</span>
            </div>
            <p class="game-card-desc">가시 바위를 점프로 피하며 끝없이 달리기</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="slash">
          <div class="game-icon-box">⚔️</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 발도술</span>
              <span class="game-best-badge" id="badgeSlash">BEST --.---</span>
            </div>
            <p class="game-card-desc">찰나의 신호를 포착해 베는 반응속도 승부</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="stack">
          <div class="game-icon-box">🍡</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">경단 쌓기</span>
              <span class="game-best-badge" id="badgeStack">BEST 0층</span>
            </div>
            <p class="game-card-desc">타이밍 맞춰 삼색 경단을 하늘 높이 쌓기</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="dodge">
          <div class="game-icon-box">💥</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 닷지</span>
              <span class="game-best-badge" id="badgeDodge">BEST 0.00초</span>
            </div>
            <p class="game-card-desc">사방에서 날아오는 탄막 사이에서 오래 버티기</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>

        <button type="button" class="game-card" data-game="gogun">
          <div class="game-icon-box">🪝</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">낙화 고군분투</span>
              <span class="game-best-badge" id="badgeGogun">BEST 0점</span>
            </div>
            <p class="game-card-desc">기와지붕 위에서 갈고리 와이어로 스윙 액션</p>
          </div>
          <span class="game-arrow">▶</span>
        </button>
      </div>
    </section>

    <!-- 2. 게임 플레이 화면 -->
    <section id="playView" class="play-view">
      <div class="arcade-card" id="arcadeCard">
        <div class="play-header-bar">
          <span class="play-game-title" id="playGameTitle">🌸 낙화 러너</span>
          <div class="play-header-actions">

    function triggerGameOver(isNewBest, hasScore) {
      gameOverLockUntil = performance.now() + 650;
      if (hasScore) {
        isNewBestPending = !!isNewBest;
        showSubmitBar(isNewBestPending);
      } else {
        isNewBestPending = false;
        hideSubmitBar();
      }
      if (isGameFullscreen) {
        requestAnimationFrame(fitCanvasExactAspect);

    }

    function canRestartNow() {
      if (isNewBestPending) return false;

      return true;
    }

    function getSafeKey(title) {
      return title.replace(/[.#$\[\]\/]/g, "_");
    }

    function initPetals() {
      petals = Array.from({ length: 14 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * GROUND_Y,
        r: 2 + Math.random() * 2.5,
        vx: -(0.6 + Math.random() * 1.2),
        vy: 0.4 + Math.random() * 0.8
      }));
    }

    function drawPetals(moving) {
      ctx.fillStyle = "rgba(255, 165, 188, 0.45)";
      petals.forEach(p => {
        if (moving) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.y > GROUND_Y) p.y = 0;
        }
        ctx.fillRect(p.x, p.y, p.r, p.r);
      });
    }

    function fitCanvasExactAspect() {
      if (!isInPlayScreen) return;
      const aspectRatio = currentAspect.w / currentAspect.h;

      if (isGameFullscreen) {
        const stageW = Math.max(120, canvasStage.clientWidth);
        const stageH = Math.max(120, canvasStage.clientHeight);
        let drawW = stageW;
        let drawH = drawW / aspectRatio;

        if (drawH > stageH) {
          drawH = stageH;
          drawW = drawH * aspectRatio;
        }

        canvas.style.width = `${Math.floor(drawW)}px`;
        canvas.style.height = `${Math.floor(drawH)}px`;
      } else {
        const availW = Math.max(120, canvasStage.clientWidth);
        const maxW = currentAspect === GAME_ASPECT.tall ? Math.min(340, availW) : availW;
        const drawW = maxW;
        const drawH = drawW / aspectRatio;

        canvas.style.width = `${Math.floor(drawW)}px`;
        canvas.style.height = `${Math.floor(drawH)}px`;
      }

          resetRacer();

          if (!canRestartNow()) return;

        }

      if (activeGame === "snake") return "snake_scores";

      if (activeGame === "stack") return "stack_scores";

      return "gogun_scores";
    }

    async function fetchLeaderboard() {
      rankingStatusEl.textContent = "불러오는 중...";
      const dbNode = getDbNode();

      try {
        const res = await fetch(`${CONFIG.firebaseDbUrl}/${dbNode}.json`);
        if (!res.ok) throw new Error("랭킹 로드 실패");
        const data = (await res.json()) || {};

        const validEntries = Object.values(data).filter(
          item => item && typeof item.score === "number" && item.score > 0 && item.name
        );

        const sorted = validEntries
          .sort((a, b) => activeGame === "slash" ? (a.score - b.score) : (b.score - a.score))
          .slice(0, 5);

        rankingListEl.innerHTML = "";
        if (sorted.length === 0) {
          rankingStatusEl.textContent = "첫 기록의 주인공이 되어보세요!";
          return;
        }

        rankingStatusEl.textContent = "실시간 TOP 5";
        const medals = ["🥇", "🥈", "🥉", "4위", "5위"];

        sorted.forEach((entry, idx) => {
          const li = document.createElement("li");
          li.className = `ranking-item ${idx === 0 ? "top1" : ""}`;

          const left = document.createElement("div");
          left.className = "rank-left";
          left.innerHTML = `<span>${medals[idx]}</span>`;

          const nameSpan = document.createElement("span");
          nameSpan.className = "rank-name";
          nameSpan.textContent = entry.name;
          left.appendChild(nameSpan);

          const scoreSpan = document.createElement("span");
          scoreSpan.className = "rank-score";
          if (activeGame === "slash") {
            scoreSpan.textContent = `${(entry.score / 1000).toFixed(3)}초`;
          } else if (activeGame === "stack" || activeGame === "smash") {
            scoreSpan.textContent = `${entry.score}층`;
          } else if (activeGame === "dodge") {
            scoreSpan.textContent = `${(entry.score / 1000).toFixed(2)}초`;
          } else {
            scoreSpan.textContent = `${entry.score}점`;
          }

          li.appendChild(left);
          li.appendChild(scoreSpan);
          rankingListEl.appendChild(li);
        });
      } catch (err) {
        rankingStatusEl.textContent = "랭킹 불러오기 실패";
        console.warn(err);
      }
    }

    async function submitScore() {
      const rawName = nickInput.value.trim();
      if (!rawName) {
        nickInput.focus();
        return;
      }

      let currentRecord = 0;
      if (activeGame === "lighthouse") currentRecord = lhLastScore;
      else if (activeGame === "racer") currentRecord = racerLastScore;
      else if (activeGame === "enhance") currentRecord = enhanceScore;
      else if (activeGame === "snake") currentRecord = snakeScore;
      else if (activeGame === "brick") currentRecord = brickScore;
      else if (activeGame === "punch") currentRecord = punchScore;
      else if (activeGame === "galaga") currentRecord = galagaScore;
      else if (activeGame === "smash") currentRecord = smashTargetFloors;
      else if (activeGame === "suika") currentRecord = suikaScore;
      else if (activeGame === "runner") currentRecord = runnerLastScore;
      else if (activeGame === "slash") currentRecord = slashReactionMs;
      else if (activeGame === "stack") currentRecord = stackFloors;
      else if (activeGame === "dodge") currentRecord = dodgeElapsedMs;
      else currentRecord = gogunLastScore;

      if (currentRecord <= 0) return;

      localStorage.setItem("nakhwaRunnerNick", rawName);
      btnSubmitScore.disabled = true;
      btnSubmitScore.textContent = "저장 중...";

      const dbNode = getDbNode();

      try {
        const safeKey = getSafeKey(rawName);
        const encodedKey = encodeURIComponent(safeKey);
        const url = `${CONFIG.firebaseDbUrl}/${dbNode}/${encodedKey}.json`;

        const existingRes = await fetch(url);
        const existingData = await existingRes.json();
        const prevScore = existingData && typeof existingData.score === "number" ? existingData.score : 0;

        const isNewRecord = activeGame === "slash"
          ? (prevScore === 0 || currentRecord < prevScore)
          : (currentRecord > prevScore);

        if (isNewRecord) {
          await fetch(url, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: rawName,
              score: currentRecord,
              updatedAt: Date.now()
            })
          });
          btnSubmitScore.textContent = "갱신 완료!";
        } else {
          let prevLabel = `${prevScore}점`;
          if (activeGame === "slash") prevLabel = `${(prevScore / 1000).toFixed(3)}초`;
          else if (activeGame === "stack" || activeGame === "smash") prevLabel = `${prevScore}층`;
          else if (activeGame === "dodge") prevLabel = `${(prevScore / 1000).toFixed(2)}초`;
          btnSubmitScore.textContent = `기존 최고 ${prevLabel}`;
        }

        isNewBestPending = false;
        scoreSubmitBar.classList.remove("new-record");
        if (isGameFullscreen) requestAnimationFrame(fitCanvasExactAspect);
        await fetchLeaderboard();
      } catch (err) {
        btnSubmitScore.disabled = false;
        btnSubmitScore.textContent = "다시 시도";
        console.warn("점수 저장 실패:", err);
      }
    }

    btnSubmitScore.addEventListener("click", submitScore);
    nickInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        submitScore();
      }
    });

    /* ---------- 캔버스 포인터 이벤트 ---------- */
    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (!isInPlayScreen) return;

      if (activeGame === "lighthouse") {
        if (lhOver || !lhRunning) {
          if (!canRestartNow()) return;
          resetLighthouse();
          return;
        }
        const rect = canvas.getBoundingClientRect();
        const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
        const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
        if (cy >= 365 && lhEnergy >= 100) {
          triggerLhFlashBurst();
          return;
        }
        lhPointerDown = true;
        aimLighthouseAt(cx, cy);
        return;
      }

      if (activeGame === "racer") {
        if (racerOver || !racerRunning) {
          if (!canRestartNow()) return;
          resetRacer();
          return;
        }
        racerDragging = true;
        const rect = canvas.getBoundingClientRect();
        racerLastDragX = (e.clientX - rect.left) * (canvas.width / rect.width);
        return;
      }

      if (activeGame === "enhance") {
        if (enhanceOver || !enhanceRunning) {
          if (!canRestartNow()) return;
          resetEnhance();
          return;
        }
        const rect = canvas.getBoundingClientRect();
        const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
        const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
        if (cy >= 340 && cx >= 208) {
          sellEnhanceWeapon();
        } else {
          doEnhanceAttempt();
        }
        return;
      }

      if (activeGame === "snake") {
        if (snakeOver || !snakeRunning) {
          if (!canRestartNow()) return;
          resetSnake();
          return;
        }
        snakeSwipeStart = { x: e.clientX, y: e.clientY };
        return;
      }

      if (activeGame === "brick") {
        if (brickOver || !brickRunning) {
          if (!canRestartNow()) return;
          resetBrick();
          return;
        }
        launchStuckBrickBalls();
        brickDragging = true;
        const rect = canvas.getBoundingClientRect();
        brickLastDragX = (e.clientX - rect.left) * (canvas.width / rect.width);
        return;
      }

      if (activeGame === "punch") {
        if (punchOver || !punchRunning) {
          if (!canRestartNow()) return;
          resetPunch();
          return;
        }
        const rect = canvas.getBoundingClientRect();
        const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
        if (cx < canvas.width * 0.3) {
          punchDodge("L");
        } else if (cx > canvas.width * 0.7) {
          punchDodge("R");
        } else {
          punchAttack();
        }
        return;
      }

      if (activeGame === "galaga") {
        if (galagaOver || !galagaRunning) {
          if (!canRestartNow()) return;
          resetGalaga();
          return;
        }
        galagaDragging = true;
        const rect = canvas.getBoundingClientRect();
        galagaLastDragX = (e.clientX - rect.left) * (canvas.width / rect.width);
        return;
      }

      if (activeGame === "suika") {
        if (suikaOver || !suikaRunning) {
          if (!canRestartNow()) return;
          resetSuika();
          return;
        }
        suikaAiming = true;
        const rect = canvas.getBoundingClientRect();
        const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
        suikaDropX = clampSuikaX(cx, suikaCurTier);
        return;
      }

      if (activeGame === "dodge" && dodgeRunning && !dodgeOver) {
        dodgePointerActive = true;
        const rect = canvas.getBoundingClientRect();
        dodgeLastPointer = {
          x: (e.clientX - rect.left) * (canvas.width / rect.width),
          y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
        return;
      }

      if (activeGame === "gogun") {
        handleGogunPressStart();
        return;
      }

      handleCanvasAction();
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!isInPlayScreen) return;

      if (activeGame === "lighthouse" && lhPointerDown && !lhOver) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
        const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
        aimLighthouseAt(cx, cy);
        return;
      }

      if (activeGame === "racer" && racerDragging && !racerOver) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const curX = (e.clientX - rect.left) * (canvas.width / rect.width);
        const dx = curX - racerLastDragX;
        racerLastDragX = curX;
        const minX = RACER_ROAD.left + racerCar.w / 2 + 3;
        const maxX = RACER_ROAD.right - racerCar.w / 2 - 3;
        racerCar.x = Math.max(minX, Math.min(maxX, racerCar.x + dx * 1.15));
        return;
      }

      if (activeGame === "snake" && snakeSwipeStart && !snakeOver) {
        e.preventDefault();
        const dx = e.clientX - snakeSwipeStart.x;
        const dy = e.clientY - snakeSwipeStart.y;
        if (Math.hypot(dx, dy) >= 18) {
          if (Math.abs(dx) > Math.abs(dy)) {
            queueSnakeDirection(dx > 0 ? 1 : -1, 0);
          } else {
            queueSnakeDirection(0, dy > 0 ? 1 : -1);
          }
          snakeSwipeStart = { x: e.clientX, y: e.clientY };
        }
        return;
      }

      if (activeGame === "brick" && brickDragging && !brickOver) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const curX = (e.clientX - rect.left) * (canvas.width / rect.width);
        const dx = curX - brickLastDragX;
        brickLastDragX = curX;
        const halfW = brickPaddle.w / 2;
        brickPaddle.x = Math.max(halfW + 6, Math.min(canvas.width - halfW - 6, brickPaddle.x + dx * 1.15));
        return;
      }

      if (activeGame === "galaga" && galagaDragging && !galagaOver) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const curX = (e.clientX - rect.left) * (canvas.width / rect.width);
        const dx = curX - galagaLastDragX;
        galagaLastDragX = curX;
        galagaShip.x = Math.max(18, Math.min(canvas.width - 18, galagaShip.x + dx * 1.15));
        return;
      }

      if (activeGame === "suika" && suikaRunning && !suikaOver) {
        if (suikaAiming || e.pointerType === "mouse") {
          const rect = canvas.getBoundingClientRect();
          const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
          suikaDropX = clampSuikaX(cx, suikaCurTier);
        }
        return;
      }

      if (activeGame !== "dodge" || !dodgePointerActive || dodgeOver) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const curX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const curY = (e.clientY - rect.top) * (canvas.height / rect.height);

      const dx = curX - dodgeLastPointer.x;
      const dy = curY - dodgeLastPointer.y;
      dodgeLastPointer = { x: curX, y: curY };

      dodgeShip.x = Math.max(dodgeShip.r + 4, Math.min(canvas.width - dodgeShip.r - 4, dodgeShip.x + dx * 1.15));
      dodgeShip.y = Math.max(dodgeShip.r + 4, Math.min(canvas.height - dodgeShip.r - 4, dodgeShip.y + dy * 1.15));
    });

    window.addEventListener("pointerup", () => {
      dodgePointerActive = false;
      galagaDragging = false;
      brickDragging = false;
      racerDragging = false;
      lhPointerDown = false;
      snakeSwipeStart = null;
      if (isInPlayScreen && activeGame === "gogun") {
        handleGogunPressEnd();
      }
      if (isInPlayScreen && activeGame === "suika" && suikaAiming) {
        suikaAiming = false;
        dropSuikaBall();
      }
    });

    window.addEventListener("pointercancel", () => {
      dodgePointerActive = false;
      galagaDragging = false;
      brickDragging = false;
      racerDragging = false;
      lhPointerDown = false;
      snakeSwipeStart = null;
      suikaAiming = false;
      if (isInPlayScreen && activeGame === "gogun") {
        handleGogunPressEnd();
      }
    });

    function gameLoop() {
      if (isInPlayScreen) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (activeGame === "lighthouse") {
          drawLighthouseFrame();
        } else if (activeGame === "racer") {
          drawRacerFrame();
        } else if (activeGame === "enhance") {
          drawEnhanceFrame();
        } else if (activeGame === "snake") {
          drawSnakeFrame();
        } else if (activeGame === "brick") {
          drawBrickFrame();
        } else if (activeGame === "punch") {
          drawPunchFrame();
        } else if (activeGame === "galaga") {
          drawGalagaFrame();
        } else if (activeGame === "smash") {
          drawSmashFrame();
        } else if (activeGame === "suika") {
          drawSuikaFrame();
        } else if (activeGame === "runner") {
          drawRunnerFrame();
        } else if (activeGame === "slash") {
          drawSlashFrame();
        } else if (activeGame === "stack") {
          drawStackFrame();
        } else if (activeGame === "dodge") {
          drawDodgeFrame();
        } else {
          drawGogunFrame();
        }
      }

      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", (e) => {
      if (!isInPlayScreen) return;
      if (document.activeElement === nickInput) {
        if (e.key === "Escape") nickInput.blur();
        return;
      }

      if (activeGame === "lighthouse" && e.code === "Space") {
        e.preventDefault();
        if (!e.repeat) triggerLhFlashBurst();
        return;
      }

      if (activeGame === "enhance") {
        if (e.key === "s" || e.key === "S") {
          e.preventDefault();
          if (!e.repeat) sellEnhanceWeapon();
          return;
        }
        if (e.code === "Space" || e.key === "Enter") {
          e.preventDefault();
          if (!e.repeat) doEnhanceAttempt();
          return;
        }
      }

      if (activeGame === "snake") {
        if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") { e.preventDefault(); queueSnakeDirection(0, -1); return; }
        if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); queueSnakeDirection(0, 1); return; }
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { e.preventDefault(); queueSnakeDirection(-1, 0); return; }
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { e.preventDefault(); queueSnakeDirection(1, 0); return; }
      }

      if (activeGame === "punch") {
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
          e.preventDefault();
          if (!e.repeat) punchDodge("L");
          return;
        }
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
          e.preventDefault();
          if (!e.repeat) punchDodge("R");
          return;
        }
        if (e.code === "Space" || e.key === "ArrowUp" || e.key === "w" || e.key === "W") {
          e.preventDefault();
          if (!e.repeat) punchAttack();
          return;
        }
      }

      if (activeGame === "dodge" || activeGame === "suika" || activeGame === "galaga" || activeGame === "brick" || activeGame === "racer" || activeGame === "lighthouse") {
        if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") { e.preventDefault(); dodgeKeys.up = true; }
        if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); dodgeKeys.down = true; }
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { e.preventDefault(); dodgeKeys.left = true; }
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { e.preventDefault(); dodgeKeys.right = true; }
      }

      if (activeGame === "gogun" && (e.code === "Space" || e.key === "ArrowUp")) {
        e.preventDefault();
        if (!e.repeat) handleGogunPressStart();
        return;
      }

      if (e.code === "Space" || (activeGame !== "dodge" && activeGame !== "suika" && activeGame !== "galaga" && activeGame !== "punch" && activeGame !== "brick" && activeGame !== "snake" && activeGame !== "enhance" && activeGame !== "racer" && activeGame !== "lighthouse" && e.key === "ArrowUp")) {
        e.preventDefault();
        if (activeGame === "smash" && e.repeat) return;
        handleCanvasAction();
      } else if (e.key === "Escape") {
        if (isGameFullscreen) {
          setGameFullscreen(false);
        } else {
          showLobby();
        }
      }
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") dodgeKeys.up = false;
      if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") dodgeKeys.down = false;
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") dodgeKeys.left = false;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") dodgeKeys.right = false;

      if (isInPlayScreen && activeGame === "gogun" && (e.code === "Space" || e.key === "ArrowUp")) {
        handleGogunPressEnd();
      }
    });

    history.replaceState({ view: "lobby" }, "", window.location.pathname);
    updateLobbyBadges();
    gameLoop();
  </script>
</body>
</html>
