<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>낙화 비밀 오락실 | nakhwa-archive</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="낙화 비밀 오락실 | nakhwa-archive" />
  <meta property="og:description" content="메이븐 길드 [낙화] 미니게임 & 실시간 랭킹 보드" />
  <meta property="og:image" content="https://nakhwa-archive.github.io/html/comics/thumbnail.jpg" />
  <meta property="og:url" content="https://nakhwa-archive.github.io/html/games/" />

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a1f;
      --card-hover: #24242b;
      --text-main: #f4f4f6;
      --text-sub: #9898a6;
      --accent: #e65c7b;
      --border: #282830;
      --bar-bg: rgba(18, 18, 22, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      line-height: 1.4;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }

    body.fs-locked {
      overflow: hidden;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      padding-bottom: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bar-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    header h1 {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header h1 span {
      color: var(--accent);
    }

    .nav-btn {
      background: #18181d;
      border: 1px solid var(--border);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .nav-btn:active {
      transform: scale(0.95);
      border-color: var(--accent);
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 12px;
    }

    .lobby-intro {
      margin-bottom: 14px;
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(230, 92, 123, 0.14), rgba(26, 26, 31, 0.9));
      border: 1px solid rgba(230, 92, 123, 0.3);
      border-radius: 14px;
    }

    .lobby-intro h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .lobby-intro p {
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .game-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .game-card:active {
      transform: scale(0.98);
      border-color: var(--accent);
      background: var(--card-hover);
    }

    .game-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: #121216;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      flex-shrink: 0;
    }

    .game-card-body {
      flex: 1;
      min-width: 0;
    }

    .game-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 3px;
    }

    .game-card-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .game-best-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(230, 92, 123, 0.14);
      padding: 2px 7px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .game-card-desc {
      font-size: 0.8rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-arrow {
      color: var(--text-sub);
      font-size: 0.9rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .play-view {
      display: none;
    }

    .play-view.active {
      display: block;
    }

    .lobby-view.hidden {
      display: none;
    }

    .arcade-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .play-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .play-game-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .action-pill-btn {
      background: #24242b;
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-pill-btn.fs-btn {
      background: rgba(230, 92, 123, 0.16);
      border-color: rgba(230, 92, 123, 0.45);
      color: #ff8ca5;
    }

    .action-pill-btn:active {
      transform: scale(0.95);
    }

    .canvas-stage {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #gameCanvas {
      background: #121216;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: block;
      touch-action: none;
      cursor: pointer;
      user-select: none;
      margin: 0 auto;
    }

    .arcade-card.is-fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3000;
      width: 100%;
      height: 100%;
      border-radius: 0;
      border: none;
      background: #0b0b0e;
      padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .arcade-card.is-fullscreen .play-header-bar {
      margin-bottom: 6px;
      padding-bottom: 8px;
      flex-shrink: 0;
    }

    .arcade-card.is-fullscreen .canvas-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arcade-card.is-fullscreen .easter-hint {
      margin-top: 6px;
      flex-shrink: 0;
    }

    .arcade-card.is-fullscreen .score-submit-bar {
      margin-top: 8px;
      flex-shrink: 0;
    }

    .arcade-card.is-fullscreen .ranking-board {
      display: none;
    }

    .easter-hint {
      margin-top: 10px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .score-submit-bar {
      display: none;
      flex-direction: column;
      margin-top: 12px;
      padding: 10px;
      background: #141418;
      border: 1px solid rgba(230, 92, 123, 0.45);
      border-radius: 10px;
      gap: 8px;
    }

    .score-submit-bar.active {
      display: flex;
    }

    .score-submit-bar.new-record {
      border-color: #ffd166;
      background: rgba(255, 209, 102, 0.08);
    }

    .new-record-banner {
      display: none;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffd166;
      text-align: center;
    }

    .score-submit-bar.new-record .new-record-banner {
      display: block;
    }

    .score-input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .nick-input {
      flex: 1;
      min-width: 0;
      height: 38px;
      background: #1e1e24;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }

    .nick-input:focus {
      border-color: var(--accent);
    }

    .submit-score-btn {
      height: 38px;
      padding: 0 14px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .submit-score-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .skip-record-btn {
      display: none;
      height: 38px;
      padding: 0 10px;
      background: #24242c;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .score-submit-bar.new-record .skip-record-btn {
      display: inline-block;
    }

    .ranking-board {
      margin-top: 14px;
      background: #141418;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .ranking-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .ranking-status {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-sub);
    }

    .ranking-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      padding: 6px 8px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.02);
    }

    .ranking-item.top1 {
      background: rgba(230, 92, 123, 0.14);
      color: #ff9eb5;
      font-weight: 700;
    }

    .rank-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .rank-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-score {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }

    .guild-footer {
      margin-top: 20px;
      padding: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }

    .guild-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .guild-title .accent {
      color: var(--accent);
    }

    .guild-sub {
      font-size: 0.84rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <main>

    </footer>

  <!-- 공통 상태 및 레지스트리 코어 -->
  <script>
    const CONFIG = {
      firebaseDbUrl: "https://nakhwa-a90f6-default-rtdb.firebaseio.com"
    };

    const lobbyView = document.getElementById("lobbyView");
    const lobbyCountTitle = document.getElementById("lobbyCountTitle");
    const gameGrid = document.getElementById("gameGrid");
    const playView = document.getElementById("playView");
    const arcadeCard = document.getElementById("arcadeCard");
    const canvasStage = document.getElementById("canvasStage");
    const playGameTitle = document.getElementById("playGameTitle");
    const btnToggleFullscreen = document.getElementById("btnToggleFullscreen");
    const btnBackToLobby = document.getElementById("btnBackToLobby");

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const easterHint = document.getElementById("easterHint");

    const scoreSubmitBar = document.getElementById("scoreSubmitBar");
    const nickInput = document.getElementById("nickInput");
    const btnSubmitScore = document.getElementById("btnSubmitScore");
    const btnSkipRecord = document.getElementById("btnSkipRecord");
    const rankingTitleEl = document.getElementById("rankingTitle");
    const rankingListEl = document.getElementById("rankingList");
    const rankingStatusEl = document.getElementById("rankingStatus");

    nickInput.value = localStorage.getItem("nakhwaRunnerNick") || "";

    let isInPlayScreen = false;
    let isGameFullscreen = false;
    let activeGame = "barricade";
    const GROUND_Y = 170;
    let petals = [];

    let isNewBestPending = false;
    let gameOverLockUntil = 0;

    // 자동 등록 저장소
    window.NAKHWA_GAMES = [];
    const GAME_MAP = {};

    function registerGame(def) {
      if (!def || !def.id) return;
      const entry = Object.assign({
        aspect: "tall",
        sortOrder: "desc",
        unit: "점",
        stop: function () {}
      }, def);
      GAME_MAP[entry.id] = entry;
      window.NAKHWA_GAMES.push(entry);
    }

    function getCurrentGameDef() {
      return GAME_MAP[activeGame] || window.NAKHWA_GAMES[0] || null;
    }

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function hideSubmitBar() {
      scoreSubmitBar.classList.remove("active", "new-record");
      btnSubmitScore.disabled = false;
      btnSubmitScore.textContent = "기록 등록";
      if (isGameFullscreen) requestAnimationFrame(fitCanvasExactAspect);
    }

    function showSubmitBar(isNewRecord = false) {
      scoreSubmitBar.classList.add("active");
      scoreSubmitBar.classList.toggle("new-record", isNewRecord);
      btnSubmitScore.disabled = false;
      btnSubmitScore.textContent = "기록 등록";
      if (isGameFullscreen) requestAnimationFrame(fitCanvasExactAspect);
    }

    function triggerGameOver(isNewBest, hasScore) {
      gameOverLockUntil = performance.now() + 650;
      if (hasScore) {
        isNewBestPending = !!isNewBest;
        showSubmitBar(isNewBestPending);
      } else {
        isNewBestPending = false;
        hideSubmitBar();
      }
      if (isGameFullscreen) {
        requestAnimationFrame(fitCanvasExactAspect);
      }
    }

    function canRestartNow() {
      if (isNewBestPending) return false;
      if (performance.now() < gameOverLockUntil) return false;
      return true;
    }

    function getSafeKey(title) {
      return title.replace(/[.#$\[\]\/]/g, "_");
    }

    function initPetals() {
      petals = Array.from({ length: 14 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * GROUND_Y,
        r: 2 + Math.random() * 2.5,
        vx: -(0.6 + Math.random() * 1.2),
        vy: 0.4 + Math.random() * 0.8
      }));
    }

    function drawPetals(moving) {
      ctx.fillStyle = "rgba(255, 165, 188, 0.45)";
      petals.forEach(p => {
        if (moving) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.y > GROUND_Y) p.y = 0;
        }
        ctx.fillRect(p.x, p.y, p.r, p.r);
      });
    }
  </script>

  <!-- 로비 자동 생성, 랭킹, 입력 & 60fps 메인 루프 -->
  <script>
    const GAME_ASPECT = {
      wide: { w: 480, h: 205 },
      tall: { w: 340, h: 410 }
    };
    let currentAspect = GAME_ASPECT.tall;

    function buildLobbyCards() {
      gameGrid.innerHTML = "";
      lobbyCountTitle.textContent = `🎮 미니게임 선택 (총 ${window.NAKHWA_GAMES.length}종)`;

      window.NAKHWA_GAMES.forEach(g => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "game-card";
        btn.setAttribute("data-game", g.id);

        const badgeVal = typeof g.getBadge === "function" ? g.getBadge() : `BEST 0${g.unit}`;
        btn.innerHTML = `
          <div class="game-icon-box">${g.icon}</div>
          <div class="game-card-body">
            <div class="game-card-top">
              <span class="game-card-title">${g.title}</span>
              <span class="game-best-badge" id="badge-${g.id}">${badgeVal}</span>
            </div>
            <p class="game-card-desc">${g.desc}</p>
          </div>
          <span class="game-arrow">▶</span>
        `;

        btn.addEventListener("click", () => enterGame(g.id, true));
        gameGrid.appendChild(btn);
      });
    }

    function updateLobbyBadges() {
      window.NAKHWA_GAMES.forEach(g => {
        const el = document.getElementById(`badge-${g.id}`);
        if (el && typeof g.getBadge === "function") {
          el.textContent = g.getBadge();
        }
      });
    }

    function fitCanvasExactAspect() {
      if (!isInPlayScreen) return;
      const aspectRatio = currentAspect.w / currentAspect.h;

      if (isGameFullscreen) {
        const stageW = Math.max(120, canvasStage.clientWidth);
        const stageH = Math.max(120, canvasStage.clientHeight);
        let drawW = stageW;
        let drawH = drawW / aspectRatio;

        if (drawH > stageH) {
          drawH = stageH;
          drawW = drawH * aspectRatio;
        }

        canvas.style.width = `${Math.floor(drawW)}px`;
        canvas.style.height = `${Math.floor(drawH)}px`;
      } else {
        const availW = Math.max(120, canvasStage.clientWidth);
        const maxW = currentAspect === GAME_ASPECT.tall ? Math.min(340, availW) : availW;
        const drawW = maxW;
        const drawH = drawW / aspectRatio;

        canvas.style.width = `${Math.floor(drawW)}px`;
        canvas.style.height = `${Math.floor(drawH)}px`;
      }
    }

    function setGameFullscreen(enable) {
      isGameFullscreen = enable;
      arcadeCard.classList.toggle("is-fullscreen", enable);
      document.body.classList.toggle("fs-locked", enable);
      btnToggleFullscreen.textContent = enable ? "✕ 축소" : "⛶ 전체화면";

      requestAnimationFrame(() => {
        fitCanvasExactAspect();
      });
    }

    btnToggleFullscreen.addEventListener("click", () => {
      setGameFullscreen(!isGameFullscreen);
    });

    window.addEventListener("resize", fitCanvasExactAspect);
    window.addEventListener("orientationchange", () => {
      setTimeout(fitCanvasExactAspect, 120);
    });

    function stopAllGames() {
      window.NAKHWA_GAMES.forEach(g => {
        if (typeof g.stop === "function") g.stop();
      });
      dodgePointerActive = false;
      galagaDragging = false;
      brickDragging = false;
      racerDragging = false;
      lhPointerDown = false;
      bcPointerDown = false;
      snakeSwipeStart = null;
      gogunHolding = false;
      gogunHoldFrames = 0;
      gogunHook.active = false;
      suikaAiming = false;
      isNewBestPending = false;
      clearTimeout(slashTimer);
    }

    function setCanvasResolution(isTall) {
      currentAspect = isTall ? GAME_ASPECT.tall : GAME_ASPECT.wide;
      canvas.width = currentAspect.w;
      canvas.height = currentAspect.h;
      fitCanvasExactAspect();
    }

    function renderLobbyDOM() {
      if (isGameFullscreen) setGameFullscreen(false);
      isInPlayScreen = false;
      stopAllGames();
      hideSubmitBar();
      updateLobbyBadges();
      playView.classList.remove("active");
      lobbyView.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showLobby() {
      if (history.state && history.state.view === "play") {
        history.back();
      } else {
        renderLobbyDOM();
      }
    }

    function enterGame(gameId, pushHistory = true) {
      const g = GAME_MAP[gameId];
      if (!g) return;

      activeGame = g.id;
      isInPlayScreen = true;
      stopAllGames();
      hideSubmitBar();

      if (pushHistory) {
        history.pushState({ view: "play", game: g.id }, "", `#${g.id}`);
      }

      lobbyView.classList.add("hidden");
      playView.classList.add("active");

      setCanvasResolution(g.aspect === "tall");
      playGameTitle.textContent = `${g.icon} ${g.title}`;
      easterHint.textContent = g.hint || "";
      rankingTitleEl.textContent = g.rankingTitle || `🏆 ${g.title} TOP 5`;

      if (typeof g.onEnter === "function") g.onEnter();
      if (typeof g.reset === "function") g.reset();

      fetchLeaderboard();
      window.scrollTo({ top: 0, behavior: "smooth" });
      requestAnimationFrame(fitCanvasExactAspect);
    }

    window.addEventListener("popstate", (e) => {
      if (e.state && e.state.view === "play" && e.state.game) {
        enterGame(e.state.game, false);
      } else if (isInPlayScreen) {
        renderLobbyDOM();
      }
    });

    btnBackToLobby.addEventListener("click", showLobby);
    btnSkipRecord.addEventListener("click", () => {
      isNewBestPending = false;
      hideSubmitBar();
    });

    function formatScoreByGame(g, score) {
      if (typeof g.formatScore === "function") return g.formatScore(score);
      if (g.sortOrder === "asc") return `${(score / 1000).toFixed(3)}초`;
      return `${score}${g.unit || "점"}`;
    }

    async function fetchLeaderboard() {
      const g = getCurrentGameDef();
      if (!g || !g.dbNode) return;
      rankingStatusEl.textContent = "불러오는 중...";

      try {
        const res = await fetch(`${CONFIG.firebaseDbUrl}/${g.dbNode}.json`);
        if (!res.ok) throw new Error("랭킹 로드 실패");
        const data = (await res.json()) || {};

        const validEntries = Object.values(data).filter(
          item => item && typeof item.score === "number" && item.score > 0 && item.name
        );

        const sorted = validEntries
          .sort((a, b) => g.sortOrder === "asc" ? (a.score - b.score) : (b.score - a.score))
          .slice(0, 5);

        rankingListEl.innerHTML = "";
        if (sorted.length === 0) {
          rankingStatusEl.textContent = "첫 기록의 주인공이 되어보세요!";
          return;
        }

        rankingStatusEl.textContent = "실시간 TOP 5";
        const medals = ["🥇", "🥈", "🥉", "4위", "5위"];

        sorted.forEach((entry, idx) => {
          const li = document.createElement("li");
          li.className = `ranking-item ${idx === 0 ? "top1" : ""}`;

          const left = document.createElement("div");
          left.className = "rank-left";
          left.innerHTML = `<span>${medals[idx]}</span>`;

          const nameSpan = document.createElement("span");
          nameSpan.className = "rank-name";
          nameSpan.textContent = entry.name;
          left.appendChild(nameSpan);

          const scoreSpan = document.createElement("span");
          scoreSpan.className = "rank-score";
          scoreSpan.textContent = formatScoreByGame(g, entry.score);

          li.appendChild(left);
          li.appendChild(scoreSpan);
          rankingListEl.appendChild(li);
        });
      } catch (err) {
        rankingStatusEl.textContent = "랭킹 불러오기 실패";
        console.warn(err);
      }
    }

    async function submitScore() {
      const g = getCurrentGameDef();
      if (!g || !g.dbNode || typeof g.getScore !== "function") return;

      const rawName = nickInput.value.trim();
      if (!rawName) {
        nickInput.focus();
        return;
      }

      const currentRecord = Number(g.getScore() || 0);
      if (currentRecord <= 0) return;

      localStorage.setItem("nakhwaRunnerNick", rawName);
      btnSubmitScore.disabled = true;
      btnSubmitScore.textContent = "저장 중...";

      try {
        const safeKey = getSafeKey(rawName);
        const encodedKey = encodeURIComponent(safeKey);
        const url = `${CONFIG.firebaseDbUrl}/${g.dbNode}/${encodedKey}.json`;

        const existingRes = await fetch(url);
        const existingData = await existingRes.json();
        const prevScore = existingData && typeof existingData.score === "number" ? existingData.score : 0;

        const isNewRecord = g.sortOrder === "asc"
          ? (prevScore === 0 || currentRecord < prevScore)
          : (currentRecord > prevScore);

        if (isNewRecord) {
          await fetch(url, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: rawName,
              score: currentRecord,
              updatedAt: Date.now()
            })
          });
          btnSubmitScore.textContent = "갱신 완료!";
        } else {
          btnSubmitScore.textContent = `기존 최고 ${formatScoreByGame(g, prevScore)}`;
        }

        isNewBestPending = false;
        scoreSubmitBar.classList.remove("new-record");
        if (isGameFullscreen) requestAnimationFrame(fitCanvasExactAspect);
        await fetchLeaderboard();
      } catch (err) {
        btnSubmitScore.disabled = false;
        btnSubmitScore.textContent = "다시 시도";
        console.warn("점수 저장 실패:", err);
      }
    }

    btnSubmitScore.addEventListener("click", submitScore);
    nickInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        submitScore();
      }
    });

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (!isInPlayScreen) return;
      const g = getCurrentGameDef();
      const pt = getCanvasCoords(e);
      if (g && typeof g.onPointerDown === "function") {
        g.onPointerDown(pt.x, pt.y, e);
      }
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!isInPlayScreen) return;
      const g = getCurrentGameDef();
      const pt = getCanvasCoords(e);
      if (g && typeof g.onPointerMove === "function") {
        g.onPointerMove(pt.x, pt.y, e);
      }
    });

    function releasePointers(e) {
      dodgePointerActive = false;
      galagaDragging = false;
      brickDragging = false;
      racerDragging = false;
      lhPointerDown = false;
      bcPointerDown = false;
      snakeSwipeStart = null;
      if (!isInPlayScreen) return;
      const g = getCurrentGameDef();
      if (g && typeof g.onPointerUp === "function") {
        g.onPointerUp(e);
      }
    }

    window.addEventListener("pointerup", releasePointers);
    window.addEventListener("pointercancel", releasePointers);

    const TARGET_FPS = 60;
    const STEP_MS = 1000 / TARGET_FPS;
    let lastFrameTime = performance.now();
    let frameAccumMs = 0;

    function renderActiveGameFrame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const g = getCurrentGameDef();
      if (g && typeof g.draw === "function") {
        g.draw();
      }
    }

    function gameLoop(now = performance.now()) {
      const rawDelta = Math.max(0, Math.min(100, now - lastFrameTime));
      lastFrameTime = now;

      if (isInPlayScreen) {
        frameAccumMs += rawDelta;
        let steps = 0;
        const maxStepsPerTick = 3;

        while (frameAccumMs >= STEP_MS && steps < maxStepsPerTick) {
          renderActiveGameFrame();
          frameAccumMs -= STEP_MS;
          steps++;
        }

        if (frameAccumMs > STEP_MS * 2) {
          frameAccumMs = 0;
        }
      } else {
        frameAccumMs = 0;
      }

      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", (e) => {
      if (!isInPlayScreen) return;
      if (document.activeElement === nickInput) {
        if (e.key === "Escape") nickInput.blur();
        return;
      }

      if (e.key === "Escape") {
        if (isGameFullscreen) setGameFullscreen(false);
        else showLobby();
        return;
      }

      const g = getCurrentGameDef();
      if (g && typeof g.onKeyDown === "function") {
        g.onKeyDown(e);
      }
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") dodgeKeys.up = false;
      if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") dodgeKeys.down = false;
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") dodgeKeys.left = false;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") dodgeKeys.right = false;

      if (!isInPlayScreen) return;
      const g = getCurrentGameDef();
      if (g && typeof g.onKeyUp === "function") {
        g.onKeyUp(e);
      }
    });

    buildLobbyCards();
    history.replaceState({ view: "lobby" }, "", window.location.pathname);
    updateLobbyBadges();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
