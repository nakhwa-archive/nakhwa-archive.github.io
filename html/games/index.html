<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>낙화 비밀 오락실 | nakhwa-archive</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="낙화 비밀 오락실 | nakhwa-archive" />
  <meta property="og:description" content="메이븐 길드 [낙화] 미니게임 & 실시간 랭킹 보드" />
  <meta property="og:image" content="https://nakhwa-archive.github.io/html/comics/thumbnail.jpg" />
  <meta property="og:url" content="https://nakhwa-archive.github.io/html/games/" />

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a1f;
      --card-hover: #24242b;
      --text-main: #f4f4f6;
      --text-sub: #9898a6;
      --accent: #e65c7b;
      --border: #282830;
      --bar-bg: rgba(18, 18, 22, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      line-height: 1.4;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bar-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header h1 span {
      color: var(--accent);
    }

    .back-btn {
      background: #18181d;
      border: 1px solid var(--border);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 8px;
      transition: all 0.15s ease;
    }

    .back-btn:active {
      transform: scale(0.95);
      border-color: var(--accent);
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 12px;
    }

    .arcade-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    /* 미니게임 5종 선택 탭 */
    .game-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin-bottom: 12px;
      background: #121216;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .game-tab-btn {
      height: 36px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      padding: 0 2px;
      letter-spacing: -0.02em;
    }

    .game-tab-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    #gameCanvas {
      width: 100%;
      height: 220px;
      background: #121216;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: block;
      touch-action: none;
      cursor: pointer;
      user-select: none;
    }

    .easter-hint {
      margin-top: 10px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    /* 점수 등록 바 */
    .score-submit-bar {
      display: none;
      margin-top: 12px;
      padding: 10px;
      background: #141418;
      border: 1px solid rgba(230, 92, 123, 0.45);
      border-radius: 10px;
      gap: 6px;
      align-items: center;
    }

    .score-submit-bar.active {
      display: flex;
    }

    .nick-input {
      flex: 1;
      min-width: 0;
      height: 38px;
      background: #1e1e24;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
    }

    .nick-input:focus {
      border-color: var(--accent);
    }

    .submit-score-btn {
      height: 38px;
      padding: 0 16px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .submit-score-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 실시간 랭킹 보드 */
    .ranking-board {
      margin-top: 14px;
      background: #141418;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .ranking-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .ranking-status {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-sub);
    }

    .ranking-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      padding: 6px 8px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.02);
    }

    .ranking-item.top1 {
      background: rgba(230, 92, 123, 0.14);
      color: #ff9eb5;
      font-weight: 700;
    }

    .rank-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .rank-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-score {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }

    .guild-footer {
      margin-top: 20px;
      padding: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }

    .guild-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .guild-title .accent {
      color: var(--accent);
    }

    .guild-sub {
      font-size: 0.84rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>🌸 <span>낙화</span> 비밀 오락실</h1>
    </div>
    <a href="../comics/" class="back-btn">← 4컷 만화</a>
  </header>

  <main>
    <section class="arcade-card">
      <div class="game-tabs">
        <button type="button" class="game-tab-btn active" id="tabRunner">🌸 러너</button>
        <button type="button" class="game-tab-btn" id="tabSlash">⚔️ 발도술</button>
        <button type="button" class="game-tab-btn" id="tabStack">🍡 경단</button>
        <button type="button" class="game-tab-btn" id="tabDodge">💥 닷지</button>
        <button type="button" class="game-tab-btn" id="tabGogun">🪝 고군분투</button>
      </div>

      <canvas id="gameCanvas" width="480" height="205"></canvas>
      <p class="easter-hint" id="easterHint">화면 터치 또는 스페이스바(↑)로 점프!</p>

      <!-- 기록 등록 바 -->
      <div class="score-submit-bar" id="scoreSubmitBar">
        <input type="text" id="nickInput" class="nick-input" maxlength="10" placeholder="길드원 닉네임 (최대 10자)" />
        <button type="button" id="btnSubmitScore" class="submit-score-btn">기록 등록</button>
      </div>

      <!-- 실시간 TOP 5 랭킹 -->
      <div class="ranking-board">
        <div class="ranking-header">
          <span id="rankingTitle">🏆 낙화 러너 TOP 5</span>
          <span class="ranking-status" id="rankingStatus">불러오는 중...</span>
        </div>
        <ul class="ranking-list" id="rankingList"></ul>
      </div>
    </section>

    <footer class="guild-footer">
      <p class="guild-title">⚔️ 메이븐 길드 <span class="accent">[낙화]</span></p>
      <p class="guild-sub">길드장 김정환 · 가입 문의 환영 🌸</p>
    </footer>
  </main>

  <script>
    const CONFIG = {
      firebaseDbUrl: "https://nakhwa-a90f6-default-rtdb.firebaseio.com"
    };

    const tabRunner = document.getElementById("tabRunner");
    const tabSlash = document.getElementById("tabSlash");
    const tabStack = document.getElementById("tabStack");
    const tabDodge = document.getElementById("tabDodge");
    const tabGogun = document.getElementById("tabGogun");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const easterHint = document.getElementById("easterHint");

    const scoreSubmitBar = document.getElementById("scoreSubmitBar");
    const nickInput = document.getElementById("nickInput");
    const btnSubmitScore = document.getElementById("btnSubmitScore");
    const rankingTitleEl = document.getElementById("rankingTitle");
    const rankingListEl = document.getElementById("rankingList");
    const rankingStatusEl = document.getElementById("rankingStatus");

    nickInput.value = localStorage.getItem("nakhwaRunnerNick") || "";

    let activeGame = "runner"; // "runner" | "slash" | "stack" | "dodge" | "gogun"
    const GROUND_Y = 170;
    let petals = [];

    function getSafeKey(title) {
      return title.replace(/[.#$\[\]\/]/g, "_");
    }

    function initPetals() {
      petals = Array.from({ length: 14 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * GROUND_Y,
        r: 2 + Math.random() * 2.5,
        vx: -(0.6 + Math.random() * 1.2),
        vy: 0.4 + Math.random() * 0.8
      }));
    }

    function drawPetals(moving) {
      ctx.fillStyle = "rgba(255, 165, 188, 0.45)";
      petals.forEach(p => {
        if (moving) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.y > GROUND_Y) p.y = 0;
        }
        ctx.fillRect(p.x, p.y, p.r, p.r);
      });
    }

    /* ---------- 1. 낙화 러너 상태 ---------- */
    let runnerRunning = false;
    let runnerOver = false;
    let runnerScore = 0;
    let runnerLastScore = 0;
    let runnerBest = Number(localStorage.getItem("nakhwaRunnerBest") || 0);
    let runnerSpeed = 4.5;
    let runnerFrame = 0;

    const player = {
      x: 48,
      y: GROUND_Y - 28,
      w: 24,
      h: 28,
      vy: 0,
      gravity: 0.62,
      jumpPower: -10.8,
      grounded: true
    };
    let obstacles = [];

    function resetRunner() {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.grounded = true;
      obstacles = [];
      runnerScore = 0;
      runnerSpeed = 4.5;
      runnerFrame = 0;
      runnerOver = false;
      runnerRunning = true;
      hideSubmitBar();
      initPetals();
    }

    /* ---------- 2. 낙화 발도술 상태 ---------- */
    let slashState = "idle"; // "idle" | "waiting" | "signal" | "result" | "foul"
    let slashSignalTime = 0;
    let slashTimer = null;
    let slashReactionMs = 0;
    let slashBestMs = Number(localStorage.getItem("nakhwaSlashBest") || 0);
    let slashFlashAlpha = 0;

    function resetSlashToIdle() {
      clearTimeout(slashTimer);
      slashState = "idle";
      slashFlashAlpha = 0;
      hideSubmitBar();
    }

    function startSlashRound() {
      clearTimeout(slashTimer);
      slashState = "waiting";
      slashFlashAlpha = 0;
      hideSubmitBar();

      const delay = 1500 + Math.random() * 2900;
      slashTimer = setTimeout(() => {
        if (activeGame !== "slash") return;
        slashState = "signal";
        slashSignalTime = performance.now();
        slashFlashAlpha = 1;
      }, delay);
    }

    function handleSlashAction() {
      if (slashState === "idle" || slashState === "result" || slashState === "foul") {
        startSlashRound();
      } else if (slashState === "waiting") {
        clearTimeout(slashTimer);
        slashState = "foul";
        hideSubmitBar();
      } else if (slashState === "signal") {
        const diff = Math.round(performance.now() - slashSignalTime);
        slashReactionMs = Math.max(1, diff);
        slashState = "result";
        slashFlashAlpha = 1;

        if (slashBestMs === 0 || slashReactionMs < slashBestMs) {
          slashBestMs = slashReactionMs;
          localStorage.setItem("nakhwaSlashBest", String(slashBestMs));
        }
        showSubmitBar();
      }
    }

    /* ---------- 3. 경단 쌓기 (Stack) 상태 ---------- */
    const DANGO_COLORS = [
      { fill: "#ffb7c5", stroke: "#ff8ca5" },
      { fill: "#f4f4f6", stroke: "#d0d0dc" },
      { fill: "#a8d5ba", stroke: "#7bb894" }
    ];
    const STACK_BLOCK_H = 18;
    const STACK_BASE_Y = 184;

    let stackLayers = [];
    let stackMoving = null;
    let stackSliced = [];
    let stackRunning = false;
    let stackOver = false;
    let stackFloors = 0;
    let stackBest = Number(localStorage.getItem("nakhwaStackBest") || 0);
    let stackCameraY = 0;
    let stackPerfectTimer = 0;
    let stackCombo = 0;

    function resetStack() {
      const startW = 140;
      const startX = (canvas.width - startW) / 2;
      stackLayers = [{ x: startX, w: startW, colorIdx: 0 }];
      stackSliced = [];
      stackFloors = 0;
      stackCameraY = 0;
      stackPerfectTimer = 0;
      stackCombo = 0;
      stackOver = false;
      stackRunning = true;
      hideSubmitBar();
      initPetals();
      spawnNextDango();
    }

    function spawnNextDango() {
      const prev = stackLayers[stackLayers.length - 1];
      const dir = stackLayers.length % 2 === 1 ? 1 : -1;
      const speed = Math.min(7.2, 2.7 + stackFloors * 0.14);
      stackMoving = {
        x: dir === 1 ? 30 : canvas.width - prev.w - 30,
        w: prev.w,
        dir,
        speed,
        colorIdx: stackLayers.length % DANGO_COLORS.length
      };
    }

    function handleStackAction() {
      if (stackOver || !stackRunning) {
        resetStack();
        return;
      }
      if (!stackMoving) return;

      const prev = stackLayers[stackLayers.length - 1];
      const curr = stackMoving;
      const diff = curr.x - prev.x;

      if (Math.abs(diff) <= 4) {
        stackCombo++;
        const bonusW = stackCombo >= 2 ? Math.min(150, prev.w + 6) : prev.w;
        const alignedX = prev.x - (bonusW - prev.w) / 2;
        stackLayers.push({ x: alignedX, w: bonusW, colorIdx: curr.colorIdx });
        stackFloors++;
        stackPerfectTimer = 28;
        spawnNextDango();
        return;
      }

      stackCombo = 0;
      const overlapLeft = Math.max(prev.x, curr.x);
      const overlapRight = Math.min(prev.x + prev.w, curr.x + curr.w);
      const overlapW = overlapRight - overlapLeft;

      if (overlapW <= 2) {
        stackSliced.push({
          x: curr.x,
          y: STACK_BASE_Y - stackLayers.length * STACK_BLOCK_H + stackCameraY,
          w: curr.w,
          vy: 0,
          colorIdx: curr.colorIdx
        });
        stackMoving = null;
        stackOver = true;
        if (stackFloors > stackBest) {
          stackBest = stackFloors;
          localStorage.setItem("nakhwaStackBest", String(stackBest));
        }
        if (stackFloors > 0) showSubmitBar();
        return;
      }

      const sliceW = curr.w - overlapW;
      const sliceX = diff < 0 ? curr.x : overlapRight;
      stackSliced.push({
        x: sliceX,
        y: STACK_BASE_Y - stackLayers.length * STACK_BLOCK_H + stackCameraY,
        w: sliceW,
        vy: 0,
        colorIdx: curr.colorIdx
      });

      stackLayers.push({ x: overlapLeft, w: overlapW, colorIdx: curr.colorIdx });
      stackFloors++;
      spawnNextDango();
    }

    /* ---------- 4. 낙화 닷지 (Dodge) 상태 ---------- */
    let dodgeRunning = false;
    let dodgeOver = false;
    let dodgeStartTime = 0;
    let dodgeElapsedMs = 0;
    let dodgeBestMs = Number(localStorage.getItem("nakhwaDodgeBest") || 0);
    let dodgeBullets = [];
    let dodgeSpawnTimer = 0;

    const dodgeShip = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      r: 5,
      speed: 3.4
    };

    const dodgeKeys = { up: false, down: false, left: false, right: false };
    let dodgePointerActive = false;
    let dodgeLastPointer = { x: 0, y: 0 };

    function spawnDodgeBullet() {
      const side = Math.floor(Math.random() * 4);
      let x = 0, y = 0;
      if (side === 0) { x = Math.random() * canvas.width; y = -6; }
      else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 6; }
      else if (side === 2) { x = -6; y = Math.random() * canvas.height; }
      else { x = canvas.width + 6; y = Math.random() * canvas.height; }

      let targetX = dodgeShip.x + (Math.random() - 0.5) * 90;
      let targetY = dodgeShip.y + (Math.random() - 0.5) * 90;
      if (Math.random() < 0.3) {
        targetX = Math.random() * canvas.width;
        targetY = Math.random() * canvas.height;
      }

      const angle = Math.atan2(targetY - y, targetX - x);
      const sec = dodgeElapsedMs / 1000;
      const speed = 1.6 + Math.random() * 1.4 + Math.min(2.2, sec * 0.06);

      dodgeBullets.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: 3.2,
        isPink: Math.random() < 0.35
      });
    }

    function resetDodge() {
      dodgeShip.x = canvas.width / 2;
      dodgeShip.y = canvas.height / 2;
      dodgeBullets = [];
      dodgeSpawnTimer = 0;
      dodgeElapsedMs = 0;
      dodgeStartTime = performance.now();
      dodgeOver = false;
      dodgeRunning = true;
      dodgePointerActive = false;
      hideSubmitBar();

      for (let i = 0; i < 14; i++) {
        spawnDodgeBullet();
      }
    }

    /* ---------- 5. 낙화 고군분투 (와이어 액션) 상태 ---------- */
    let gogunRunning = false;
    let gogunOver = false;
    let gogunScore = 0;
    let gogunLastScore = 0;
    let gogunBest = Number(localStorage.getItem("nakhwaGogunBest") || 0);
    let gogunHolding = false;
    let gogunSpeed = 4.2;
    let gogunFrame = 0;

    const gogunPlayer = {
      x: 82,
      y: 120,
      w: 20,
      h: 22,
      vy: 0,
      grounded: false
    };

    const gogunHook = {
      active: false,
      anchorX: 0,
      anchorY: 0,
      length: 0,
      angle: 0,
      angVel: 0
    };

    let gogunRoofs = [];
    let gogunCoins = [];

    function spawnGogunSection(startX) {
      const gap = 85 + Math.random() * 95;
      const roofX = startX + gap;
      const roofW = 110 + Math.random() * 120;
      const roofY = 148 + (Math.random() - 0.5) * 32;
      gogunRoofs.push({ x: roofX, y: roofY, w: roofW });

      const midGapX = startX + gap * 0.5;
      const arcY = 58 + Math.random() * 34;
      gogunCoins.push({ x: midGapX - 18, y: arcY + 12, type: "coin", collected: false });
      gogunCoins.push({ x: midGapX, y: arcY, type: "gem", collected: false });
      gogunCoins.push({ x: midGapX + 18, y: arcY + 12, type: "coin", collected: false });

      gogunCoins.push({ x: roofX + roofW * 0.35, y: roofY - 18, type: "coin", collected: false });
      gogunCoins.push({ x: roofX + roofW * 0.65, y: roofY - 18, type: "coin", collected: false });
    }

    function resetGogun() {
      gogunPlayer.x = 82;
      gogunPlayer.y = 126;
      gogunPlayer.vy = 0;
      gogunPlayer.grounded = true;
      gogunHook.active = false;
      gogunHolding = false;
      gogunScore = 0;
      gogunSpeed = 4.2;
      gogunFrame = 0;
      gogunOver = false;
      gogunRunning = true;
      hideSubmitBar();
      initPetals();

      gogunRoofs = [{ x: 0, y: 152, w: 300 }];
      gogunCoins = [
        { x: 180, y: 134, type: "coin", collected: false },
        { x: 220, y: 134, type: "coin", collected: false }
      ];
      spawnGogunSection(300);
      spawnGogunSection(580);
    }

    function attachGogunHook() {
      if (gogunHook.active) return;
      gogunHook.active = true;
      gogunHook.anchorX = gogunPlayer.x + 88;
      gogunHook.anchorY = 12;
      const dx = gogunPlayer.x - gogunHook.anchorX;
      const dy = gogunPlayer.y - gogunHook.anchorY;
      gogunHook.length = Math.max(55, Math.min(145, Math.hypot(dx, dy)));
      gogunHook.angle = Math.atan2(dx, dy);
      gogunHook.angVel = 0.045;
    }

    function releaseGogunHook() {
      if (!gogunHook.active) return;
      gogunHook.active = false;
      gogunPlayer.vy = Math.min(-4.2, -Math.sin(gogunHook.angle) * 7.5 - 3.5);
    }

    function handleGogunPressStart() {
      if (activeGame !== "gogun" || document.activeElement === nickInput) return;

      if (gogunOver || !gogunRunning) {
        resetGogun();
        return;
      }

      gogunHolding = true;
      if (gogunPlayer.grounded) {
        gogunPlayer.vy = -8.6;
        gogunPlayer.grounded = false;
      } else {
        attachGogunHook();
      }
    }

    function handleGogunPressEnd() {
      gogunHolding = false;
      if (gogunHook.active) {
        releaseGogunHook();
      }
    }

    /* ---------- 공통 UI & 탭 전환 ---------- */
    function hideSubmitBar() {
      scoreSubmitBar.classList.remove("active");
      btnSubmitScore.disabled = false;
      btnSubmitScore.textContent = "기록 등록";
    }

    function showSubmitBar() {
      scoreSubmitBar.classList.add("active");
      btnSubmitScore.disabled = false;
      btnSubmitScore.textContent = "기록 등록";
    }

    function switchGameTab(game) {
      activeGame = game;
      clearTimeout(slashTimer);
      dodgePointerActive = false;
      gogunHolding = false;
      gogunHook.active = false;
      hideSubmitBar();

      tabRunner.classList.toggle("active", game === "runner");
      tabSlash.classList.toggle("active", game === "slash");
      tabStack.classList.toggle("active", game === "stack");
      tabDodge.classList.toggle("active", game === "dodge");
      tabGogun.classList.toggle("active", game === "gogun");

      if (game === "runner") {
        easterHint.textContent = "화면 터치 또는 스페이스바(↑)로 점프!";
        rankingTitleEl.textContent = "🏆 낙화 러너 TOP 5";
        resetRunner();
      } else if (game === "slash") {
        easterHint.textContent = "'⚔️ 베기!!' 신호가 뜨는 순간 가장 빠르게 터치!";
        rankingTitleEl.textContent = "⚡ 낙화 발도술 TOP 5 (빠른 순)";
        initPetals();
        resetSlashToIdle();
      } else if (game === "stack") {
        easterHint.textContent = "타이밍 맞춰 터치! 중앙에 맞추면 PERFECT 🌸";
        rankingTitleEl.textContent = "🍡 경단 쌓기 TOP 5";
        resetStack();
      } else if (game === "dodge") {
        easterHint.textContent = "드래그(모바일) 또는 방향키/WASD(PC)로 탄막 회피!";
        rankingTitleEl.textContent = "💥 낙화 닷지 TOP 5 (생존 시간)";
        resetDodge();
      } else {
        easterHint.textContent = "짧게 탭=점프 / 공중에서 꾹 누르기=와이어 스윙 🪝";
        rankingTitleEl.textContent = "🪝 낙화 고군분투 TOP 5";
        resetGogun();
      }

      fetchLeaderboard();
    }

    tabRunner.addEventListener("click", () => switchGameTab("runner"));
    tabSlash.addEventListener("click", () => switchGameTab("slash"));
    tabStack.addEventListener("click", () => switchGameTab("stack"));
    tabDodge.addEventListener("click", () => switchGameTab("dodge"));
    tabGogun.addEventListener("click", () => switchGameTab("gogun"));

    function handleCanvasAction() {
      if (document.activeElement === nickInput) return;

      if (activeGame === "runner") {
        if (runnerOver || !runnerRunning) {
          resetRunner();
          return;
        }
        if (player.grounded) {
          player.vy = player.jumpPower;
          player.grounded = false;
        }
      } else if (activeGame === "slash") {
        handleSlashAction();
      } else if (activeGame === "stack") {
        handleStackAction();
      } else if (activeGame === "dodge") {
        if (dodgeOver || !dodgeRunning) {
          resetDodge();
        }
      }
    }

    /* ---------- Firebase 랭킹 연동 ---------- */
    function getDbNode() {
      if (activeGame === "runner") return "runner_scores";
      if (activeGame === "slash") return "slash_scores";
      if (activeGame === "stack") return "stack_scores";
      if (activeGame === "dodge") return "dodge_scores";
      return "gogun_scores";
    }

    async function fetchLeaderboard() {
      rankingStatusEl.textContent = "불러오는 중...";
      const dbNode = getDbNode();

      try {
        const res = await fetch(`${CONFIG.firebaseDbUrl}/${dbNode}.json`);
        if (!res.ok) throw new Error("랭킹 로드 실패");
        const data = (await res.json()) || {};

        const validEntries = Object.values(data).filter(
          item => item && typeof item.score === "number" && item.score > 0 && item.name
        );

        const sorted = validEntries
          .sort((a, b) => activeGame === "slash" ? (a.score - b.score) : (b.score - a.score))
          .slice(0, 5);

        rankingListEl.innerHTML = "";
        if (sorted.length === 0) {
          rankingStatusEl.textContent = "첫 기록의 주인공이 되어보세요!";
          return;
        }

        rankingStatusEl.textContent = "실시간 TOP 5";
        const medals = ["🥇", "🥈", "🥉", "4위", "5위"];

        sorted.forEach((entry, idx) => {
          const li = document.createElement("li");
          li.className = `ranking-item ${idx === 0 ? "top1" : ""}`;

          const left = document.createElement("div");
          left.className = "rank-left";
          left.innerHTML = `<span>${medals[idx]}</span>`;

          const nameSpan = document.createElement("span");
          nameSpan.className = "rank-name";
          nameSpan.textContent = entry.name;
          left.appendChild(nameSpan);

          const scoreSpan = document.createElement("span");
          scoreSpan.className = "rank-score";
          if (activeGame === "runner" || activeGame === "gogun") {
            scoreSpan.textContent = `${entry.score}점`;
          } else if (activeGame === "slash") {
            scoreSpan.textContent = `${(entry.score / 1000).toFixed(3)}초`;
          } else if (activeGame === "stack") {
            scoreSpan.textContent = `${entry.score}층`;
          } else {
            scoreSpan.textContent = `${(entry.score / 1000).toFixed(2)}초`;
          }

          li.appendChild(left);
          li.appendChild(scoreSpan);
          rankingListEl.appendChild(li);
        });
      } catch (err) {
        rankingStatusEl.textContent = "랭킹 불러오기 실패";
        console.warn(err);
      }
    }

    async function submitScore() {
      const rawName = nickInput.value.trim();
      if (!rawName) {
        nickInput.focus();
        return;
      }

      let currentRecord = 0;
      if (activeGame === "runner") currentRecord = runnerLastScore;
      else if (activeGame === "slash") currentRecord = slashReactionMs;
      else if (activeGame === "stack") currentRecord = stackFloors;
      else if (activeGame === "dodge") currentRecord = dodgeElapsedMs;
      else currentRecord = gogunLastScore;

      if (currentRecord <= 0) return;

      localStorage.setItem("nakhwaRunnerNick", rawName);
      btnSubmitScore.disabled = true;
      btnSubmitScore.textContent = "저장 중...";

      const dbNode = getDbNode();

      try {
        const safeKey = getSafeKey(rawName);
        const encodedKey = encodeURIComponent(safeKey);
        const url = `${CONFIG.firebaseDbUrl}/${dbNode}/${encodedKey}.json`;

        const existingRes = await fetch(url);
        const existingData = await existingRes.json();
        const prevScore = existingData && typeof existingData.score === "number" ? existingData.score : 0;

        const isNewRecord = activeGame === "slash"
          ? (prevScore === 0 || currentRecord < prevScore)
          : (currentRecord > prevScore);

        if (isNewRecord) {
          await fetch(url, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: rawName,
              score: currentRecord,
              updatedAt: Date.now()
            })
          });
          btnSubmitScore.textContent = "갱신 완료!";
        } else {
          let prevLabel = `${prevScore}점`;
          if (activeGame === "slash") prevLabel = `${(prevScore / 1000).toFixed(3)}초`;
          else if (activeGame === "stack") prevLabel = `${prevScore}층`;
          else if (activeGame === "dodge") prevLabel = `${(prevScore / 1000).toFixed(2)}초`;
          btnSubmitScore.textContent = `기존 최고 ${prevLabel}`;
        }

        await fetchLeaderboard();
      } catch (err) {
        btnSubmitScore.disabled = false;
        btnSubmitScore.textContent = "다시 시도";
        console.warn("점수 저장 실패:", err);
      }
    }

    btnSubmitScore.addEventListener("click", submitScore);
    nickInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        submitScore();
      }
    });

    /* ---------- 캔버스 포인터 이벤트 ---------- */
    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (activeGame === "dodge" && dodgeRunning && !dodgeOver) {
        dodgePointerActive = true;
        const rect = canvas.getBoundingClientRect();
        dodgeLastPointer = {
          x: (e.clientX - rect.left) * (canvas.width / rect.width),
          y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
        return;
      }
      if (activeGame === "gogun") {
        handleGogunPressStart();
        return;
      }
      handleCanvasAction();
    });

    canvas.addEventListener("pointermove", (e) => {
      if (activeGame !== "dodge" || !dodgePointerActive || dodgeOver) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const curX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const curY = (e.clientY - rect.top) * (canvas.height / rect.height);

      const dx = curX - dodgeLastPointer.x;
      const dy = curY - dodgeLastPointer.y;
      dodgeLastPointer = { x: curX, y: curY };

      dodgeShip.x = Math.max(dodgeShip.r + 4, Math.min(canvas.width - dodgeShip.r - 4, dodgeShip.x + dx * 1.15));
      dodgeShip.y = Math.max(dodgeShip.r + 4, Math.min(canvas.height - dodgeShip.r - 4, dodgeShip.y + dy * 1.15));
    });

    window.addEventListener("pointerup", () => {
      dodgePointerActive = false;
      if (activeGame === "gogun") {
        handleGogunPressEnd();
      }
    });

    window.addEventListener("pointercancel", () => {
      dodgePointerActive = false;
      if (activeGame === "gogun") {
        handleGogunPressEnd();
      }
    });

    /* ---------- 1. 러너 렌더링 ---------- */
    function drawRunnerFrame() {
      drawPetals(runnerRunning && !runnerOver);

      ctx.strokeStyle = "#343440";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      if (runnerRunning && !runnerOver) {
        runnerFrame++;
        runnerScore += 0.15;
        runnerSpeed = Math.min(9.5, 4.5 + runnerScore * 0.004);

        player.vy += player.gravity;
        player.y += player.vy;
        if (player.y >= GROUND_Y - player.h) {
          player.y = GROUND_Y - player.h;
          player.vy = 0;
          player.grounded = true;
        }

        const lastObs = obstacles[obstacles.length - 1];
        const minGap = 190 + Math.random() * 140;
        if (!lastObs || canvas.width - lastObs.x > minGap) {
          if (Math.random() < 0.04) {
            const isDouble = runnerScore > 80 && Math.random() < 0.35;
            const w = isDouble ? 30 : 18;
            const h = 22 + Math.floor(Math.random() * 10);
            obstacles.push({
              x: canvas.width + 10,
              y: GROUND_Y - h,
              w,
              h,
              type: isDouble ? "double" : "single"
            });
          }
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= runnerSpeed;

          const pad = 5;
          if (
            player.x + pad < obs.x + obs.w - pad &&
            player.x + player.w - pad > obs.x + pad &&
            player.y + pad < obs.y + obs.h &&
            player.y + player.h - 2 > obs.y + pad
          ) {
            runnerOver = true;
            runnerLastScore = Math.floor(runnerScore);
            if (runnerLastScore > runnerBest) {
              runnerBest = runnerLastScore;
              localStorage.setItem("nakhwaRunnerBest", String(runnerBest));
            }
            if (runnerLastScore > 0) showSubmitBar();
          }

          if (obs.x + obs.w < 0) obstacles.splice(i, 1);
        }
      }

      obstacles.forEach(obs => {
        ctx.fillStyle = "#e65c7b";
        ctx.beginPath();
        if (obs.type === "double") {
          ctx.moveTo(obs.x, GROUND_Y);
          ctx.lineTo(obs.x + obs.w * 0.25, obs.y);
          ctx.lineTo(obs.x + obs.w * 0.5, GROUND_Y);
          ctx.lineTo(obs.x + obs.w * 0.75, obs.y + 4);
          ctx.lineTo(obs.x + obs.w, GROUND_Y);
        } else {
          ctx.moveTo(obs.x, GROUND_Y);
          ctx.lineTo(obs.x + obs.w / 2, obs.y);
          ctx.lineTo(obs.x + obs.w, GROUND_Y);
        }
        ctx.closePath();
        ctx.fill();
      });

      const px = Math.round(player.x);
      const py = Math.round(player.y);
      ctx.fillStyle = "#ff9eb5";
      ctx.fillRect(px + 2, py + 4, 20, 20);
      ctx.fillRect(px + 4, py + 2, 16, 22);
      ctx.fillStyle = "#e65c7b";
      ctx.fillRect(px + 14, py, 6, 5);
      ctx.fillStyle = "#fff";
      ctx.fillRect(px + 16, py + 2, 2, 2);
      ctx.fillStyle = "#18181d";
      ctx.fillRect(px + 14, py + 10, 3, 4);
      ctx.fillRect(px + 19, py + 10, 3, 4);
      ctx.fillStyle = "#d94868";
      const step = runnerOver ? 0 : Math.floor(runnerFrame / 6) % 2;
      if (!player.grounded) {
        ctx.fillRect(px + 5, py + 24, 5, 4);
        ctx.fillRect(px + 14, py + 22, 5, 4);
      } else if (step === 0) {
        ctx.fillRect(px + 4, py + 24, 5, 4);
        ctx.fillRect(px + 14, py + 24, 5, 2);
      } else {
        ctx.fillRect(px + 4, py + 24, 5, 2);
        ctx.fillRect(px + 14, py + 24, 5, 4);
      }

      ctx.fillStyle = "#9898a6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(
        `BEST ${String(runnerBest).padStart(4, "0")}   SCORE ${String(Math.floor(runnerScore)).padStart(4, "0")}`,
        canvas.width - 14,
        24
      );

      if (runnerOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.68)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`GAME OVER · ${runnerLastScore}점 🌸`, canvas.width / 2, 92);
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("캔버스 터치 또는 스페이스바로 다시 달리기", canvas.width / 2, 118);
      }
    }

    /* ---------- 2. 발도술 렌더링 ---------- */
    function drawSamurai(x, y, facingRight, slashed) {
      ctx.save();
      ctx.translate(x, y);
      if (!facingRight) ctx.scale(-1, 1);

      ctx.fillStyle = facingRight ? "#ff9eb5" : "#9898a6";
      ctx.beginPath();
      ctx.moveTo(-16, -24);
      ctx.lineTo(0, -34);
      ctx.lineTo(16, -24);
      ctx.closePath();
      ctx.fill();

      ctx.fillRect(-7, -23, 14, 23);

      ctx.strokeStyle = slashed ? "#ffffff" : "#e65c7b";
      ctx.lineWidth = slashed ? 3 : 2;
      ctx.beginPath();
      if (slashed) {
        ctx.moveTo(8, -14);
        ctx.lineTo(38, -26);
      } else {
        ctx.moveTo(-4, -10);
        ctx.lineTo(16, -6);
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawSlashFrame() {
      if (slashState === "signal") {
        ctx.fillStyle = "rgba(230, 92, 123, 0.22)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      drawPetals(true);

      ctx.strokeStyle = "#343440";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      const isPlayerWin = slashState === "result";
      const isEnemyWin = slashState === "foul";
      drawSamurai(isPlayerWin ? 350 : 120, GROUND_Y, true, isPlayerWin);
      drawSamurai(isEnemyWin ? 130 : 360, GROUND_Y, false, isEnemyWin);

      if (slashFlashAlpha > 0.02) {
        ctx.strokeStyle = `rgba(255, 255, 255, ${slashFlashAlpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(40, GROUND_Y - 18);
        ctx.lineTo(canvas.width - 40, GROUND_Y - 22);
        ctx.stroke();
        slashFlashAlpha *= 0.88;
      }

      ctx.fillStyle = "#9898a6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "right";
      const bestText = slashBestMs > 0 ? `${(slashBestMs / 1000).toFixed(3)}초` : "--.---";
      ctx.fillText(`MY BEST ${bestText}`, canvas.width - 14, 24);

      ctx.textAlign = "center";
      if (slashState === "idle") {
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 17px sans-serif";
        ctx.fillText("⚔️ 낙화 발도술 승부", canvas.width / 2, 78);
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("화면 터치 또는 스페이스바로 대결 시작", canvas.width / 2, 104);
      } else if (slashState === "waiting") {
        ctx.fillStyle = "#9898a6";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText("기다려...", canvas.width / 2, 88);
      } else if (slashState === "signal") {
        ctx.fillStyle = "#ff5e84";
        ctx.font = "900 30px sans-serif";
        ctx.fillText("⚔️ 베기!!", canvas.width / 2, 92);
      } else if (slashState === "foul") {
        ctx.fillStyle = "#ff6b6b";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText("🚫 너무 빨랐습니다! (부정출발)", canvas.width / 2, 78);
        ctx.fillStyle = "#9898a6";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("터치하여 재도전", canvas.width / 2, 104);
      } else if (slashState === "result") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 24px sans-serif";
        ctx.fillText(`⚡ ${(slashReactionMs / 1000).toFixed(3)}초 (${slashReactionMs}ms)`, canvas.width / 2, 78);
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("터치하여 다시 대결하기", canvas.width / 2, 104);
      }
    }

    /* ---------- 3. 경단 쌓기 렌더링 ---------- */
    function drawDangoBlock(x, y, w, h, colorIdx) {
      const palette = DANGO_COLORS[colorIdx % DANGO_COLORS.length];
      const r = Math.min(8, h / 2, w / 2);

      ctx.fillStyle = palette.fill;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();

      ctx.strokeStyle = palette.stroke;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (w > 16) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
        ctx.fillRect(x + 6, y + 3, Math.max(4, w - 12), 2.5);
      }
    }

    function drawStackFrame() {
      drawPetals(true);

      const targetCam = Math.max(0, (stackLayers.length - 5) * STACK_BLOCK_H);
      stackCameraY += (targetCam - stackCameraY) * 0.15;

      const skewerBottom = STACK_BASE_Y + stackCameraY + 12;
      ctx.strokeStyle = "#8c6d53";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 18);
      ctx.lineTo(canvas.width / 2, Math.min(canvas.height, skewerBottom));
      ctx.stroke();

      stackLayers.forEach((layer, idx) => {
        const y = STACK_BASE_Y - (idx + 1) * STACK_BLOCK_H + stackCameraY;
        if (y > canvas.height + 20) return;
        drawDangoBlock(layer.x, y, layer.w, STACK_BLOCK_H - 1, layer.colorIdx);
      });

      if (stackRunning && !stackOver && stackMoving) {
        stackMoving.x += stackMoving.dir * stackMoving.speed;
        if (stackMoving.x <= 16) {
          stackMoving.x = 16;
          stackMoving.dir = 1;
        } else if (stackMoving.x + stackMoving.w >= canvas.width - 16) {
          stackMoving.x = canvas.width - 16 - stackMoving.w;
          stackMoving.dir = -1;
        }

        const moveY = STACK_BASE_Y - (stackLayers.length + 1) * STACK_BLOCK_H + stackCameraY;
        drawDangoBlock(stackMoving.x, moveY, stackMoving.w, STACK_BLOCK_H - 1, stackMoving.colorIdx);
      }

      for (let i = stackSliced.length - 1; i >= 0; i--) {
        const s = stackSliced[i];
        s.vy += 0.45;
        s.y += s.vy;
        drawDangoBlock(s.x, s.y, s.w, STACK_BLOCK_H - 1, s.colorIdx);
        if (s.y > canvas.height + 30) stackSliced.splice(i, 1);
      }

      if (stackPerfectTimer > 0) {
        stackPerfectTimer--;
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "900 15px sans-serif";
        ctx.textAlign = "center";
        const label = stackCombo >= 2 ? `✨ PERFECT x${stackCombo}! (+폭 회복)` : "✨ PERFECT!";
        ctx.fillText(label, canvas.width / 2, 42);
      }

      ctx.fillStyle = "#9898a6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(`BEST ${stackBest}층   현재 ${stackFloors}층`, canvas.width - 14, 24);

      if (stackOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.72)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`🍡 경단 탑 완성 · ${stackFloors}층!`, canvas.width / 2, 92);
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("캔버스 터치 또는 스페이스바로 다시 쌓기", canvas.width / 2, 118);
      }
    }

    /* ---------- 4. 낙화 닷지 (Dodge) 렌더링 ---------- */
    function drawDodgeFrame() {
      ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 32) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      if (dodgeRunning && !dodgeOver) {
        dodgeElapsedMs = Math.floor(performance.now() - dodgeStartTime);

        let mx = 0, my = 0;
        if (dodgeKeys.left) mx -= 1;
        if (dodgeKeys.right) mx += 1;
        if (dodgeKeys.up) my -= 1;
        if (dodgeKeys.down) my += 1;
        if (mx !== 0 || my !== 0) {
          const len = Math.hypot(mx, my);
          dodgeShip.x += (mx / len) * dodgeShip.speed;
          dodgeShip.y += (my / len) * dodgeShip.speed;
          dodgeShip.x = Math.max(dodgeShip.r + 4, Math.min(canvas.width - dodgeShip.r - 4, dodgeShip.x));
          dodgeShip.y = Math.max(dodgeShip.r + 4, Math.min(canvas.height - dodgeShip.r - 4, dodgeShip.y));
        }

        const targetCount = Math.min(65, 16 + Math.floor(dodgeElapsedMs / 650));
        dodgeSpawnTimer++;
        if (dodgeBullets.length < targetCount && dodgeSpawnTimer % 4 === 0) {
          spawnDodgeBullet();
        }

        for (let i = dodgeBullets.length - 1; i >= 0; i--) {
          const b = dodgeBullets[i];
          b.x += b.vx;
          b.y += b.vy;

          const dist = Math.hypot(b.x - dodgeShip.x, b.y - dodgeShip.y);
          if (dist < b.r + dodgeShip.r - 1.2) {
            dodgeOver = true;
            if (dodgeElapsedMs > dodgeBestMs) {
              dodgeBestMs = dodgeElapsedMs;
              localStorage.setItem("nakhwaDodgeBest", String(dodgeBestMs));
            }
            if (dodgeElapsedMs > 0) showSubmitBar();
            break;
          }

          if (b.x < -16 || b.x > canvas.width + 16 || b.y < -16 || b.y > canvas.height + 16) {
            dodgeBullets.splice(i, 1);
            spawnDodgeBullet();
          }
        }
      }

      dodgeBullets.forEach(b => {
        ctx.fillStyle = b.isPink ? "#ff7999" : "#ffd166";
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.save();
      ctx.translate(dodgeShip.x, dodgeShip.y);
      ctx.fillStyle = "rgba(230, 92, 123, 0.28)";
      ctx.beginPath();
      ctx.arc(0, 0, dodgeShip.r + 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(7, 7);
      ctx.lineTo(0, 4);
      ctx.lineTo(-7, 7);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#e65c7b";
      ctx.beginPath();
      ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = "#9898a6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "right";
      const bestSec = (dodgeBestMs / 1000).toFixed(2);
      const curSec = (dodgeElapsedMs / 1000).toFixed(2);
      ctx.fillText(`BEST ${bestSec}초   생존 ${curSec}초`, canvas.width - 14, 24);

      if (dodgeOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.72)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`💥 피격! 생존 기록 ${(dodgeElapsedMs / 1000).toFixed(2)}초`, canvas.width / 2, 92);
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("캔버스 터치 또는 스페이스바로 다시 도전", canvas.width / 2, 118);
      }
    }

    /* ---------- 5. 낙화 고군분투 (와이어 액션) 렌더링 ---------- */
    function drawGogunFrame() {
      ctx.fillStyle = "rgba(255, 226, 154, 0.16)";
      ctx.beginPath();
      ctx.arc(410, 42, 18, 0, Math.PI * 2);
      ctx.fill();

      drawPetals(gogunRunning && !gogunOver);

      if (gogunRunning && !gogunOver) {
        gogunFrame++;
        gogunScore += 0.12;
        gogunSpeed = Math.min(7.8, 4.2 + gogunScore * 0.002);

        gogunRoofs.forEach(r => { r.x -= gogunSpeed; });
        while (gogunRoofs.length > 0 && gogunRoofs[0].x + gogunRoofs[0].w < -40) {
          gogunRoofs.shift();
        }
        const lastRoof = gogunRoofs[gogunRoofs.length - 1];
        if (lastRoof && lastRoof.x + lastRoof.w < canvas.width + 180) {
          spawnGogunSection(lastRoof.x + lastRoof.w);
        }

        for (let i = gogunCoins.length - 1; i >= 0; i--) {
          const c = gogunCoins[i];
          c.x -= gogunSpeed;
          if (!c.collected) {
            const dist = Math.hypot((gogunPlayer.x + 10) - c.x, (gogunPlayer.y + 11) - c.y);
            if (dist < 19) {
              c.collected = true;
              gogunScore += c.type === "gem" ? 50 : 15;
            }
          }
          if (c.x < -30) gogunCoins.splice(i, 1);
        }

        if (gogunHook.active) {
          gogunHook.anchorX -= gogunSpeed * 0.45;
          const gravityAcc = -0.0042 * Math.sin(gogunHook.angle);
          gogunHook.angVel += gravityAcc + 0.0018;
          gogunHook.angVel *= 0.992;
          gogunHook.angle += gogunHook.angVel;

          gogunPlayer.x = gogunHook.anchorX + Math.sin(gogunHook.angle) * gogunHook.length;
          gogunPlayer.y = gogunHook.anchorY + Math.cos(gogunHook.angle) * gogunHook.length;

          if (gogunHook.angle > 0.72 || gogunPlayer.x > 260 || gogunPlayer.y < 24) {
            releaseGogunHook();
          }
        } else {
          gogunPlayer.x += (82 - gogunPlayer.x) * 0.08;

          const prevBottom = gogunPlayer.y + gogunPlayer.h;
          gogunPlayer.vy += 0.48;
          gogunPlayer.y += gogunPlayer.vy;
          gogunPlayer.grounded = false;

          if (gogunHolding && gogunPlayer.vy > -1.0 && gogunPlayer.y > 42) {
            attachGogunHook();
          }

          if (gogunPlayer.vy >= 0) {
            for (const r of gogunRoofs) {
              const pCenter = gogunPlayer.x + gogunPlayer.w * 0.5;
              const curBottom = gogunPlayer.y + gogunPlayer.h;
              if (pCenter >= r.x - 4 && pCenter <= r.x + r.w + 4) {
                if (prevBottom <= r.y + 8 && curBottom >= r.y) {
                  gogunPlayer.y = r.y - gogunPlayer.h;
                  gogunPlayer.vy = 0;
                  gogunPlayer.grounded = true;
                  break;
                }
              }
            }
          }
        }

        if (gogunPlayer.y > canvas.height + 10) {
          gogunOver = true;
          gogunLastScore = Math.floor(gogunScore);
          if (gogunLastScore > gogunBest) {
            gogunBest = gogunLastScore;
            localStorage.setItem("nakhwaGogunBest", String(gogunBest));
          }
          if (gogunLastScore > 0) showSubmitBar();
        }
      }

      gogunRoofs.forEach(r => {
        ctx.fillStyle = "#262630";
        ctx.fillRect(r.x, r.y, r.w, canvas.height - r.y);

        ctx.fillStyle = "#e65c7b";
        ctx.fillRect(r.x - 3, r.y, r.w + 6, 5);

        ctx.fillStyle = "#ff8ca5";
        for (let tx = r.x + 4; tx < r.x + r.w - 6; tx += 14) {
          ctx.fillRect(tx, r.y - 2, 8, 2);
        }
      });

      gogunCoins.forEach(c => {
        if (c.collected) return;
        if (c.type === "gem") {
          ctx.fillStyle = "#ff7999";
          ctx.beginPath();
          ctx.moveTo(c.x, c.y - 7);
          ctx.lineTo(c.x + 6, c.y);
          ctx.lineTo(c.x, c.y + 7);
          ctx.lineTo(c.x - 6, c.y);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillStyle = "#ffd166";
          ctx.beginPath();
          ctx.arc(c.x, c.y, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#121216";
          ctx.fillRect(c.x - 1.5, c.y - 1.5, 3, 3);
        }
      });

      if (gogunHook.active) {
        ctx.strokeStyle = "#ff9eb5";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(gogunPlayer.x + 12, gogunPlayer.y + 4);
        ctx.lineTo(gogunHook.anchorX, gogunHook.anchorY);
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(gogunHook.anchorX, gogunHook.anchorY, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      const gx = Math.round(gogunPlayer.x);
      const gy = Math.round(gogunPlayer.y);

      ctx.fillStyle = "#e65c7b";
      const scarfWave = Math.sin(gogunFrame * 0.35) * 3;
      ctx.fillRect(gx - 8, gy + 7 + scarfWave, 10, 4);

      ctx.fillStyle = "#f4f4f6";
      ctx.fillRect(gx + 3, gy + 2, 14, 16);
      ctx.fillStyle = "#e65c7b";
      ctx.fillRect(gx + 3, gy + 5, 14, 3);

      ctx.fillStyle = "#18181d";
      ctx.fillRect(gx + 12, gy + 8, 3, 3);

      ctx.fillStyle = "#9898a6";
      if (!gogunPlayer.grounded) {
        ctx.fillRect(gx + 4, gy + 18, 4, 4);
        ctx.fillRect(gx + 12, gy + 16, 4, 4);
      } else if (Math.floor(gogunFrame / 5) % 2 === 0) {
        ctx.fillRect(gx + 4, gy + 18, 4, 4);
        ctx.fillRect(gx + 12, gy + 18, 4, 2);
      } else {
        ctx.fillRect(gx + 4, gy + 18, 4, 2);
        ctx.fillRect(gx + 12, gy + 18, 4, 4);
      }

      ctx.fillStyle = "#9898a6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(
        `BEST ${String(gogunBest).padStart(4, "0")}   SCORE ${String(Math.floor(gogunScore)).padStart(4, "0")}`,
        canvas.width - 14,
        24
      );

      if (gogunOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.72)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`🪝 추락! 최종 기록 ${gogunLastScore}점`, canvas.width / 2, 92);
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("터치 또는 스페이스바로 다시 질주하기", canvas.width / 2, 118);
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (activeGame === "runner") {
        drawRunnerFrame();
      } else if (activeGame === "slash") {
        drawSlashFrame();
      } else if (activeGame === "stack") {
        drawStackFrame();
      } else if (activeGame === "dodge") {
        drawDodgeFrame();
      } else {
        drawGogunFrame();
      }

      requestAnimationFrame(gameLoop);
    }

    /* ---------- 키보드 입력 처리 ---------- */
    document.addEventListener("keydown", (e) => {
      if (document.activeElement === nickInput) {
        if (e.key === "Escape") nickInput.blur();
        return;
      }

      if (activeGame === "dodge") {
        if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") { e.preventDefault(); dodgeKeys.up = true; }
        if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); dodgeKeys.down = true; }
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { e.preventDefault(); dodgeKeys.left = true; }
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { e.preventDefault(); dodgeKeys.right = true; }
      }

      if (activeGame === "gogun" && (e.code === "Space" || e.key === "ArrowUp")) {
        e.preventDefault();
        if (!e.repeat) handleGogunPressStart();
        return;
      }

      if (e.code === "Space" || (activeGame !== "dodge" && e.key === "ArrowUp")) {
        e.preventDefault();
        handleCanvasAction();
      }
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") dodgeKeys.up = false;
      if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") dodgeKeys.down = false;
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") dodgeKeys.left = false;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") dodgeKeys.right = false;

      if (activeGame === "gogun" && (e.code === "Space" || e.key === "ArrowUp")) {
        handleGogunPressEnd();
      }
    });

    // 초기화 및 루프 시작
    switchGameTab("runner");
    gameLoop();
  </script>
