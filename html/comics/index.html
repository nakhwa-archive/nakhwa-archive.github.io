<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>4컷 웹툰 아카이브 | nakhwa-archive</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="4컷 웹툰 아카이브 | nakhwa-archive" />
  <meta property="og:description" content="메이븐 길드 [낙화] 4컷 만화 모음집입니다." />
  <meta property="og:image" content="https://nakhwa-archive.github.io/html/comics/thumbnail.jpg" />
  <meta property="og:url" content="https://nakhwa-archive.github.io/html/comics/" />

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a1f;
      --card-hover: #24242b;
      --text-main: #f4f4f6;
      --text-sub: #9898a6;
      --accent: #e65c7b;
      --border: #282830;
      --bar-bg: rgba(18, 18, 22, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      line-height: 1.4;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bar-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    header h1 {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .episode-count {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
      background: rgba(230, 92, 123, 0.14);
      padding: 3px 7px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .sort-btn {
      background: #18181d;
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 9px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .sort-btn:active {
      transform: scale(0.95);
      border-color: var(--accent);
    }

    .view-toggle {
      display: flex;
      background: #18181d;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      flex-shrink: 0;
    }

    .toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .toggle-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 12px;
    }

    .promo-banner {
      width: 100%;
      margin-bottom: 12px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--card-bg);
    }

    .promo-banner img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .quick-read-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .quick-btn {
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .quick-btn.latest {
      background: rgba(230, 92, 123, 0.15);
      border-color: rgba(230, 92, 123, 0.45);
      color: #ff8ca5;
    }

    .quick-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .quick-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .status-msg {
      text-align: center;
      padding: 80px 16px;
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* 1. 그리드 보기 */
    .episode-container.grid-view {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 540px) {
      .episode-container.grid-view {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    .grid-view .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease;
      display: flex;
      flex-direction: column;
    }

    .grid-view .card:active {
      transform: scale(0.97);
      border-color: var(--accent);
    }

    .grid-view .thumb-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #09090b;
    }

    .grid-view .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .grid-view .card-info {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .grid-view .card-num {
      display: none;
    }

    .grid-view .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 2. 리스트 보기 */
    .episode-container.list-view {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .list-view .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px 8px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.12s ease, border-color 0.12s ease;
    }

    .list-view .card:active {
      background: var(--card-hover);
      border-color: var(--accent);
    }

    .list-view .thumb-wrap {
      width: 54px;
      height: 54px;
      border-radius: 7px;
      overflow: hidden;
      background: #09090b;
      flex-shrink: 0;
    }

    .list-view .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .list-view .card-info {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .list-view .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .list-view .card-num {
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    .card-like-badge {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .card-like-badge.liked {
      color: var(--accent);
    }

    /* 페이지네이션 */
    .pagination {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .page-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
    }

    .page-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* 푸터 */
    .guild-footer {
      margin-top: 28px;
      padding: 18px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }

    .scroll-top-btn {
      width: 38px;
      height: 38px;
      margin: 0 auto 10px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #24242b;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .guild-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
      cursor: pointer;
      user-select: none;
      display: inline-block;
      transition: transform 0.1s ease;
    }

    .guild-title:active {
      transform: scale(0.95);
    }

    .guild-title .accent {
      color: var(--accent);
    }

    .guild-sub {
      font-size: 0.86rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* 뷰어 */
    .viewer-overlay {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 1000;
      display: none;
      flex-direction: column;
    }

    .viewer-overlay.active {
      display: flex;
    }

    .viewer-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1010;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      background: var(--bar-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.22s ease, opacity 0.22s ease;
    }

    .viewer-title {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 12px;
    }

    .page-badge {
      font-size: 0.8rem;
      color: var(--text-sub);
      flex-shrink: 0;
    }

    .viewer-body {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: calc(64px + env(safe-area-inset-top)) 0 calc(84px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .viewer-body img {
      width: 100%;
      max-width: 600px;
      height: auto;
      display: block;
      user-select: none;
    }

    .viewer-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1010;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: var(--bar-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1.1fr 0.9fr 1fr;
      gap: 6px;
      transition: transform 0.22s ease, opacity 0.22s ease;
    }

    .ctrl-btn {
      height: 46px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #222228;
      color: var(--text-main);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .ctrl-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .ctrl-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-like.liked {
      background: rgba(230, 92, 123, 0.18);
      border-color: var(--accent);
      color: var(--accent);
    }

    @keyframes heartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    .btn-like.pop {
      animation: heartPop 0.28s ease;
    }

    .btn-close-center {
      background: #2c2c35;
      color: #fff;
    }

    .viewer-overlay.ui-hidden .viewer-header {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .viewer-overlay.ui-hidden .viewer-footer {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }

    /* 이스터에그 미니게임 모달 */
    .easter-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.86);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .easter-modal.active {
      display: flex;
    }

    .easter-box {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 36px rgba(230, 92, 123, 0.25);
    }

    .easter-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .easter-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .easter-title span {
      color: var(--accent);
    }

    .easter-close {
      background: #26262e;
      border: 1px solid var(--border);
      color: var(--text-sub);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* 미니게임 4종 선택 탭 */
    .game-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 10px;
      background: #121216;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .game-tab-btn {
      height: 34px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      padding: 0 4px;
    }

    .game-tab-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    #gameCanvas {
      width: 100%;
      height: 205px;
      background: #121216;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: block;
      touch-action: none;
      cursor: pointer;
    }

    .easter-hint {
      margin-top: 8px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    /* 점수 등록 바 */
    .score-submit-bar {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #141418;
      border: 1px solid rgba(230, 92, 123, 0.45);
      border-radius: 10px;
      gap: 6px;
      align-items: center;
    }

    .score-submit-bar.active {
      display: flex;
    }

    .nick-input {
      flex: 1;
      min-width: 0;
      height: 36px;
      background: #1e1e24;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    .nick-input:focus {
      border-color: var(--accent);
    }

    .submit-score-btn {
      height: 36px;
      padding: 0 14px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .submit-score-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 실시간 랭킹 보드 */
    .ranking-board {
      margin-top: 12px;
      background: #141418;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .ranking-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .ranking-status {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-sub);
    }

    .ranking-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      padding: 4px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
    }

    .ranking-item.top1 {
      background: rgba(230, 92, 123, 0.14);
      color: #ff9eb5;
      font-weight: 700;
    }

    .rank-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .rank-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-score {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>4컷 만화</h1>
      <span class="episode-count" id="episodeCount">로딩중</span>
    </div>

    <div class="header-controls">
      <button type="button" class="sort-btn" id="btnSortToggle" aria-label="정렬 기준 변경">⇅ 최신순</button>

      <div class="view-toggle" role="group" aria-label="목록 보기 방식">
        <button type="button" class="toggle-btn active" id="btnGridView">⊞ 썸네일</button>
        <button type="button" class="toggle-btn" id="btnListView">☰ 리스트</button>
      </div>
    </div>
  </header>

  <main>
    <div class="promo-banner" id="promoBanner">
      <img src="./banner.png" alt="메이븐 길드 낙화 홍보 배너" onerror="document.getElementById('promoBanner').style.display='none';" />
    </div>

    <div class="quick-read-bar">
      <button type="button" class="quick-btn" id="btnFirstEp" disabled>⏮ 첫화 보기</button>
      <button type="button" class="quick-btn latest" id="btnLatestEp" disabled>🔥 마지막화 보기</button>
    </div>

    <div id="statusMsg" class="status-msg">목록을 불러오는 중입니다...</div>
    <div id="episodeContainer" class="episode-container grid-view"></div>
    <nav id="pagination" class="pagination" aria-label="페이지 이동"></nav>

    <footer class="guild-footer">
      <button type="button" class="scroll-top-btn" id="btnScrollTop" aria-label="맨 위로 이동">▲</button>
      <p class="guild-title" id="secretTrigger">⚔️ 메이븐 길드 <span class="accent">[낙화]</span></p>
      <p class="guild-sub">길드장 김정환 · 가입 문의 환영 🌸</p>
    </footer>
  </main>

  <div id="viewerOverlay" class="viewer-overlay" role="dialog" aria-modal="true">
    <div class="viewer-header">
      <div class="viewer-title" id="viewerTitle">제목</div>
      <div class="page-badge" id="pageIndicator">1 / 1</div>
    </div>

    <div class="viewer-body" id="viewerBody">
      <img id="viewerImg" src="" alt="4컷 만화" />
    </div>

    <div class="viewer-footer">
      <button type="button" class="ctrl-btn" id="btnPrev">◀ 이전</button>
      <button type="button" class="ctrl-btn btn-like" id="btnLike">
        <span id="likeIcon">🤍</span>
        <span id="likeCount">0</span>
      </button>
      <button type="button" class="ctrl-btn btn-close-center" id="btnClose">닫기</button>
      <button type="button" class="ctrl-btn" id="btnNext">다음 ▶</button>
    </div>
  </div>

  <!-- 이스터에그 미니게임 모달 -->
  <div id="easterModal" class="easter-modal" role="dialog" aria-modal="true">
    <div class="easter-box">
      <div class="easter-top">
        <div class="easter-title">🌸 비밀 오락실 · <span>낙화 미니게임</span></div>
        <button type="button" class="easter-close" id="btnCloseEaster" aria-label="게임 닫기">✕</button>
      </div>

      <div class="game-tabs">
        <button type="button" class="game-tab-btn active" id="tabRunner">🌸 러너</button>
        <button type="button" class="game-tab-btn" id="tabSlash">⚔️ 발도술</button>
        <button type="button" class="game-tab-btn" id="tabStack">🍡 경단</button>
        <button type="button" class="game-tab-btn" id="tabDodge">💥 닷지</button>
      </div>

      <canvas id="gameCanvas" width="480" height="205"></canvas>
      <p class="easter-hint" id="easterHint">화면 터치 또는 스페이스바(↑)로 점프!</p>

      <!-- 기록 등록 바 -->
      <div class="score-submit-bar" id="scoreSubmitBar">
        <input type="text" id="nickInput" class="nick-input" maxlength="10" placeholder="길드원 닉네임 (최대 10자)" />
        <button type="button" id="btnSubmitScore" class="submit-score-btn">기록 등록</button>
      </div>

      <!-- 실시간 TOP 5 랭킹 -->
      <div class="ranking-board">
        <div class="ranking-header">
          <span id="rankingTitle">🏆 낙화 러너 TOP 5</span>
          <span class="ranking-status" id="rankingStatus">불러오는 중...</span>
        </div>
        <ul class="ranking-list" id="rankingList"></ul>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      owner: "nakhwa-archive",
      repo: "nakhwa-archive.github.io",
      folderPath: "html/comics/images",
      itemsPerPage: 20,
      firebaseDbUrl: "https://nakhwa-a90f6-default-rtdb.firebaseio.com"
    };

    let episodes = [];
    let likesData = {};
    let myLikedMap = JSON.parse(localStorage.getItem("nakhwaMyLikes") || "{}");
    let currentEpisodeIndex = 0;
    let currentPage = 1;
    let viewMode = localStorage.getItem("comicViewMode") || "grid";
    let sortOrder = localStorage.getItem("comicSortOrder") || "latest";

    const containerEl = document.getElementById("episodeContainer");
    const paginationEl = document.getElementById("pagination");
    const statusEl = document.getElementById("statusMsg");
    const countEl = document.getElementById("episodeCount");

    const btnSortToggle = document.getElementById("btnSortToggle");
    const btnGridView = document.getElementById("btnGridView");
    const btnListView = document.getElementById("btnListView");
    const btnFirstEp = document.getElementById("btnFirstEp");
    const btnLatestEp = document.getElementById("btnLatestEp");
    const btnScrollTop = document.getElementById("btnScrollTop");

    const overlayEl = document.getElementById("viewerOverlay");
    const viewerBodyEl = document.getElementById("viewerBody");
    const viewerTitleEl = document.getElementById("viewerTitle");
    const viewerImgEl = document.getElementById("viewerImg");
    const pageIndicatorEl = document.getElementById("pageIndicator");
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const btnClose = document.getElementById("btnClose");
    const btnLike = document.getElementById("btnLike");
    const likeIconEl = document.getElementById("likeIcon");
    const likeCountEl = document.getElementById("likeCount");

    btnScrollTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    function updateSortButtonUI() {
      btnSortToggle.textContent = sortOrder === "latest" ? "⇅ 최신순" : "⇅ 첫화순";
    }

    btnSortToggle.addEventListener("click", () => {
      sortOrder = sortOrder === "latest" ? "oldest" : "latest";
      localStorage.setItem("comicSortOrder", sortOrder);
      updateSortButtonUI();
      renderPage(1, false);
    });
    updateSortButtonUI();

    function applyViewMode(mode) {
      viewMode = mode;
      localStorage.setItem("comicViewMode", mode);
      if (mode === "grid") {
        containerEl.className = "episode-container grid-view";
        btnGridView.classList.add("active");
        btnListView.classList.remove("active");
      } else {
        containerEl.className = "episode-container list-view";
        btnListView.classList.add("active");
        btnGridView.classList.remove("active");
      }
    }

    btnGridView.addEventListener("click", () => applyViewMode("grid"));
    btnListView.addEventListener("click", () => applyViewMode("list"));
    applyViewMode(viewMode);

    btnFirstEp.addEventListener("click", () => {
      if (episodes.length > 0) openViewer(0);
    });

    btnLatestEp.addEventListener("click", () => {
      if (episodes.length > 0) openViewer(episodes.length - 1);
    });

    function formatTitle(filename) {
      return filename.replace(/\.[^/.]+$/, "");
    }

    function getSafeKey(title) {
      return title.replace(/[.#$\[\]\/]/g, "_");
    }

    function getSortedEpisodes() {
      if (sortOrder === "latest") {
        return [...episodes].reverse();
      }
      return episodes;
    }

    async function fetchAllLikes() {
      try {
        const res = await fetch(`${CONFIG.firebaseDbUrl}/likes.json`);
        if (res.ok) {
          const data = await res.json();
          likesData = data || {};
        }
      } catch (e) {
        console.warn("좋아요 데이터 로드 실패:", e);
      }
    }

    async function toggleLike() {
      const ep = episodes[currentEpisodeIndex];
      if (!ep) return;

      const key = getSafeKey(ep.title);
      const isLiked = !!myLikedMap[key];
      const currentCount = likesData[key] || 0;
      const nextCount = isLiked ? Math.max(0, currentCount - 1) : currentCount + 1;

      if (isLiked) {
        delete myLikedMap[key];
      } else {
        myLikedMap[key] = true;
        btnLike.classList.remove("pop");
        void btnLike.offsetWidth;
        btnLike.classList.add("pop");
      }
      localStorage.setItem("nakhwaMyLikes", JSON.stringify(myLikedMap));
      likesData[key] = nextCount;
      updateLikeButtonUI(key);

      try {
        const encodedKey = encodeURIComponent(key);
        const res = await fetch(`${CONFIG.firebaseDbUrl}/likes/${encodedKey}.json`);
        const serverVal = (await res.json()) || 0;
        const updatedVal = isLiked ? Math.max(0, serverVal - 1) : serverVal + 1;

        await fetch(`${CONFIG.firebaseDbUrl}/likes/${encodedKey}.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updatedVal)
        });

        likesData[key] = updatedVal;
        updateLikeButtonUI(key);
      } catch (e) {
        console.warn("좋아요 저장 실패:", e);
      }
    }

    function updateLikeButtonUI(key) {
      const isLiked = !!myLikedMap[key];
      const count = likesData[key] || 0;
      btnLike.classList.toggle("liked", isLiked);
      likeIconEl.textContent = isLiked ? "❤️" : "🤍";
      likeCountEl.textContent = count;
    }

    btnLike.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleLike();
    });

    async function loadEpisodes() {
      const apiUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.folderPath}`;

      try {
        const [filesRes] = await Promise.all([
          fetch(apiUrl),
          fetchAllLikes()
        ]);

        if (!filesRes.ok) throw new Error(`HTTP ${filesRes.status}`);

        const files = await filesRes.json();
        const imageRegex = /\.(png|jpe?g|gif|webp)$/i;

        episodes = files
          .filter(file => file.type === "file" && imageRegex.test(file.name))
          .sort((a, b) => formatTitle(a.name).localeCompare(formatTitle(b.name), "ko", { numeric: true }))
          .map((file, index) => ({
            epNumber: index + 1,
            originalIndex: index,
            title: formatTitle(file.name),
            url: file.download_url
          }));

        if (episodes.length > 0) {
          btnFirstEp.disabled = false;
          btnLatestEp.disabled = false;
        }

        renderPage(1, false);
      } catch (err) {
        statusEl.textContent = "이미지를 불러오지 못했습니다. 폴더 경로와 저장소 공개 여부를 확인해 주세요.";
        countEl.textContent = "0화";
        console.error(err);
      }
    }

    function renderPage(page, shouldScrollTop = true) {
      if (episodes.length === 0) {
        statusEl.textContent = "등록된 4컷 만화가 없습니다.";
        countEl.textContent = "0화";
        paginationEl.innerHTML = "";
        return;
      }

      statusEl.style.display = "none";
      countEl.textContent = `총 ${episodes.length}화`;

      const displayList = getSortedEpisodes();
      const totalPages = Math.ceil(displayList.length / CONFIG.itemsPerPage);
      currentPage = Math.max(1, Math.min(page, totalPages));

      const startIndex = (currentPage - 1) * CONFIG.itemsPerPage;
      const endIndex = startIndex + CONFIG.itemsPerPage;
      const pageItems = displayList.slice(startIndex, endIndex);

      containerEl.innerHTML = "";

      pageItems.forEach((ep) => {
        const key = getSafeKey(ep.title);
        const likeCount = likesData[key] || 0;
        const isLiked = !!myLikedMap[key];

        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="thumb-wrap">
            <img src="${ep.url}" alt="${ep.title}" loading="lazy" />
          </div>
          <div class="card-info">
            <div class="card-title">${ep.title}</div>
            <div class="list-meta">
              <span class="card-like-badge ${isLiked ? "liked" : ""}">
                ${isLiked ? "❤️" : "🤍"} ${likeCount}
              </span>
              <span class="card-num">#${ep.epNumber}</span>
            </div>
          </div>
        `;
        card.addEventListener("click", () => openViewer(ep.originalIndex));
        containerEl.appendChild(card);
      });

      renderPagination(totalPages);

      if (shouldScrollTop) {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function renderPagination(totalPages) {
      paginationEl.innerHTML = "";
      if (totalPages <= 1) return;

      const prevPageBtn = document.createElement("button");
      prevPageBtn.type = "button";
      prevPageBtn.className = "page-btn";
      prevPageBtn.textContent = "◀";
      prevPageBtn.disabled = currentPage === 1;
      prevPageBtn.addEventListener("click", () => renderPage(currentPage - 1));
      paginationEl.appendChild(prevPageBtn);

      const maxVisible = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
      let endPage = Math.min(totalPages, startPage + maxVisible - 1);
      if (endPage - startPage + 1 < maxVisible) {
        startPage = Math.max(1, endPage - maxVisible + 1);
      }

      for (let i = startPage; i <= endPage; i++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `page-btn ${i === currentPage ? "active" : ""}`;
        btn.textContent = i;
        btn.addEventListener("click", () => renderPage(i));
        paginationEl.appendChild(btn);
      }

      const nextPageBtn = document.createElement("button");
      nextPageBtn.type = "button";
      nextPageBtn.className = "page-btn";
      nextPageBtn.textContent = "▶";
      nextPageBtn.disabled = currentPage === totalPages;
      nextPageBtn.addEventListener("click", () => renderPage(currentPage + 1));
      paginationEl.appendChild(nextPageBtn);
    }

    function openViewer(index) {
      currentEpisodeIndex = index;
      overlayEl.classList.remove("ui-hidden");
      updateViewer();
      overlayEl.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeViewer() {
      overlayEl.classList.remove("active");
      document.body.style.overflow = "";

      const displayIndex = sortOrder === "latest"
        ? (episodes.length - 1 - currentEpisodeIndex)
        : currentEpisodeIndex;
      const targetPage = Math.floor(displayIndex / CONFIG.itemsPerPage) + 1;
      renderPage(targetPage, false);
    }

    function updateViewer() {
      const ep = episodes[currentEpisodeIndex];
      viewerTitleEl.textContent = ep.title;
      viewerImgEl.src = ep.url;
      viewerImgEl.alt = ep.title;
      pageIndicatorEl.textContent = `${currentEpisodeIndex + 1} / ${episodes.length}`;

      updateLikeButtonUI(getSafeKey(ep.title));

      viewerBodyEl.scrollTop = 0;
      btnPrev.disabled = currentEpisodeIndex === 0;
      btnNext.disabled = currentEpisodeIndex === episodes.length - 1;
    }

    btnPrev.addEventListener("click", (e) => {
      e.stopPropagation();
      if (currentEpisodeIndex > 0) {
        currentEpisodeIndex--;
        updateViewer();
      }
    });

    btnNext.addEventListener("click", (e) => {
      e.stopPropagation();
      if (currentEpisodeIndex < episodes.length - 1) {
        currentEpisodeIndex++;
        updateViewer();
      }
    });

    btnClose.addEventListener("click", (e) => {
      e.stopPropagation();
      closeViewer();
    });

    let touchStartX = 0, touchStartY = 0;
    viewerBodyEl.addEventListener("touchstart", (e) => {
      if (e.touches.length > 1) return;
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    viewerBodyEl.addEventListener("touchend", (e) => {
      if (e.touches.length > 0) return;
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
        if (diffX < 0 && currentEpisodeIndex < episodes.length - 1) {
          currentEpisodeIndex++;
          updateViewer();
        } else if (diffX > 0 && currentEpisodeIndex > 0) {
          currentEpisodeIndex--;
          updateViewer();
        }
      }
    }, { passive: true });

    viewerBodyEl.addEventListener("click", () => {
      overlayEl.classList.toggle("ui-hidden");
    });

    /* =====================================================================
       이스터에그 비밀 오락실 (1. 러너 / 2. 발도술 / 3. 경단 쌓기 / 4. 닷지)
       ===================================================================== */
    const secretTrigger = document.getElementById("secretTrigger");
    const easterModal = document.getElementById("easterModal");
    const btnCloseEaster = document.getElementById("btnCloseEaster");
    const tabRunner = document.getElementById("tabRunner");
    const tabSlash = document.getElementById("tabSlash");
    const tabStack = document.getElementById("tabStack");
    const tabDodge = document.getElementById("tabDodge");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const easterHint = document.getElementById("easterHint");

    const scoreSubmitBar = document.getElementById("scoreSubmitBar");
    const nickInput = document.getElementById("nickInput");
    const btnSubmitScore = document.getElementById("btnSubmitScore");
    const rankingTitleEl = document.getElementById("rankingTitle");
    const rankingListEl = document.getElementById("rankingList");
    const rankingStatusEl = document.getElementById("rankingStatus");

    nickInput.value = localStorage.getItem("nakhwaRunnerNick") || "";

    let activeGame = "runner"; // "runner" | "slash" | "stack" | "dodge"
    let gameAnimId = null;
    let secretTapCount = 0;
    let secretTapTimer = null;

    secretTrigger.addEventListener("click", () => {
      secretTapCount++;
      clearTimeout(secretTapTimer);
      secretTapTimer = setTimeout(() => { secretTapCount = 0; }, 1500);

      if (secretTapCount >= 5) {
        secretTapCount = 0;
        openEasterGame();
      }
    });

    const GROUND_Y = 170;
    let petals = [];

    function initPetals() {
      petals = Array.from({ length: 14 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * GROUND_Y,
        r: 2 + Math.random() * 2.5,
        vx: -(0.6 + Math.random() * 1.2),
        vy: 0.4 + Math.random() * 0.8
      }));
    }

    function drawPetals(moving) {
      ctx.fillStyle = "rgba(255, 165, 188, 0.45)";
      petals.forEach(p => {
        if (moving) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.y > GROUND_Y) p.y = 0;
        }
        ctx.fillRect(p.x, p.y, p.r, p.r);
      });
    }

    /* ---------- 1. 낙화 러너 상태 ---------- */
    let runnerRunning = false;
    let runnerOver = false;
    let runnerScore = 0;
    let runnerLastScore = 0;
    let runnerBest = Number(localStorage.getItem("nakhwaRunnerBest") || 0);
    let runnerSpeed = 4.5;
    let runnerFrame = 0;

    const player = {
      x: 48,
      y: GROUND_Y - 28,
      w: 24,
      h: 28,
      vy: 0,
      gravity: 0.62,
      jumpPower: -10.8,
      grounded: true
    };
    let obstacles = [];

    function resetRunner() {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.grounded = true;
      obstacles = [];
      runnerScore = 0;
      runnerSpeed = 4.5;
      runnerFrame = 0;
      runnerOver = false;
      runnerRunning = true;
      hideSubmitBar();
      initPetals();
    }

    /* ---------- 2. 낙화 발도술 상태 ---------- */
    let slashState = "idle"; // "idle" | "waiting" | "signal" | "result" | "foul"
    let slashSignalTime = 0;
    let slashTimer = null;
    let slashReactionMs = 0;
    let slashBestMs = Number(localStorage.getItem("nakhwaSlashBest") || 0);
    let slashFlashAlpha = 0;

    function resetSlashToIdle() {
      clearTimeout(slashTimer);
      slashState = "idle";
      slashFlashAlpha = 0;
      hideSubmitBar();
    }

    function startSlashRound() {
      clearTimeout(slashTimer);
      slashState = "waiting";
      slashFlashAlpha = 0;
      hideSubmitBar();

      const delay = 1500 + Math.random() * 2900;
      slashTimer = setTimeout(() => {
        if (activeGame !== "slash" || !easterModal.classList.contains("active")) return;
        slashState = "signal";
        slashSignalTime = performance.now();
        slashFlashAlpha = 1;
      }, delay);
    }

    function handleSlashAction() {
      if (slashState === "idle" || slashState === "result" || slashState === "foul") {
        startSlashRound();
      } else if (slashState === "waiting") {
        clearTimeout(slashTimer);
        slashState = "foul";
        hideSubmitBar();
      } else if (slashState === "signal") {
        const diff = Math.round(performance.now() - slashSignalTime);
        slashReactionMs = Math.max(1, diff);
        slashState = "result";
        slashFlashAlpha = 1;

        if (slashBestMs === 0 || slashReactionMs < slashBestMs) {
          slashBestMs = slashReactionMs;
          localStorage.setItem("nakhwaSlashBest", String(slashBestMs));
        }
        showSubmitBar();
      }
    }

    /* ---------- 3. 경단 쌓기 (Stack) 상태 ---------- */
    const DANGO_COLORS = [
      { fill: "#ffb7c5", stroke: "#ff8ca5" },
      { fill: "#f4f4f6", stroke: "#d0d0dc" },
      { fill: "#a8d5ba", stroke: "#7bb894" }
    ];
    const STACK_BLOCK_H = 18;
    const STACK_BASE_Y = 184;

    let stackLayers = [];
    let stackMoving = null;
    let stackSliced = [];
    let stackRunning = false;
    let stackOver = false;
    let stackFloors = 0;
    let stackBest = Number(localStorage.getItem("nakhwaStackBest") || 0);
    let stackCameraY = 0;
    let stackPerfectTimer = 0;
    let stackCombo = 0;

    function resetStack() {
      const startW = 140;
      const startX = (canvas.width - startW) / 2;
      stackLayers = [{ x: startX, w: startW, colorIdx: 0 }];
      stackSliced = [];
      stackFloors = 0;
      stackCameraY = 0;
      stackPerfectTimer = 0;
      stackCombo = 0;
      stackOver = false;
      stackRunning = true;
      hideSubmitBar();
      initPetals();
      spawnNextDango();
    }

    function spawnNextDango() {
      const prev = stackLayers[stackLayers.length - 1];
      const dir = stackLayers.length % 2 === 1 ? 1 : -1;
      const speed = Math.min(7.2, 2.7 + stackFloors * 0.14);
      stackMoving = {
        x: dir === 1 ? 30 : canvas.width - prev.w - 30,
        w: prev.w,
        dir,
        speed,
        colorIdx: stackLayers.length % DANGO_COLORS.length
      };
    }

    function handleStackAction() {
      if (stackOver || !stackRunning) {
        resetStack();
        return;
      }
      if (!stackMoving) return;

      const prev = stackLayers[stackLayers.length - 1];
      const curr = stackMoving;
      const diff = curr.x - prev.x;

      if (Math.abs(diff) <= 4) {
        stackCombo++;
        const bonusW = stackCombo >= 2 ? Math.min(150, prev.w + 6) : prev.w;
        const alignedX = prev.x - (bonusW - prev.w) / 2;
        stackLayers.push({ x: alignedX, w: bonusW, colorIdx: curr.colorIdx });
        stackFloors++;
        stackPerfectTimer = 28;
        spawnNextDango();
        return;
      }

      stackCombo = 0;
      const overlapLeft = Math.max(prev.x, curr.x);
      const overlapRight = Math.min(prev.x + prev.w, curr.x + curr.w);
      const overlapW = overlapRight - overlapLeft;

      if (overlapW <= 2) {
        stackSliced.push({
          x: curr.x,
          y: STACK_BASE_Y - stackLayers.length * STACK_BLOCK_H + stackCameraY,
          w: curr.w,
          vy: 0,
          colorIdx: curr.colorIdx
        });
        stackMoving = null;
        stackOver = true;
        if (stackFloors > stackBest) {
          stackBest = stackFloors;
          localStorage.setItem("nakhwaStackBest", String(stackBest));
        }
        if (stackFloors > 0) showSubmitBar();
        return;
      }

      const sliceW = curr.w - overlapW;
      const sliceX = diff < 0 ? curr.x : overlapRight;
      stackSliced.push({
        x: sliceX,
        y: STACK_BASE_Y - stackLayers.length * STACK_BLOCK_H + stackCameraY,
        w: sliceW,
        vy: 0,
        colorIdx: curr.colorIdx
      });

      stackLayers.push({ x: overlapLeft, w: overlapW, colorIdx: curr.colorIdx });
      stackFloors++;
      spawnNextDango();
    }

    /* ---------- 4. 낙화 닷지 (Dodge) 상태 ---------- */
    let dodgeRunning = false;
    let dodgeOver = false;
    let dodgeStartTime = 0;
    let dodgeElapsedMs = 0;
    let dodgeBestMs = Number(localStorage.getItem("nakhwaDodgeBest") || 0);
    let dodgeBullets = [];
    let dodgeSpawnTimer = 0;

    const dodgeShip = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      r: 5,
      speed: 3.4
    };

    const dodgeKeys = { up: false, down: false, left: false, right: false };
    let dodgePointerActive = false;
    let dodgeLastPointer = { x: 0, y: 0 };

    function spawnDodgeBullet() {
      const side = Math.floor(Math.random() * 4); // 0:상, 1:하, 2:좌, 3:우
      let x = 0, y = 0;
      if (side === 0) { x = Math.random() * canvas.width; y = -6; }
      else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 6; }
      else if (side === 2) { x = -6; y = Math.random() * canvas.height; }
      else { x = canvas.width + 6; y = Math.random() * canvas.height; }

      // 70% 확률로 플레이어 근처를 조준하고, 30%는 랜덤 각도로 날아옴
      let targetX = dodgeShip.x + (Math.random() - 0.5) * 90;
      let targetY = dodgeShip.y + (Math.random() - 0.5) * 90;
      if (Math.random() < 0.3) {
        targetX = Math.random() * canvas.width;
        targetY = Math.random() * canvas.height;
      }

      const angle = Math.atan2(targetY - y, targetX - x);
      const sec = dodgeElapsedMs / 1000;
      const speed = 1.6 + Math.random() * 1.4 + Math.min(2.2, sec * 0.06);

      dodgeBullets.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: 3.2,
        isPink: Math.random() < 0.35
      });
    }

    function resetDodge() {
      dodgeShip.x = canvas.width / 2;
      dodgeShip.y = canvas.height / 2;
      dodgeBullets = [];
      dodgeSpawnTimer = 0;
      dodgeElapsedMs = 0;
      dodgeStartTime = performance.now();
      dodgeOver = false;
      dodgeRunning = true;
      dodgePointerActive = false;
      hideSubmitBar();

      // 초기 탄환 14발 배치
      for (let i = 0; i < 14; i++) {
        spawnDodgeBullet();
      }
    }

    /* ---------- 공통 UI & 탭 전환 ---------- */
    function hideSubmitBar() {
      scoreSubmitBar.classList.remove("active");
      btnSubmitScore.disabled = false;
      btnSubmitScore.textContent = "기록 등록";
    }

    function showSubmitBar() {
      scoreSubmitBar.classList.add("active");
      btnSubmitScore.disabled = false;
      btnSubmitScore.textContent = "기록 등록";
    }

    function switchGameTab(game) {
      activeGame = game;
      clearTimeout(slashTimer);
      dodgePointerActive = false;
      hideSubmitBar();

      tabRunner.classList.toggle("active", game === "runner");
      tabSlash.classList.toggle("active", game === "slash");
      tabStack.classList.toggle("active", game === "stack");
      tabDodge.classList.toggle("active", game === "dodge");

      if (game === "runner") {
        easterHint.textContent = "화면 터치 또는 스페이스바(↑)로 점프!";
        rankingTitleEl.textContent = "🏆 낙화 러너 TOP 5";
        resetRunner();
      } else if (game === "slash") {
        easterHint.textContent = "'⚔️ 베기!!' 신호가 뜨는 순간 가장 빠르게 터치!";
        rankingTitleEl.textContent = "⚡ 낙화 발도술 TOP 5 (빠른 순)";
        initPetals();
        resetSlashToIdle();
      } else if (game === "stack") {
        easterHint.textContent = "타이밍 맞춰 터치! 중앙에 맞추면 PERFECT 🌸";
        rankingTitleEl.textContent = "🍡 경단 쌓기 TOP 5";
        resetStack();
      } else {
        easterHint.textContent = "드래그(모바일) 또는 방향키/WASD(PC)로 탄막 회피!";
        rankingTitleEl.textContent = "💥 낙화 닷지 TOP 5 (생존 시간)";
        resetDodge();
      }

      fetchLeaderboard();
    }

    tabRunner.addEventListener("click", () => switchGameTab("runner"));
    tabSlash.addEventListener("click", () => switchGameTab("slash"));
    tabStack.addEventListener("click", () => switchGameTab("stack"));
    tabDodge.addEventListener("click", () => switchGameTab("dodge"));

    function handleCanvasAction() {
      if (!easterModal.classList.contains("active")) return;
      if (document.activeElement === nickInput) return;

      if (activeGame === "runner") {
        if (runnerOver || !runnerRunning) {
          resetRunner();
          return;
        }
        if (player.grounded) {
          player.vy = player.jumpPower;
          player.grounded = false;
        }
      } else if (activeGame === "slash") {
        handleSlashAction();
      } else if (activeGame === "stack") {
        handleStackAction();
      } else if (activeGame === "dodge") {
        if (dodgeOver || !dodgeRunning) {
          resetDodge();
        }
      }
    }

    /* ---------- Firebase 랭킹 연동 ---------- */
    function getDbNode() {
      if (activeGame === "runner") return "runner_scores";
      if (activeGame === "slash") return "slash_scores";
      if (activeGame === "stack") return "stack_scores";
      return "dodge_scores";
    }

    async function fetchLeaderboard() {
      rankingStatusEl.textContent = "불러오는 중...";
      const dbNode = getDbNode();

      try {
        const res = await fetch(`${CONFIG.firebaseDbUrl}/${dbNode}.json`);
        if (!res.ok) throw new Error("랭킹 로드 실패");
        const data = (await res.json()) || {};

        const validEntries = Object.values(data).filter(
          item => item && typeof item.score === "number" && item.score > 0 && item.name
        );

        const sorted = validEntries
          .sort((a, b) => activeGame === "slash" ? (a.score - b.score) : (b.score - a.score))
          .slice(0, 5);

        rankingListEl.innerHTML = "";
        if (sorted.length === 0) {
          rankingStatusEl.textContent = "첫 기록의 주인공이 되어보세요!";
          return;
        }

        rankingStatusEl.textContent = "실시간 TOP 5";
        const medals = ["🥇", "🥈", "🥉", "4위", "5위"];

        sorted.forEach((entry, idx) => {
          const li = document.createElement("li");
          li.className = `ranking-item ${idx === 0 ? "top1" : ""}`;

          const left = document.createElement("div");
          left.className = "rank-left";
          left.innerHTML = `<span>${medals[idx]}</span>`;

          const nameSpan = document.createElement("span");
          nameSpan.className = "rank-name";
          nameSpan.textContent = entry.name;
          left.appendChild(nameSpan);

          const scoreSpan = document.createElement("span");
          scoreSpan.className = "rank-score";
          if (activeGame === "runner") {
            scoreSpan.textContent = `${entry.score}점`;
          } else if (activeGame === "slash") {
            scoreSpan.textContent = `${(entry.score / 1000).toFixed(3)}초`;
          } else if (activeGame === "stack") {
            scoreSpan.textContent = `${entry.score}층`;
          } else {
            scoreSpan.textContent = `${(entry.score / 1000).toFixed(2)}초`;
          }

          li.appendChild(left);
          li.appendChild(scoreSpan);
          rankingListEl.appendChild(li);
        });
      } catch (err) {
        rankingStatusEl.textContent = "랭킹 불러오기 실패";
        console.warn(err);
      }
    }

    async function submitScore() {
      const rawName = nickInput.value.trim();
      if (!rawName) {
        nickInput.focus();
        return;
      }

      let currentRecord = 0;
      if (activeGame === "runner") currentRecord = runnerLastScore;
      else if (activeGame === "slash") currentRecord = slashReactionMs;
      else if (activeGame === "stack") currentRecord = stackFloors;
      else currentRecord = dodgeElapsedMs;

      if (currentRecord <= 0) return;

      localStorage.setItem("nakhwaRunnerNick", rawName);
      btnSubmitScore.disabled = true;
      btnSubmitScore.textContent = "저장 중...";

      const dbNode = getDbNode();

      try {
        const safeKey = getSafeKey(rawName);
        const encodedKey = encodeURIComponent(safeKey);
        const url = `${CONFIG.firebaseDbUrl}/${dbNode}/${encodedKey}.json`;

        const existingRes = await fetch(url);
        const existingData = await existingRes.json();
        const prevScore = existingData && typeof existingData.score === "number" ? existingData.score : 0;

        const isNewRecord = activeGame === "slash"
          ? (prevScore === 0 || currentRecord < prevScore)
          : (currentRecord > prevScore);

        if (isNewRecord) {
          await fetch(url, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: rawName,
              score: currentRecord,
              updatedAt: Date.now()
            })
          });
          btnSubmitScore.textContent = "갱신 완료!";
        } else {
          let prevLabel = `${prevScore}점`;
          if (activeGame === "slash") prevLabel = `${(prevScore / 1000).toFixed(3)}초`;
          else if (activeGame === "stack") prevLabel = `${prevScore}층`;
          else if (activeGame === "dodge") prevLabel = `${(prevScore / 1000).toFixed(2)}초`;
          btnSubmitScore.textContent = `기존 최고 ${prevLabel}`;
        }

        await fetchLeaderboard();
      } catch (err) {
        btnSubmitScore.disabled = false;
        btnSubmitScore.textContent = "다시 시도";
        console.warn("점수 저장 실패:", err);
      }
    }

    btnSubmitScore.addEventListener("click", submitScore);
    nickInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        submitScore();
      }
    });

    function openEasterGame() {
      easterModal.classList.add("active");
      document.body.style.overflow = "hidden";
      switchGameTab(activeGame);
      if (!gameAnimId) gameLoop();
    }

    function closeEasterGame() {
      easterModal.classList.remove("active");
      document.body.style.overflow = "";
      runnerRunning = false;
      stackRunning = false;
      dodgeRunning = false;
      dodgePointerActive = false;
      clearTimeout(slashTimer);
      if (gameAnimId) {
        cancelAnimationFrame(gameAnimId);
        gameAnimId = null;
      }
    }

    btnCloseEaster.addEventListener("click", closeEasterGame);
    easterModal.addEventListener("click", (e) => {
      if (e.target === easterModal) closeEasterGame();
    });

    /* ---------- 캔버스 포인터 이벤트 (탭 + 닷지 상대 드래그 지원) ---------- */
    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (activeGame === "dodge" && dodgeRunning && !dodgeOver) {
        dodgePointerActive = true;
        const rect = canvas.getBoundingClientRect();
        dodgeLastPointer = {
          x: (e.clientX - rect.left) * (canvas.width / rect.width),
          y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
        return;
      }
      handleCanvasAction();
    });

    canvas.addEventListener("pointermove", (e) => {
      if (activeGame !== "dodge" || !dodgePointerActive || dodgeOver) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const curX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const curY = (e.clientY - rect.top) * (canvas.height / rect.height);

      const dx = curX - dodgeLastPointer.x;
      const dy = curY - dodgeLastPointer.y;
      dodgeLastPointer = { x: curX, y: curY };

      dodgeShip.x = Math.max(dodgeShip.r + 4, Math.min(canvas.width - dodgeShip.r - 4, dodgeShip.x + dx * 1.15));
      dodgeShip.y = Math.max(dodgeShip.r + 4, Math.min(canvas.height - dodgeShip.r - 4, dodgeShip.y + dy * 1.15));
    });

    window.addEventListener("pointerup", () => {
      dodgePointerActive = false;
    });

    /* ---------- 1. 러너 렌더링 ---------- */
    function drawRunnerFrame() {
      drawPetals(runnerRunning && !runnerOver);

      ctx.strokeStyle = "#343440";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      if (runnerRunning && !runnerOver) {
        runnerFrame++;
        runnerScore += 0.15;
        runnerSpeed = Math.min(9.5, 4.5 + runnerScore * 0.004);

        player.vy += player.gravity;
        player.y += player.vy;
        if (player.y >= GROUND_Y - player.h) {
          player.y = GROUND_Y - player.h;
          player.vy = 0;
          player.grounded = true;
        }

        const lastObs = obstacles[obstacles.length - 1];
        const minGap = 190 + Math.random() * 140;
        if (!lastObs || canvas.width - lastObs.x > minGap) {
          if (Math.random() < 0.04) {
            const isDouble = runnerScore > 80 && Math.random() < 0.35;
            const w = isDouble ? 30 : 18;
            const h = 22 + Math.floor(Math.random() * 10);
            obstacles.push({
              x: canvas.width + 10,
              y: GROUND_Y - h,
              w,
              h,
              type: isDouble ? "double" : "single"
            });
          }
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= runnerSpeed;

          const pad = 5;
          if (
            player.x + pad < obs.x + obs.w - pad &&
            player.x + player.w - pad > obs.x + pad &&
            player.y + pad < obs.y + obs.h &&
            player.y + player.h - 2 > obs.y + pad
          ) {
            runnerOver = true;
            runnerLastScore = Math.floor(runnerScore);
            if (runnerLastScore > runnerBest) {
              runnerBest = runnerLastScore;
              localStorage.setItem("nakhwaRunnerBest", String(runnerBest));
            }
            if (runnerLastScore > 0) showSubmitBar();
          }

          if (obs.x + obs.w < 0) obstacles.splice(i, 1);
        }
      }

      obstacles.forEach(obs => {
        ctx.fillStyle = "#e65c7b";
        ctx.beginPath();
        if (obs.type === "double") {
          ctx.moveTo(obs.x, GROUND_Y);
          ctx.lineTo(obs.x + obs.w * 0.25, obs.y);
          ctx.lineTo(obs.x + obs.w * 0.5, GROUND_Y);
          ctx.lineTo(obs.x + obs.w * 0.75, obs.y + 4);
          ctx.lineTo(obs.x + obs.w, GROUND_Y);
        } else {
          ctx.moveTo(obs.x, GROUND_Y);
          ctx.lineTo(obs.x + obs.w / 2, obs.y);
          ctx.lineTo(obs.x + obs.w, GROUND_Y);
        }
        ctx.closePath();
        ctx.fill();
      });

      const px = Math.round(player.x);
      const py = Math.round(player.y);
      ctx.fillStyle = "#ff9eb5";
      ctx.fillRect(px + 2, py + 4, 20, 20);
      ctx.fillRect(px + 4, py + 2, 16, 22);
      ctx.fillStyle = "#e65c7b";
      ctx.fillRect(px + 14, py, 6, 5);
      ctx.fillStyle = "#fff";
      ctx.fillRect(px + 16, py + 2, 2, 2);
      ctx.fillStyle = "#18181d";
      ctx.fillRect(px + 14, py + 10, 3, 4);
      ctx.fillRect(px + 19, py + 10, 3, 4);
      ctx.fillStyle = "#d94868";
      const step = runnerOver ? 0 : Math.floor(runnerFrame / 6) % 2;
      if (!player.grounded) {
        ctx.fillRect(px + 5, py + 24, 5, 4);
        ctx.fillRect(px + 14, py + 22, 5, 4);
      } else if (step === 0) {
        ctx.fillRect(px + 4, py + 24, 5, 4);
        ctx.fillRect(px + 14, py + 24, 5, 2);
      } else {
        ctx.fillRect(px + 4, py + 24, 5, 2);
        ctx.fillRect(px + 14, py + 24, 5, 4);
      }

      ctx.fillStyle = "#9898a6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(
        `BEST ${String(runnerBest).padStart(4, "0")}   SCORE ${String(Math.floor(runnerScore)).padStart(4, "0")}`,
        canvas.width - 14,
        24
      );

      if (runnerOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.68)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`GAME OVER · ${runnerLastScore}점 🌸`, canvas.width / 2, 92);
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("캔버스 터치 또는 스페이스바로 다시 달리기", canvas.width / 2, 118);
      }
    }

    /* ---------- 2. 발도술 렌더링 ---------- */
    function drawSamurai(x, y, facingRight, slashed) {
      ctx.save();
      ctx.translate(x, y);
      if (!facingRight) ctx.scale(-1, 1);

      ctx.fillStyle = facingRight ? "#ff9eb5" : "#9898a6";
      ctx.beginPath();
      ctx.moveTo(-16, -24);
      ctx.lineTo(0, -34);
      ctx.lineTo(16, -24);
      ctx.closePath();
      ctx.fill();

      ctx.fillRect(-7, -23, 14, 23);

      ctx.strokeStyle = slashed ? "#ffffff" : "#e65c7b";
      ctx.lineWidth = slashed ? 3 : 2;
      ctx.beginPath();
      if (slashed) {
        ctx.moveTo(8, -14);
        ctx.lineTo(38, -26);
      } else {
        ctx.moveTo(-4, -10);
        ctx.lineTo(16, -6);
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawSlashFrame() {
      if (slashState === "signal") {
        ctx.fillStyle = "rgba(230, 92, 123, 0.22)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      drawPetals(true);

      ctx.strokeStyle = "#343440";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      const isPlayerWin = slashState === "result";
      const isEnemyWin = slashState === "foul";
      drawSamurai(isPlayerWin ? 350 : 120, GROUND_Y, true, isPlayerWin);
      drawSamurai(isEnemyWin ? 130 : 360, GROUND_Y, false, isEnemyWin);

      if (slashFlashAlpha > 0.02) {
        ctx.strokeStyle = `rgba(255, 255, 255, ${slashFlashAlpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(40, GROUND_Y - 18);
        ctx.lineTo(canvas.width - 40, GROUND_Y - 22);
        ctx.stroke();
        slashFlashAlpha *= 0.88;
      }

      ctx.fillStyle = "#9898a6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "right";
      const bestText = slashBestMs > 0 ? `${(slashBestMs / 1000).toFixed(3)}초` : "--.---";
      ctx.fillText(`MY BEST ${bestText}`, canvas.width - 14, 24);

      ctx.textAlign = "center";
      if (slashState === "idle") {
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 17px sans-serif";
        ctx.fillText("⚔️ 낙화 발도술 승부", canvas.width / 2, 78);
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("화면 터치 또는 스페이스바로 대결 시작", canvas.width / 2, 104);
      } else if (slashState === "waiting") {
        ctx.fillStyle = "#9898a6";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText("기다려...", canvas.width / 2, 88);
      } else if (slashState === "signal") {
        ctx.fillStyle = "#ff5e84";
        ctx.font = "900 30px sans-serif";
        ctx.fillText("⚔️ 베기!!", canvas.width / 2, 92);
      } else if (slashState === "foul") {
        ctx.fillStyle = "#ff6b6b";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText("🚫 너무 빨랐습니다! (부정출발)", canvas.width / 2, 78);
        ctx.fillStyle = "#9898a6";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("터치하여 재도전", canvas.width / 2, 104);
      } else if (slashState === "result") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 24px sans-serif";
        ctx.fillText(`⚡ ${(slashReactionMs / 1000).toFixed(3)}초 (${slashReactionMs}ms)`, canvas.width / 2, 78);
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("터치하여 다시 대결하기", canvas.width / 2, 104);
      }
    }

    /* ---------- 3. 경단 쌓기 렌더링 ---------- */
    function drawDangoBlock(x, y, w, h, colorIdx) {
      const palette = DANGO_COLORS[colorIdx % DANGO_COLORS.length];
      const r = Math.min(8, h / 2, w / 2);

      ctx.fillStyle = palette.fill;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();

      ctx.strokeStyle = palette.stroke;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (w > 16) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
        ctx.fillRect(x + 6, y + 3, Math.max(4, w - 12), 2.5);
      }
    }

    function drawStackFrame() {
      drawPetals(true);

      const targetCam = Math.max(0, (stackLayers.length - 5) * STACK_BLOCK_H);
      stackCameraY += (targetCam - stackCameraY) * 0.15;

      const skewerBottom = STACK_BASE_Y + stackCameraY + 12;
      ctx.strokeStyle = "#8c6d53";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 18);
      ctx.lineTo(canvas.width / 2, Math.min(canvas.height, skewerBottom));
      ctx.stroke();

      stackLayers.forEach((layer, idx) => {
        const y = STACK_BASE_Y - (idx + 1) * STACK_BLOCK_H + stackCameraY;
        if (y > canvas.height + 20) return;
        drawDangoBlock(layer.x, y, layer.w, STACK_BLOCK_H - 1, layer.colorIdx);
      });

      if (stackRunning && !stackOver && stackMoving) {
        stackMoving.x += stackMoving.dir * stackMoving.speed;
        if (stackMoving.x <= 16) {
          stackMoving.x = 16;
          stackMoving.dir = 1;
        } else if (stackMoving.x + stackMoving.w >= canvas.width - 16) {
          stackMoving.x = canvas.width - 16 - stackMoving.w;
          stackMoving.dir = -1;
        }

        const moveY = STACK_BASE_Y - (stackLayers.length + 1) * STACK_BLOCK_H + stackCameraY;
        drawDangoBlock(stackMoving.x, moveY, stackMoving.w, STACK_BLOCK_H - 1, stackMoving.colorIdx);
      }

      for (let i = stackSliced.length - 1; i >= 0; i--) {
        const s = stackSliced[i];
        s.vy += 0.45;
        s.y += s.vy;
        drawDangoBlock(s.x, s.y, s.w, STACK_BLOCK_H - 1, s.colorIdx);
        if (s.y > canvas.height + 30) stackSliced.splice(i, 1);
      }

      if (stackPerfectTimer > 0) {
        stackPerfectTimer--;
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "900 15px sans-serif";
        ctx.textAlign = "center";
        const label = stackCombo >= 2 ? `✨ PERFECT x${stackCombo}! (+폭 회복)` : "✨ PERFECT!";
        ctx.fillText(label, canvas.width / 2, 42);
      }

      ctx.fillStyle = "#9898a6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(`BEST ${stackBest}층   현재 ${stackFloors}층`, canvas.width - 14, 24);

      if (stackOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.72)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`🍡 경단 탑 완성 · ${stackFloors}층!`, canvas.width / 2, 92);
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("캔버스 터치 또는 스페이스바로 다시 쌓기", canvas.width / 2, 118);
      }
    }

    /* ---------- 4. 낙화 닷지 (Dodge) 렌더링 ---------- */
    function drawDodgeFrame() {
      // 미세 격자 배경
      ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 32) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      if (dodgeRunning && !dodgeOver) {
        dodgeElapsedMs = Math.floor(performance.now() - dodgeStartTime);

        // PC 키보드 이동 처리
        let mx = 0, my = 0;
        if (dodgeKeys.left) mx -= 1;
        if (dodgeKeys.right) mx += 1;
        if (dodgeKeys.up) my -= 1;
        if (dodgeKeys.down) my += 1;
        if (mx !== 0 || my !== 0) {
          const len = Math.hypot(mx, my);
          dodgeShip.x += (mx / len) * dodgeShip.speed;
          dodgeShip.y += (my / len) * dodgeShip.speed;
          dodgeShip.x = Math.max(dodgeShip.r + 4, Math.min(canvas.width - dodgeShip.r - 4, dodgeShip.x));
          dodgeShip.y = Math.max(dodgeShip.r + 4, Math.min(canvas.height - dodgeShip.r - 4, dodgeShip.y));
        }

        // 시간에 따라 탄환 개수 점진 증가
        const targetCount = Math.min(65, 16 + Math.floor(dodgeElapsedMs / 650));
        dodgeSpawnTimer++;
        if (dodgeBullets.length < targetCount && dodgeSpawnTimer % 4 === 0) {
          spawnDodgeBullet();
        }

        // 탄환 이동 및 충돌 판정
        for (let i = dodgeBullets.length - 1; i >= 0; i--) {
          const b = dodgeBullets[i];
          b.x += b.vx;
          b.y += b.vy;

          const dist = Math.hypot(b.x - dodgeShip.x, b.y - dodgeShip.y);
          if (dist < b.r + dodgeShip.r - 1.2) {
            dodgeOver = true;
            if (dodgeElapsedMs > dodgeBestMs) {
              dodgeBestMs = dodgeElapsedMs;
              localStorage.setItem("nakhwaDodgeBest", String(dodgeBestMs));
            }
            if (dodgeElapsedMs > 0) showSubmitBar();
            break;
          }

          // 화면 밖으로 벗어난 탄환 제거 후 즉시 리스폰
          if (b.x < -16 || b.x > canvas.width + 16 || b.y < -16 || b.y > canvas.height + 16) {
            dodgeBullets.splice(i, 1);
            spawnDodgeBullet();
          }
        }
      }

      // 탄환 그리기
      dodgeBullets.forEach(b => {
        ctx.fillStyle = b.isPink ? "#ff7999" : "#ffd166";
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // 기체(플레이어) 그리기
      ctx.save();
      ctx.translate(dodgeShip.x, dodgeShip.y);
      // 외곽 아우라
      ctx.fillStyle = "rgba(230, 92, 123, 0.28)";
      ctx.beginPath();
      ctx.arc(0, 0, dodgeShip.r + 5, 0, Math.PI * 2);
      ctx.fill();

      // 기체 본체
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(7, 7);
      ctx.lineTo(0, 4);
      ctx.lineTo(-7, 7);
      ctx.closePath();
      ctx.fill();

      // 중앙 피격 코어 점
      ctx.fillStyle = "#e65c7b";
      ctx.beginPath();
      ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 우측 상단 생존 시간 UI
      ctx.fillStyle = "#9898a6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "right";
      const bestSec = (dodgeBestMs / 1000).toFixed(2);
      const curSec = (dodgeElapsedMs / 1000).toFixed(2);
      ctx.fillText(`BEST ${bestSec}초   생존 ${curSec}초`, canvas.width - 14, 24);

      if (dodgeOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.72)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`💥 피격! 생존 기록 ${(dodgeElapsedMs / 1000).toFixed(2)}초`, canvas.width / 2, 92);
        ctx.fillStyle = "#ff8ca5";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("캔버스 터치 또는 스페이스바로 다시 도전", canvas.width / 2, 118);
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (activeGame === "runner") {
        drawRunnerFrame();
      } else if (activeGame === "slash") {
        drawSlashFrame();
      } else if (activeGame === "stack") {
        drawStackFrame();
      } else {
        drawDodgeFrame();
      }

      if (easterModal.classList.contains("active")) {
        gameAnimId = requestAnimationFrame(gameLoop);
      }
    }

    /* ---------- 키보드 입력 처리 ---------- */
    document.addEventListener("keydown", (e) => {
      if (easterModal.classList.contains("active")) {
        if (document.activeElement === nickInput) {
          if (e.key === "Escape") nickInput.blur();
          return;
        }

        if (activeGame === "dodge") {
          if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") { e.preventDefault(); dodgeKeys.up = true; }
          if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { e.preventDefault(); dodgeKeys.down = true; }
          if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { e.preventDefault(); dodgeKeys.left = true; }
          if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { e.preventDefault(); dodgeKeys.right = true; }
        }

        if (e.code === "Space" || (activeGame !== "dodge" && e.key === "ArrowUp")) {
          e.preventDefault();
          handleCanvasAction();
        } else if (e.key === "Escape") {
          closeEasterGame();
        }
        return;
      }

      if (!overlayEl.classList.contains("active")) return;
      if (e.key === "ArrowLeft" && currentEpisodeIndex > 0) {
        currentEpisodeIndex--;
        updateViewer();
      } else if (e.key === "ArrowRight" && currentEpisodeIndex < episodes.length - 1) {
        currentEpisodeIndex++;
        updateViewer();
      } else if (e.key === "Escape") {
        closeViewer();
      }
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") dodgeKeys.up = false;
      if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") dodgeKeys.down = false;
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") dodgeKeys.left = false;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") dodgeKeys.right = false;
    });

    loadEpisodes();
  </script>
</body>
</html>
