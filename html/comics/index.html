<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>4컷 웹툰 아카이브 | nakhwa-archive</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="4컷 웹툰 아카이브 | nakhwa-archive" />
  <meta property="og:description" content="메이븐 길드 [낙화] 4컷 만화 모음집입니다." />
  <meta property="og:image" content="https://nakhwa-archive.github.io/html/comics/thumbnail.jpg" />
  <meta property="og:url" content="https://nakhwa-archive.github.io/html/comics/" />

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #1a1a1f;
      --card-hover: #24242b;
      --text-main: #f4f4f6;
      --text-sub: #9898a6;
      --accent: #e65c7b;
      --border: #282830;
      --bar-bg: rgba(18, 18, 22, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      line-height: 1.4;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bar-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    header h1 {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .episode-count {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
      background: rgba(230, 92, 123, 0.14);
      padding: 3px 7px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .sort-btn {
      background: #18181d;
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 9px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .sort-btn:active {
      transform: scale(0.95);
      border-color: var(--accent);
    }

    .view-toggle {
      display: flex;
      background: #18181d;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      flex-shrink: 0;
    }

    .toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .toggle-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 12px;
    }

    .promo-banner {
      width: 100%;
      margin-bottom: 12px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--card-bg);
    }

    .promo-banner img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* 첫화 / 마지막화 바로보기 바 */
    .quick-read-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .quick-btn {
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .quick-btn.latest {
      background: rgba(230, 92, 123, 0.15);
      border-color: rgba(230, 92, 123, 0.45);
      color: #ff8ca5;
    }

    .quick-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .quick-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .status-msg {
      text-align: center;
      padding: 80px 16px;
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* 1. 그리드 보기 */
    .episode-container.grid-view {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 540px) {
      .episode-container.grid-view {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    .grid-view .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease;
      display: flex;
      flex-direction: column;
    }

    .grid-view .card:active {
      transform: scale(0.97);
      border-color: var(--accent);
    }

    .grid-view .thumb-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #09090b;
    }

    .grid-view .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .grid-view .card-info {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .grid-view .card-num {
      display: none;
    }

    .grid-view .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 2. 리스트 보기 */
    .episode-container.list-view {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .list-view .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px 8px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.12s ease, border-color 0.12s ease;
    }

    .list-view .card:active {
      background: var(--card-hover);
      border-color: var(--accent);
    }

    .list-view .thumb-wrap {
      width: 54px;
      height: 54px;
      border-radius: 7px;
      overflow: hidden;
      background: #09090b;
      flex-shrink: 0;
    }

    .list-view .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .list-view .card-info {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .list-view .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .list-view .card-num {
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    /* 카드 좋아요 뱃지 */
    .card-like-badge {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .card-like-badge.liked {
      color: var(--accent);
    }

    /* 페이지네이션 */
    .pagination {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .page-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
    }

    .page-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* 푸터 */
    .guild-footer {
      margin-top: 28px;
      padding: 18px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }

    .scroll-top-btn {
      width: 38px;
      height: 38px;
      margin: 0 auto 10px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #24242b;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .guild-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
      cursor: pointer;
      user-select: none;
      display: inline-block;
      transition: transform 0.1s ease;
    }

    .guild-title:active {
      transform: scale(0.95);
    }

    .guild-title .accent {
      color: var(--accent);
    }

    .guild-sub {
      font-size: 0.86rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* 뷰어 */
    .viewer-overlay {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 1000;
      display: none;
      flex-direction: column;
    }

    .viewer-overlay.active {
      display: flex;
    }

    .viewer-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1010;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      background: var(--bar-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.22s ease, opacity 0.22s ease;
    }

    .viewer-title {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 12px;
    }

    .page-badge {
      font-size: 0.8rem;
      color: var(--text-sub);
      flex-shrink: 0;
    }

    .viewer-body {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: calc(64px + env(safe-area-inset-top)) 0 calc(84px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .viewer-body img {
      width: 100%;
      max-width: 600px;
      height: auto;
      display: block;
      user-select: none;
    }

    /* 뷰어 하단 4버튼 레이아웃 (이전 / 좋아요 / 닫기 / 다음) */
    .viewer-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1010;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: var(--bar-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1.1fr 0.9fr 1fr;
      gap: 6px;
      transition: transform 0.22s ease, opacity 0.22s ease;
    }

    .ctrl-btn {
      height: 46px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #222228;
      color: var(--text-main);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .ctrl-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .ctrl-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-like.liked {
      background: rgba(230, 92, 123, 0.18);
      border-color: var(--accent);
      color: var(--accent);
    }

    @keyframes heartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    .btn-like.pop {
      animation: heartPop 0.28s ease;
    }

    .btn-close-center {
      background: #2c2c35;
      color: #fff;
    }

    .viewer-overlay.ui-hidden .viewer-header {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .viewer-overlay.ui-hidden .viewer-footer {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }

    /* 이스터에그 미니게임 모달 */
    .easter-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.86);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .easter-modal.active {
      display: flex;
    }

    .easter-box {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 36px rgba(230, 92, 123, 0.25);
    }

    .easter-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .easter-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .easter-title span {
      color: var(--accent);
    }

    .easter-close {
      background: #26262e;
      border: 1px solid var(--border);
      color: var(--text-sub);
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    #runnerCanvas {
      width: 100%;
      height: 190px;
      background: #121216;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: block;
      touch-action: manipulation;
      cursor: pointer;
    }

    .easter-hint {
      margin-top: 8px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    /* 점수 등록 바 (게임 오버 시 노출) */
    .score-submit-bar {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #141418;
      border: 1px solid rgba(230, 92, 123, 0.45);
      border-radius: 10px;
      gap: 6px;
      align-items: center;
    }

    .score-submit-bar.active {
      display: flex;
    }

    .nick-input {
      flex: 1;
      min-width: 0;
      height: 36px;
      background: #1e1e24;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    .nick-input:focus {
      border-color: var(--accent);
    }

    .submit-score-btn {
      height: 36px;
      padding: 0 14px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .submit-score-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 실시간 랭킹 보드 */
    .ranking-board {
      margin-top: 12px;
      background: #141418;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .ranking-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .ranking-status {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-sub);
    }

    .ranking-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      padding: 4px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
    }

    .ranking-item.top1 {
      background: rgba(230, 92, 123, 0.14);
      color: #ff9eb5;
      font-weight: 700;
    }

    .rank-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .rank-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-score {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>4컷 만화</h1>
      <span class="episode-count" id="episodeCount">로딩중</span>
    </div>

    <div class="header-controls">
      <button type="button" class="sort-btn" id="btnSortToggle" aria-label="정렬 기준 변경">⇅ 최신순</button>

      <div class="view-toggle" role="group" aria-label="목록 보기 방식">
        <button type="button" class="toggle-btn active" id="btnGridView">⊞ 썸네일</button>
        <button type="button" class="toggle-btn" id="btnListView">☰ 리스트</button>
      </div>
    </div>
  </header>

  <main>
    <div class="promo-banner" id="promoBanner">
      <img src="./banner.png" alt="메이븐 길드 낙화 홍보 배너" onerror="document.getElementById('promoBanner').style.display='none';" />
    </div>

    <div class="quick-read-bar">
      <button type="button" class="quick-btn" id="btnFirstEp" disabled>⏮ 첫화 보기</button>
      <button type="button" class="quick-btn latest" id="btnLatestEp" disabled>🔥 마지막화 보기</button>
    </div>

    <div id="statusMsg" class="status-msg">목록을 불러오는 중입니다...</div>
    <div id="episodeContainer" class="episode-container grid-view"></div>
    <nav id="pagination" class="pagination" aria-label="페이지 이동"></nav>

    <footer class="guild-footer">
      <button type="button" class="scroll-top-btn" id="btnScrollTop" aria-label="맨 위로 이동">▲</button>
      <p class="guild-title" id="secretTrigger">⚔️ 메이븐 길드 <span class="accent">[낙화]</span></p>
      <p class="guild-sub">길드장 김정환 · 가입 문의 환영 🌸</p>
    </footer>
  </main>

  <div id="viewerOverlay" class="viewer-overlay" role="dialog" aria-modal="true">
    <div class="viewer-header">
      <div class="viewer-title" id="viewerTitle">제목</div>
      <div class="page-badge" id="pageIndicator">1 / 1</div>
    </div>

    <div class="viewer-body" id="viewerBody">
      <img id="viewerImg" src="" alt="4컷 만화" />
    </div>

    <div class="viewer-footer">
      <button type="button" class="ctrl-btn" id="btnPrev">◀ 이전</button>
      <button type="button" class="ctrl-btn btn-like" id="btnLike">
        <span id="likeIcon">🤍</span>
        <span id="likeCount">0</span>
      </button>
      <button type="button" class="ctrl-btn btn-close-center" id="btnClose">닫기</button>
      <button type="button" class="ctrl-btn" id="btnNext">다음 ▶</button>
    </div>
  </div>

  <!-- 이스터에그 러너 게임 모달 -->
  <div id="easterModal" class="easter-modal" role="dialog" aria-modal="true">
    <div class="easter-box">
      <div class="easter-top">
        <div class="easter-title">🌸 비밀 미니게임 · <span>낙화 러너</span></div>
        <button type="button" class="easter-close" id="btnCloseEaster" aria-label="게임 닫기">✕</button>
      </div>
      <canvas id="runnerCanvas" width="480" height="190"></canvas>
      <p class="easter-hint">화면 터치 또는 스페이스바(↑)로 점프!</p>

      <!-- 게임 오버 시 점수 등록 바 -->
      <div class="score-submit-bar" id="scoreSubmitBar">
        <input type="text" id="nickInput" class="nick-input" maxlength="10" placeholder="길드원 닉네임 (최대 10자)" />
        <button type="button" id="btnSubmitScore" class="submit-score-btn">기록 등록</button>
      </div>

      <!-- 실시간 TOP 5 랭킹 -->
      <div class="ranking-board">
        <div class="ranking-header">
          <span>🏆 명예의 전당 TOP 5</span>
          <span class="ranking-status" id="rankingStatus">불러오는 중...</span>
        </div>
        <ul class="ranking-list" id="rankingList"></ul>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      owner: "nakhwa-archive",
      repo: "nakhwa-archive.github.io",
      folderPath: "html/comics/images",
      itemsPerPage: 20,
      firebaseDbUrl: "https://nakhwa-a90f6-default-rtdb.firebaseio.com"
    };

    let episodes = [];
    let likesData = {};
    let myLikedMap = JSON.parse(localStorage.getItem("nakhwaMyLikes") || "{}");
    let currentEpisodeIndex = 0;
    let currentPage = 1;
    let viewMode = localStorage.getItem("comicViewMode") || "grid";
    let sortOrder = localStorage.getItem("comicSortOrder") || "latest";

    const containerEl = document.getElementById("episodeContainer");
    const paginationEl = document.getElementById("pagination");
    const statusEl = document.getElementById("statusMsg");
    const countEl = document.getElementById("episodeCount");

    const btnSortToggle = document.getElementById("btnSortToggle");
    const btnGridView = document.getElementById("btnGridView");
    const btnListView = document.getElementById("btnListView");
    const btnFirstEp = document.getElementById("btnFirstEp");
    const btnLatestEp = document.getElementById("btnLatestEp");
    const btnScrollTop = document.getElementById("btnScrollTop");

    const overlayEl = document.getElementById("viewerOverlay");
    const viewerBodyEl = document.getElementById("viewerBody");
    const viewerTitleEl = document.getElementById("viewerTitle");
    const viewerImgEl = document.getElementById("viewerImg");
    const pageIndicatorEl = document.getElementById("pageIndicator");
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const btnClose = document.getElementById("btnClose");
    const btnLike = document.getElementById("btnLike");
    const likeIconEl = document.getElementById("likeIcon");
    const likeCountEl = document.getElementById("likeCount");

    btnScrollTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    function updateSortButtonUI() {
      btnSortToggle.textContent = sortOrder === "latest" ? "⇅ 최신순" : "⇅ 첫화순";
    }

    btnSortToggle.addEventListener("click", () => {
      sortOrder = sortOrder === "latest" ? "oldest" : "latest";
      localStorage.setItem("comicSortOrder", sortOrder);
      updateSortButtonUI();
      renderPage(1, false);
    });
    updateSortButtonUI();

    function applyViewMode(mode) {
      viewMode = mode;
      localStorage.setItem("comicViewMode", mode);
      if (mode === "grid") {
        containerEl.className = "episode-container grid-view";
        btnGridView.classList.add("active");
        btnListView.classList.remove("active");
      } else {
        containerEl.className = "episode-container list-view";
        btnListView.classList.add("active");
        btnGridView.classList.remove("active");
      }
    }

    btnGridView.addEventListener("click", () => applyViewMode("grid"));
    btnListView.addEventListener("click", () => applyViewMode("list"));
    applyViewMode(viewMode);

    btnFirstEp.addEventListener("click", () => {
      if (episodes.length > 0) openViewer(0);
    });

    btnLatestEp.addEventListener("click", () => {
      if (episodes.length > 0) openViewer(episodes.length - 1);
    });

    function formatTitle(filename) {
      return filename.replace(/\.[^/.]+$/, "");
    }

    function getSafeKey(title) {
      return title.replace(/[.#$\[\]\/]/g, "_");
    }

    function getSortedEpisodes() {
      if (sortOrder === "latest") {
        return [...episodes].reverse();
      }
      return episodes;
    }

    async function fetchAllLikes() {
      try {
        const res = await fetch(`${CONFIG.firebaseDbUrl}/likes.json`);
        if (res.ok) {
          const data = await res.json();
          likesData = data || {};
        }
      } catch (e) {
        console.warn("좋아요 데이터 로드 실패:", e);
      }
    }

    async function toggleLike() {
      const ep = episodes[currentEpisodeIndex];
      if (!ep) return;

      const key = getSafeKey(ep.title);
      const isLiked = !!myLikedMap[key];
      const currentCount = likesData[key] || 0;
      const nextCount = isLiked ? Math.max(0, currentCount - 1) : currentCount + 1;

      if (isLiked) {
        delete myLikedMap[key];
      } else {
        myLikedMap[key] = true;
        btnLike.classList.remove("pop");
        void btnLike.offsetWidth;
        btnLike.classList.add("pop");
      }
      localStorage.setItem("nakhwaMyLikes", JSON.stringify(myLikedMap));
      likesData[key] = nextCount;
      updateLikeButtonUI(key);

      try {
        const encodedKey = encodeURIComponent(key);
        const res = await fetch(`${CONFIG.firebaseDbUrl}/likes/${encodedKey}.json`);
        const serverVal = (await res.json()) || 0;
        const updatedVal = isLiked ? Math.max(0, serverVal - 1) : serverVal + 1;

        await fetch(`${CONFIG.firebaseDbUrl}/likes/${encodedKey}.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updatedVal)
        });

        likesData[key] = updatedVal;
        updateLikeButtonUI(key);
      } catch (e) {
        console.warn("좋아요 저장 실패:", e);
      }
    }

    function updateLikeButtonUI(key) {
      const isLiked = !!myLikedMap[key];
      const count = likesData[key] || 0;
      btnLike.classList.toggle("liked", isLiked);
      likeIconEl.textContent = isLiked ? "❤️" : "🤍";
      likeCountEl.textContent = count;
    }

    btnLike.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleLike();
    });

    async function loadEpisodes() {
      const apiUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.folderPath}`;

      try {
        const [filesRes] = await Promise.all([
          fetch(apiUrl),
          fetchAllLikes()
        ]);

        if (!filesRes.ok) throw new Error(`HTTP ${filesRes.status}`);

        const files = await filesRes.json();
        const imageRegex = /\.(png|jpe?g|gif|webp)$/i;

        episodes = files
          .filter(file => file.type === "file" && imageRegex.test(file.name))
          .sort((a, b) => formatTitle(a.name).localeCompare(formatTitle(b.name), "ko", { numeric: true }))
          .map((file, index) => ({
            epNumber: index + 1,
            originalIndex: index,
            title: formatTitle(file.name),
            url: file.download_url
          }));

        if (episodes.length > 0) {
          btnFirstEp.disabled = false;
          btnLatestEp.disabled = false;
        }

        renderPage(1, false);
      } catch (err) {
        statusEl.textContent = "이미지를 불러오지 못했습니다. 폴더 경로와 저장소 공개 여부를 확인해 주세요.";
        countEl.textContent = "0화";
        console.error(err);
      }
    }

    function renderPage(page, shouldScrollTop = true) {
      if (episodes.length === 0) {
        statusEl.textContent = "등록된 4컷 만화가 없습니다.";
        countEl.textContent = "0화";
        paginationEl.innerHTML = "";
        return;
      }

      statusEl.style.display = "none";
      countEl.textContent = `총 ${episodes.length}화`;

      const displayList = getSortedEpisodes();
      const totalPages = Math.ceil(displayList.length / CONFIG.itemsPerPage);
      currentPage = Math.max(1, Math.min(page, totalPages));

      const startIndex = (currentPage - 1) * CONFIG.itemsPerPage;
      const endIndex = startIndex + CONFIG.itemsPerPage;
      const pageItems = displayList.slice(startIndex, endIndex);

      containerEl.innerHTML = "";

      pageItems.forEach((ep) => {
        const key = getSafeKey(ep.title);
        const likeCount = likesData[key] || 0;
        const isLiked = !!myLikedMap[key];

        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="thumb-wrap">
            <img src="${ep.url}" alt="${ep.title}" loading="lazy" />
          </div>
          <div class="card-info">
            <div class="card-title">${ep.title}</div>
            <div class="list-meta">
              <span class="card-like-badge ${isLiked ? "liked" : ""}">
                ${isLiked ? "❤️" : "🤍"} ${likeCount}
              </span>
              <span class="card-num">#${ep.epNumber}</span>
            </div>
          </div>
        `;
        card.addEventListener("click", () => openViewer(ep.originalIndex));
        containerEl.appendChild(card);
      });

      renderPagination(totalPages);

      if (shouldScrollTop) {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function renderPagination(totalPages) {
      paginationEl.innerHTML = "";
      if (totalPages <= 1) return;

      const prevPageBtn = document.createElement("button");
      prevPageBtn.type = "button";
      prevPageBtn.className = "page-btn";
      prevPageBtn.textContent = "◀";
      prevPageBtn.disabled = currentPage === 1;
      prevPageBtn.addEventListener("click", () => renderPage(currentPage - 1));
      paginationEl.appendChild(prevPageBtn);

      const maxVisible = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
      let endPage = Math.min(totalPages, startPage + maxVisible - 1);
      if (endPage - startPage + 1 < maxVisible) {
        startPage = Math.max(1, endPage - maxVisible + 1);
      }

      for (let i = startPage; i <= endPage; i++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `page-btn ${i === currentPage ? "active" : ""}`;
        btn.textContent = i;
        btn.addEventListener("click", () => renderPage(i));
        paginationEl.appendChild(btn);
      }

      const nextPageBtn = document.createElement("button");
      nextPageBtn.type = "button";
      nextPageBtn.className = "page-btn";
      nextPageBtn.textContent = "▶";
      nextPageBtn.disabled = currentPage === totalPages;
      nextPageBtn.addEventListener("click", () => renderPage(currentPage + 1));
      paginationEl.appendChild(nextPageBtn);
    }

    function openViewer(index) {
      currentEpisodeIndex = index;
      overlayEl.classList.remove("ui-hidden");
      updateViewer();
      overlayEl.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeViewer() {
      overlayEl.classList.remove("active");
      document.body.style.overflow = "";

      const displayIndex = sortOrder === "latest"
        ? (episodes.length - 1 - currentEpisodeIndex)
        : currentEpisodeIndex;
      const targetPage = Math.floor(displayIndex / CONFIG.itemsPerPage) + 1;
      renderPage(targetPage, false);
    }

    function updateViewer() {
      const ep = episodes[currentEpisodeIndex];
      viewerTitleEl.textContent = ep.title;
      viewerImgEl.src = ep.url;
      viewerImgEl.alt = ep.title;
      pageIndicatorEl.textContent = `${currentEpisodeIndex + 1} / ${episodes.length}`;

      updateLikeButtonUI(getSafeKey(ep.title));

      viewerBodyEl.scrollTop = 0;
      btnPrev.disabled = currentEpisodeIndex === 0;
      btnNext.disabled = currentEpisodeIndex === episodes.length - 1;
    }

    btnPrev.addEventListener("click", (e) => {
      e.stopPropagation();
      if (currentEpisodeIndex > 0) {
        currentEpisodeIndex--;
        updateViewer();
      }
    });

    btnNext.addEventListener("click", (e) => {
      e.stopPropagation();
      if (currentEpisodeIndex < episodes.length - 1) {
        currentEpisodeIndex++;
        updateViewer();
      }
    });

    btnClose.addEventListener("click", (e) => {
      e.stopPropagation();
      closeViewer();
    });

    let touchStartX = 0, touchStartY = 0;
    viewerBodyEl.addEventListener("touchstart", (e) => {
      if (e.touches.length > 1) return;
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    viewerBodyEl.addEventListener("touchend", (e) => {
      if (e.touches.length > 0) return;
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
        if (diffX < 0 && currentEpisodeIndex < episodes.length - 1) {
          currentEpisodeIndex++;
          updateViewer();
        } else if (diffX > 0 && currentEpisodeIndex > 0) {
          currentEpisodeIndex--;
          updateViewer();
        }
      }
    }, { passive: true });

    viewerBodyEl.addEventListener("click", () => {
      overlayEl.classList.toggle("ui-hidden");
    });

    /* ==========================================
       이스터에그: 낙화 러너 게임 + Firebase 랭킹
       ========================================== */
    const secretTrigger = document.getElementById("secretTrigger");
    const easterModal = document.getElementById("easterModal");
    const btnCloseEaster = document.getElementById("btnCloseEaster");
    const canvas = document.getElementById("runnerCanvas");
    const ctx = canvas.getContext("2d");

    const scoreSubmitBar = document.getElementById("scoreSubmitBar");
    const nickInput = document.getElementById("nickInput");
    const btnSubmitScore = document.getElementById("btnSubmitScore");
    const rankingListEl = document.getElementById("rankingList");
    const rankingStatusEl = document.getElementById("rankingStatus");

    // 저장된 닉네임 복원
    nickInput.value = localStorage.getItem("nakhwaRunnerNick") || "";

    let secretTapCount = 0;
    let secretTapTimer = null;

    secretTrigger.addEventListener("click", () => {
      secretTapCount++;
      clearTimeout(secretTapTimer);
      secretTapTimer = setTimeout(() => { secretTapCount = 0; }, 1500);

      if (secretTapCount >= 5) {
        secretTapCount = 0;
        openEasterGame();
      }
    });

    let gameAnimId = null;
    let isGameRunning = false;
    let isGameOver = false;
    let score = 0;
    let lastRunScore = 0;
    let highScore = Number(localStorage.getItem("nakhwaRunnerBest") || 0);
    let gameSpeed = 4.5;
    let frameCount = 0;

    const GROUND_Y = 158;
    const player = {
      x: 48,
      y: GROUND_Y - 28,
      w: 24,
      h: 28,
      vy: 0,
      gravity: 0.62,
      jumpPower: -10.8,
      grounded: true
    };

    let obstacles = [];
    let petals = [];

    function initPetals() {
      petals = Array.from({ length: 14 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * GROUND_Y,
        r: 2 + Math.random() * 2.5,
        vx: -(0.6 + Math.random() * 1.2),
        vy: 0.4 + Math.random() * 0.8
      }));
    }

    function resetGame() {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.grounded = true;
      obstacles = [];
      score = 0;
      gameSpeed = 4.5;
      frameCount = 0;
      isGameOver = false;
      isGameRunning = true;
      scoreSubmitBar.classList.remove("active");
      btnSubmitScore.disabled = false;
      btnSubmitScore.textContent = "기록 등록";
      initPetals();
    }

    function jump() {
      if (!easterModal.classList.contains("active")) return;
      if (document.activeElement === nickInput) return;

      if (isGameOver || !isGameRunning) {
        resetGame();
        return;
      }
      if (player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
      }
    }

    async function fetchLeaderboard() {
      rankingStatusEl.textContent = "불러오는 중...";
      try {
        const res = await fetch(`${CONFIG.firebaseDbUrl}/runner_scores.json`);
        if (!res.ok) throw new Error("랭킹 로드 실패");
        const data = (await res.json()) || {};

        const sorted = Object.values(data)
          .filter(item => item && typeof item.score === "number" && item.name)
          .sort((a, b) => b.score - a.score)
          .slice(0, 5);

        rankingListEl.innerHTML = "";
        if (sorted.length === 0) {
          rankingStatusEl.textContent = "첫 기록의 주인공이 되어보세요!";
          return;
        }

        rankingStatusEl.textContent = "실시간 TOP 5";
        const medals = ["🥇", "🥈", "🥉", "4위", "5위"];

        sorted.forEach((entry, idx) => {
          const li = document.createElement("li");
          li.className = `ranking-item ${idx === 0 ? "top1" : ""}`;

          const left = document.createElement("div");
          left.className = "rank-left";
          left.innerHTML = `<span>${medals[idx]}</span>`;

          const nameSpan = document.createElement("span");
          nameSpan.className = "rank-name";
          nameSpan.textContent = entry.name;
          left.appendChild(nameSpan);

          const scoreSpan = document.createElement("span");
          scoreSpan.className = "rank-score";
          scoreSpan.textContent = `${entry.score}점`;

          li.appendChild(left);
          li.appendChild(scoreSpan);
          rankingListEl.appendChild(li);
        });
      } catch (err) {
        rankingStatusEl.textContent = "랭킹 불러오기 실패";
        console.warn(err);
      }
    }

    async function submitRunnerScore() {
      const rawName = nickInput.value.trim();
      if (!rawName) {
        nickInput.focus();
        return;
      }
      if (lastRunScore <= 0) return;

      localStorage.setItem("nakhwaRunnerNick", rawName);
      btnSubmitScore.disabled = true;
      btnSubmitScore.textContent = "저장 중...";

      try {
        const safeKey = getSafeKey(rawName);
        const encodedKey = encodeURIComponent(safeKey);
        const url = `${CONFIG.firebaseDbUrl}/runner_scores/${encodedKey}.json`;

        // 기존 동일 닉네임 최고 점수 확인 후 갱신
        const existingRes = await fetch(url);
        const existingData = await existingRes.json();
        const prevScore = existingData && typeof existingData.score === "number" ? existingData.score : 0;

        if (lastRunScore > prevScore) {
          await fetch(url, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: rawName,
              score: lastRunScore,
              updatedAt: Date.now()
            })
          });
          btnSubmitScore.textContent = "갱신 완료!";
        } else {
          btnSubmitScore.textContent = `기존 최고 ${prevScore}점`;
        }

        await fetchLeaderboard();
      } catch (err) {
        btnSubmitScore.disabled = false;
        btnSubmitScore.textContent = "다시 시도";
        console.warn("점수 저장 실패:", err);
      }
    }

    btnSubmitScore.addEventListener("click", submitRunnerScore);
    nickInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        submitRunnerScore();
      }
    });

    function openEasterGame() {
      easterModal.classList.add("active");
      document.body.style.overflow = "hidden";
      resetGame();
      fetchLeaderboard();
      if (!gameAnimId) gameLoop();
    }

    function closeEasterGame() {
      easterModal.classList.remove("active");
      document.body.style.overflow = "";
      isGameRunning = false;
      if (gameAnimId) {
        cancelAnimationFrame(gameAnimId);
        gameAnimId = null;
      }
    }

    btnCloseEaster.addEventListener("click", closeEasterGame);
    easterModal.addEventListener("click", (e) => {
      if (e.target === easterModal) closeEasterGame();
    });

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      jump();
    });

    function drawPlayer() {
      const px = Math.round(player.x);
      const py = Math.round(player.y);

      ctx.fillStyle = "#ff9eb5";
      ctx.fillRect(px + 2, py + 4, 20, 20);
      ctx.fillRect(px + 4, py + 2, 16, 22);

      ctx.fillStyle = "#e65c7b";
      ctx.fillRect(px + 14, py, 6, 5);
      ctx.fillStyle = "#fff";
      ctx.fillRect(px + 16, py + 2, 2, 2);

      ctx.fillStyle = "#18181d";
      ctx.fillRect(px + 14, py + 10, 3, 4);
      ctx.fillRect(px + 19, py + 10, 3, 4);

      ctx.fillStyle = "#d94868";
      const step = isGameOver ? 0 : Math.floor(frameCount / 6) % 2;
      if (!player.grounded) {
        ctx.fillRect(px + 5, py + 24, 5, 4);
        ctx.fillRect(px + 14, py + 22, 5, 4);
      } else if (step === 0) {
        ctx.fillRect(px + 4, py + 24, 5, 4);
        ctx.fillRect(px + 14, py + 24, 5, 2);
      } else {
        ctx.fillRect(px + 4, py + 24, 5, 2);
        ctx.fillRect(px + 14, py + 24, 5, 4);
      }
    }

    function drawObstacle(obs) {
      ctx.fillStyle = "#e65c7b";
      if (obs.type === "double") {
        ctx.beginPath();
        ctx.moveTo(obs.x, GROUND_Y);
        ctx.lineTo(obs.x + obs.w * 0.25, obs.y);
        ctx.lineTo(obs.x + obs.w * 0.5, GROUND_Y);
        ctx.lineTo(obs.x + obs.w * 0.75, obs.y + 4);
        ctx.lineTo(obs.x + obs.w, GROUND_Y);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(obs.x, GROUND_Y);
        ctx.lineTo(obs.x + obs.w / 2, obs.y);
        ctx.lineTo(obs.x + obs.w, GROUND_Y);
        ctx.closePath();
        ctx.fill();
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255, 165, 188, 0.45)";
      petals.forEach(p => {
        if (isGameRunning && !isGameOver) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.y > GROUND_Y) p.y = 0;
        }
        ctx.fillRect(p.x, p.y, p.r, p.r);
      });

      ctx.strokeStyle = "#343440";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      if (isGameRunning && !isGameOver) {
        frameCount++;
        score += 0.15;
        gameSpeed = Math.min(9.5, 4.5 + score * 0.004);

        player.vy += player.gravity;
        player.y += player.vy;
        if (player.y >= GROUND_Y - player.h) {
          player.y = GROUND_Y - player.h;
          player.vy = 0;
          player.grounded = true;
        }

        const lastObs = obstacles[obstacles.length - 1];
        const minGap = 190 + Math.random() * 140;
        if (!lastObs || canvas.width - lastObs.x > minGap) {
          if (Math.random() < 0.04) {
            const isDouble = score > 80 && Math.random() < 0.35;
            const w = isDouble ? 30 : 18;
            const h = 22 + Math.floor(Math.random() * 10);
            obstacles.push({
              x: canvas.width + 10,
              y: GROUND_Y - h,
              w,
              h,
              type: isDouble ? "double" : "single"
            });
          }
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= gameSpeed;

          const pad = 5;
          if (
            player.x + pad < obs.x + obs.w - pad &&
            player.x + player.w - pad > obs.x + pad &&
            player.y + pad < obs.y + obs.h &&
            player.y + player.h - 2 > obs.y + pad
          ) {
            isGameOver = true;
            lastRunScore = Math.floor(score);
            if (lastRunScore > highScore) {
              highScore = lastRunScore;
              localStorage.setItem("nakhwaRunnerBest", String(highScore));
            }
            if (lastRunScore > 0) {
              scoreSubmitBar.classList.add("active");
            }
          }

          if (obs.x + obs.w < 0) {
            obstacles.splice(i, 1);
          }
        }
      }

      obstacles.forEach(drawObstacle);
      drawPlayer();

      ctx.fillStyle = "#9898a6";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(
        `BEST ${String(highScore).padStart(4, "0")}   SCORE ${String(Math.floor(score)).padStart(4, "0")}`,
        canvas.width - 14,
        24
      );

      if (isGameOver) {
        ctx.fillStyle = "rgba(15, 15, 18, 0.68)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#f4f4f6";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`GAME OVER · ${lastRunScore}점 🌸`, canvas.width / 2, 86);

        ctx.fillStyle = "#ff8ca5";
        ctx.font = "600 13px sans-serif";
        ctx.fillText("캔버스 터치 또는 스페이스바로 다시 달리기", canvas.width / 2, 112);
      }

      if (easterModal.classList.contains("active")) {
        gameAnimId = requestAnimationFrame(gameLoop);
      }
    }

    document.addEventListener("keydown", (e) => {
      if (easterModal.classList.contains("active")) {
        if (document.activeElement === nickInput) {
          if (e.key === "Escape") nickInput.blur();
          return;
        }
        if (e.code === "Space" || e.key === "ArrowUp") {
          e.preventDefault();
          jump();
        } else if (e.key === "Escape") {
          closeEasterGame();
        }
        return;
      }

      if (!overlayEl.classList.contains("active")) return;
      if (e.key === "ArrowLeft" && currentEpisodeIndex > 0) {
        currentEpisodeIndex--;
        updateViewer();
      } else if (e.key === "ArrowRight" && currentEpisodeIndex < episodes.length - 1) {
        currentEpisodeIndex++;
        updateViewer();
      } else if (e.key === "Escape") {
        closeViewer();
      }
    });

    loadEpisodes();
  </script>
</body>
</html>
